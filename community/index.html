<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>PUBG INFO - 커뮤니티</title>

  <meta
    name="description"
    content="PUBG INFO 커뮤니티 - Discord에서 등록된 최신 게시물"
  >

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  >

  <!-- 메인 사이트 CSS 재사용 -->
  <link rel="stylesheet" href="../style.css">

  <style>
    .community-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      font-size: 12px;
      color: var(--text-muted, #888);
    }

    .community-source {
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(88, 101, 242, 0.12);
      color: #5865f2;
      font-weight: 600;
    }

    .community-content {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .community-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted, #888);
    }

    .community-status {
      font-size: 12px;
      color: var(--text-muted, #888);
      margin-left: 8px;
    }

    .community-loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted, #888);
    }

    .community-error {
      text-align: center;
      padding: 40px 20px;
      color: #e5484d;
    }

    .community-refresh {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-muted, #888);
      padding: 4px 0;
    }

    .community-refresh:hover {
      color: inherit;
    }
  </style>
</head>

<body>

  <!-- 헤더 -->
  <header class="header">
    <div class="header-wrap">

      <a class="logo" href="/">
        PUBG INFO
      </a>

      <button
        class="toggle"
        id="theme-toggle"
        aria-label="테마 전환"
      >
        <svg
          id="icon-sun"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>

        <svg
          id="icon-moon"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="display:none"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

    </div>
  </header>


  <main class="main">

    <!-- 페이지 제목 -->
    <section class="section fade-up" style="--d:0">

      <h2 class="section-title">
        PUBG INFO 커뮤니티
      </h2>

      <p style="margin: 0 0 15px; color: var(--text-muted, #888);">
        Discord에서 등록된 게시물을 확인할 수 있습니다.
      </p>

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:10px;
        "
      >

        <span
          id="community-status"
          class="community-status"
        >
          불러오는 중...
        </span>

        <button
          id="refresh-button"
          class="community-refresh"
        >
          새로고침
        </button>

      </div>

    </section>


    <!-- 게시물 -->
    <section
      class="section fade-up"
      style="--d:1"
    >

      <ul
        class="list"
        id="community-list"
      >

        <li>
          <div class="community-loading">
            게시물을 불러오는 중...
          </div>
        </li>

      </ul>

    </section>


    <!-- 안내 -->
    <section
      class="section fade-up"
      style="--d:2"
    >

      <h2 class="section-title">
        안내
      </h2>

      <ul class="list">

        <li>
          <div class="list-item">

            <span class="list-icon">
              💬
            </span>

            <span class="list-body">

              <span class="list-name">
                Discord에서 게시물 등록
              </span>

              <span class="list-desc">
                Discord의 /등록 명령어를 이용해 게시물을 등록할 수 있습니다.
              </span>

            </span>

          </div>
        </li>

      </ul>

    </section>

  </main>


  <!-- 푸터 -->
  <footer class="footer fade-up" style="--d:3">

    <div class="clock">

      <div class="clock-row">
        <span class="clock-label">
          UTC
        </span>

        <span
          class="clock-val"
          id="utc-time"
        >
          —
        </span>
      </div>

      <div class="clock-row clock-kst">
        <span class="clock-label">
          KST
        </span>

        <span
          class="clock-val"
          id="kst-time"
        >
          —
        </span>
      </div>

    </div>

    <p class="footer-copy">
      © PUBG INFO / All rights reserved
    </p>

  </footer>


  <script>

    /*
      ============================================
      Cloudflare Worker API
      ============================================
    */

    const API_URL =
      "https://pubginfo-api.pubgmk14-kr.workers.dev/messages";


    /*
      ============================================
      HTML 특수문자 처리
      ============================================
    */

    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value ?? "";

      return div.innerHTML;
    }


    /*
      ============================================
      날짜 표시
      ============================================
    */

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date =
        new Date(
          dateString.replace(" ", "T") + "+09:00"
        );

      if (Number.isNaN(date.getTime())) {
        return dateString;
      }

      return new Intl.DateTimeFormat(
        "ko-KR",
        {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(date);
    }


    /*
      ============================================
      게시물 불러오기
      ============================================
    */

    async function loadCommunity() {

      const list =
        document.getElementById(
          "community-list"
        );

      const status =
        document.getElementById(
          "community-status"
        );

      try {

        status.textContent =
          "불러오는 중...";

        const response =
          await fetch(API_URL, {
            cache: "no-store"
          });

        if (!response.ok) {
          throw new Error(
            "API 응답 오류: " +
            response.status
          );
        }

        const messages =
          await response.json();


        /*
          게시물이 없는 경우
        */

        if (
          !Array.isArray(messages) ||
          messages.length === 0
        ) {

          list.innerHTML = `
            <li>
              <div class="community-empty">
                아직 등록된 게시물이 없습니다.
              </div>
            </li>
          `;

          status.textContent =
            "게시물 0개";

          return;
        }


        /*
          게시물 표시
        */

        list.innerHTML = "";

        messages.forEach(message => {

          const li =
            document.createElement("li");

          li.innerHTML = `

            <div class="list-item">

              <span class="list-icon">
                💬
              </span>

              <span class="list-body">

                <span class="list-name community-content">
                  ${escapeHTML(message.content)}
                </span>

                <span class="community-meta">

                  <span class="community-source">
                    Discord
                  </span>

                  <span>
                    ${escapeHTML(message.author || "알 수 없음")}
                  </span>

                </span>

                <span class="list-desc">
                  ${escapeHTML(
                    formatDate(message.created_at)
                  )}
                </span>

              </span>

            </div>

          `;

          list.appendChild(li);

        });


        status.textContent =
          `게시물 ${messages.length}개`;

      } catch (error) {

        console.error(error);

        list.innerHTML = `
          <li>
            <div class="community-error">
              게시물을 불러오지 못했습니다.
            </div>
          </li>
        `;

        status.textContent =
          "연결 오류";
      }

    }


    /*
      ============================================
      새로고침 버튼
      ============================================
    */

    document
      .getElementById("refresh-button")
      .addEventListener(
        "click",
        loadCommunity
      );


    /*
      ============================================
      30초마다 자동 갱신
      ============================================
    */

    setInterval(
      loadCommunity,
      30000
    );


    /*
      ============================================
      첫 실행
      ============================================
    */

    loadCommunity();

  </script>


  <!-- 기존 PUBG INFO 스크립트 -->
  <script src="../script.js" defer></script>

</body>
</html>
