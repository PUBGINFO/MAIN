<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PUBG MOBILE 쿠폰 발송</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;

      --accent: #e8b020;
      --accent-lt: #f0c84a;
      --accent-bg: rgba(232,176,32,.09);
      --accent-bd: rgba(232,176,32,.25);

      --green: #38b870;

      --sans: 'DM Sans', 'Noto Sans KR', sans-serif;
      --mono: 'DM Mono', monospace;
      --ease: cubic-bezier(.4,0,.2,1);
    }

    /* ───────── LIGHT ───────── */

    [data-theme="light"] {
      --bg: #f5f4ef;
      --surface: #ffffff;
      --surface2: #f9f8f3;

      --bd: rgba(0,0,0,.07);
      --bd2: rgba(0,0,0,.13);

      --txt: #111827;
      --txt2: #6b7280;
      --txt3: #9ca3af;

      --sh-sm: 0 2px 8px rgba(0,0,0,.05);
    }

    /* ───────── DARK ───────── */

    [data-theme="dark"] {
      --bg: #0e1117;
      --surface: #161b24;
      --surface2: #1c2333;

      --bd: rgba(255,255,255,.07);
      --bd2: rgba(255,255,255,.13);

      --txt: #e8edf5;
      --txt2: #8892a4;
      --txt3: #4e5a6e;

      --sh-sm: 0 2px 8px rgba(0,0,0,.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: var(--sans);
      min-height: 100vh;

      transition:
        background .3s,
        color .3s;
    }

    /* ───────── TOPBAR ───────── */

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--bd);

      padding: 0 clamp(16px,4vw,36px);
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;

      background: var(--accent-bg);
      border: 1px solid var(--accent-bd);

      border-radius: var(--radius-sm);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    .logo-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--txt);
      letter-spacing: -.02em;
    }

    .logo-sub {
      font-size: 9px;
      color: var(--txt3);
      font-family: var(--mono);
      letter-spacing: .1em;
      margin-top: 2px;
    }

    /* ───────── THEME BUTTON ───────── */

    .icon-btn {
      width: 34px;
      height: 34px;

      border-radius: var(--radius-sm);

      border: 1px solid var(--bd2);
      background: var(--surface2);

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: all .15s;

      color: var(--txt2);
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-bg);
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
    }

    /* ───────── PAGE ───────── */

    .page {
      max-width: 860px;
      margin: 0 auto;

      padding:
        clamp(24px,5vw,48px)
        clamp(16px,4vw,36px)
        clamp(32px,6vw,64px);
    }

    /* ───────── HERO ───────── */

    .hero {
      margin-bottom: 28px;
      animation: fadeUp .35s var(--ease) both;
    }

    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;

      font-size: 10px;
      font-family: var(--mono);

      color: var(--accent);

      letter-spacing: .18em;
      text-transform: uppercase;

      margin-bottom: 10px;
    }

    .eyebrow-line {
      width: 20px;
      height: 1px;

      background: var(--accent);
      flex-shrink: 0;
    }

    h1 {
      font-size: clamp(20px,4vw,28px);

      font-weight: 700;
      color: var(--txt);

      letter-spacing: -.03em;
      line-height: 1.2;

      margin-bottom: 12px;
    }

    .hero-desc {
      font-size: 13px;
      color: var(--txt2);

      line-height: 1.8;
      max-width: 600px;

      font-weight: 300;

      margin-bottom: 16px;
    }

    /* ───────── NOTICE ───────── */

    .notice {
      display: flex;
      gap: 9px;
      align-items: flex-start;

      background: var(--surface2);

      border: 1px solid var(--bd);
      border-left: 2px solid var(--accent-bd);

      border-radius: var(--radius-sm);

      padding: 12px 14px;

      max-width: 600px;
    }

    .notice-txt {
      font-size: 12px;
      color: var(--txt2);

      line-height: 1.9;
      font-weight: 400;
    }

    .notice-txt b {
      color: var(--txt);
      font-weight: 600;
    }

    /* ───────── DIVIDER ───────── */

    .divider {
      height: 1px;
      background: var(--bd);

      margin-bottom: 24px;

      animation:
        fadeUp .35s .1s var(--ease) both;
    }

    /* ───────── FORM CARD ───────── */

    .form-card {
      background: var(--surface);

      border: 1px solid var(--bd);
      border-radius: var(--radius-lg);

      overflow: hidden;

      box-shadow: var(--sh-sm);

      animation:
        fadeUp .35s .15s var(--ease) both;
    }

    .form-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 13px 18px;

      border-bottom: 1px solid var(--bd);

      background: var(--surface2);

      flex-wrap: wrap;
      gap: 8px;
    }

    .form-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);
      box-shadow: 0 0 6px var(--green);

      animation:
        blink 2s ease infinite;
    }

    @keyframes blink {
      0%,100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .4;
        transform: scale(.75);
      }
    }

    .form-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--txt);
      letter-spacing: -.01em;
    }

    /* ───────── FORM HEADER ───────── */

    .chrome-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chrome-dots {
      display: flex;
      gap: 4px;
    }

    .chrome-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .chrome-dot:nth-child(1) {
      background: #f04e4e;
    }

    .chrome-dot:nth-child(2) {
      background: #f0a424;
    }

    .chrome-dot:nth-child(3) {
      background: var(--green);
    }

    .chrome-url {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--txt3);
      margin-left: 2px;
    }

    /* ───────── GOOGLE FORM ───────── */

    .form-card-body {
      width: 100%;
      overflow: hidden;
    }

    .form-card-body iframe {
      display: block;

      width: 100%;
      height: 962px;

      border: none;
      background: #fff;
    }

    /* ───────── FOOTER ───────── */

    .footer {
      margin-top: 24px;

      animation:
        fadeUp .35s .2s var(--ease) both;
    }

    .footer-copy {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--txt3);
    }

    /* ───────── ANIMATION ───────── */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ───────── MOBILE ───────── */

    @media (max-width: 560px) {

      .form-card-body iframe {
        height: 962px;
      }

      .chrome-url {
        display: none;
      }

      .hero-desc {
        font-size: 12.5px;
      }

      .notice-txt {
        font-size: 11.5px;
      }
    }
  </style>
</head>


<body>

  <script>

    /* 처음에는 화이트 모드 */

    let dark = false;


    function toggleTheme() {

      dark = !dark;


      document.documentElement.setAttribute(
        'data-theme',
        dark ? 'dark' : 'light'
      );


      document.getElementById('ico-dark').style.display =
        dark ? '' : 'none';


      document.getElementById('ico-light').style.display =
        dark ? 'none' : '';

    }

  </script>
