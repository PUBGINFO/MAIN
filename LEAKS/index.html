<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0e">
<title>PUBG INFO</title>
<meta property="og:title" content="4.7) X-SUIT">
<meta property="og:description" content="PUBG MOBILE - 유출 자료">
<meta property="og:image" content="https://github.com/PUBGINFO/MAIN/releases/download/4.7_x-suit/link1.jpg">
<meta property="og:url" content="https://pubginfo.site">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#0b0b0e;--bg-item:#121217;--bg-item-hover:#1a1a21;--line:#2a2a33;--text:#f0f0f4;--text-sub:#8e8e9a;--text-muted:#55555f}
[data-theme="dark"]{--bg:#0b0b0e;--bg-item:#121217;--bg-item-hover:#1a1a21;--line:#2a2a33;--text:#f0f0f4;--text-sub:#8e8e9a;--text-muted:#55555f}
[data-theme="dark"] body{background:radial-gradient(ellipse at 50% 0,#1e1b2e 0,var(--bg) 48%) no-repeat,var(--bg)}
[data-theme="light"]{--bg:#d8d8de;--bg-item:#e3e3e8;--bg-item-hover:#d2d2d9;--line:#b8b8c1;--text:#1a1a1f;--text-sub:#5c5c66;--text-muted:#8a8a94}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;color-scheme:dark}
html[data-theme="light"]{color-scheme:light}html[data-theme="dark"]{color-scheme:dark}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}
a{text-decoration:none;color:inherit}
ul{list-style:none}
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);transition:background .2s,border-color .2s}
.header-wrap{max-width:640px;margin:0 auto;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:center;position:relative}
.logo{font-size:17px;font-weight:700;letter-spacing:-.3px}
.toggle{position:absolute;right:20px;top:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--text-sub);cursor:pointer;transition:background .15s,color .15s}
.toggle:hover{background:var(--bg-item-hover);color:var(--text)}
.main{max-width:640px;margin:0 auto;padding:0 0 60px}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 20px 0}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex-shrink:0}
.name{font-size:24px;font-weight:700;letter-spacing:-.4px}
.bio{font-size:13px;line-height:1.6;color:var(--text-sub);margin-top:6px}
.section{padding:28px 0 0}
.section-title{font-size:12px;font-weight:600;color:var(--text-sub);letter-spacing:1px;text-align:center;padding:0 20px;margin-bottom:12px}
.list{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.list>li+li{border-top:1px solid var(--line)}
.list-item{display:flex;flex-direction:column;background:var(--bg-item);transition:background .12s;-webkit-tap-highlight-color:transparent}
.list-item:hover,.list-item:active{background:var(--bg-item-hover)}
.thumb{display:block;width:100%;aspect-ratio:var(--ratio,16/9);object-fit:cover;background:var(--bg-item-hover);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:15px 20px}
.list-body{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.list-name{font-size:15px;font-weight:500;line-height:1.3}
.list-desc{font-size:12px;color:var(--text-sub);line-height:1.4}
.list-arrow{width:16px;height:16px;color:var(--text-muted);flex-shrink:0;transition:transform .15s}
.list-item:hover .list-arrow{transform:translateX(2px)}
.status{text-align:center;font-size:12px;color:var(--text-sub);padding:18px 20px 0}
.footer{max-width:640px;margin:0 auto;padding:32px 20px 48px;border-top:1px solid var(--line);font-size:11px;color:var(--text-muted);text-align:center}
.hidden{display:none!important}
.fade-up{opacity:0;transform:translateY(12px);animation:fadeUp .4s ease forwards;animation-delay:calc(var(--d,0)*.07s + .05s)}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@media(min-width:641px){.header-wrap,.main,.footer{max-width:720px}.row{padding:16px 24px}.profile,.section-title,.status,.footer{padding-left:24px;padding-right:24px}.toggle{right:24px}.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<header class="header"><div class="header-wrap">
<span class="logo" id="logo">PUBG INFO</span>
<button class="toggle" id="toggle" type="button" aria-label="테마 전환">
<svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
<svg id="icon-sun" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
</div></header>
<main class="main">
<div class="profile fade-up" style="--d:0">
<img id="avatar" class="avatar hidden" alt="프로필 사진">
<div><h1 class="name" id="name">PUBG INFO</h1><p class="bio" id="bio"></p></div>
</div>
<section class="section fade-up" style="--d:1">
<h2 class="section-title" id="sectionTitle">LINKS</h2>
<ul class="list" id="links" aria-label="링크 목록"></ul>
<p class="status" id="status">링크를 불러오는 중...</p>
</section>
</main>
<footer class="footer">© <span id="year"></span> <span id="footerName">PUBG INFO</span></footer>
<script>
/* ====== 사용자가 수정할 설정 ====== */
const CONFIG={
  owner:'PUBGINFO',
  repo:'MAIN',
  // 원하는 Release 태그명. 빈 문자열이면 첫 번째 공개 Release 사용.
  tag:'4.7_x-suit', // 태그 규칙: (버전)_(출시 상품), 예: 4.7_x-suit
  name:'PUBG INFO',
  bio:'신규 X-SUIT 미리 보기.\n ',
  // Release assets 파일명 및 카드별 이동주소/제목/설명
  cards:[
    {asset:'link1.jpg',title:'Aether Miravix X-SUIT',description:'첫 번째 링크에 대한 설명',url:'https://vt.tiktok.com/ZSsLhMTCr/'},
    {asset:'link2.jpg',title:'Cascade Miravix X-SUIT',description:'두 번째 링크에 대한 설명',url:'https://vt.tiktok.com/ZSsLh149U/'},
    {asset:'link3.jpg',title:'Prism Miravix X-SUIT',description:'세 번째 링크에 대한 설명',url:'https://vt.tiktok.com/ZSsLr38LU/'}
  ],
  // 선택사항: avatar.jpg asset이 있으면 프로필에 사용
  // 이미지 표시 비율 (가로/세로). 비율이 달라도 가운데 기준으로 잘라서 꽉 채움. 예: '16/9', '4/3', '1/1'
  ratio:'16/9',
  section:'LINKS', // 목록 위 소제목
  // 카드별로 pos:'center top' 처럼 지정하면 잘리는 기준 위치 변경 가능 (세로로 긴 사진은 'center top' 추천)
  avatarAsset:'avatar.jpg',
  // 미리보기(OG) 이미지 우선순위: 앞에서부터 Release에 있는 첫 번째 파일 사용
  ogAssets:['link0','link1'] // 확장자 생략 가능(jpg/jpeg/png/webp/gif 자동 탐색)
};
/* ====== 설정 끝 ====== */
const $=id=>document.getElementById(id);
$('name').textContent=CONFIG.name;$('logo').textContent=CONFIG.name;$('sectionTitle').textContent=CONFIG.section||'LINKS';$('footerName').textContent=CONFIG.name;$('bio').innerHTML=CONFIG.bio.split('\n').map(escapeHTML).join('<br>');$('year').textContent=new Date().getFullYear();
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const IMG_EXT=['jpg','jpeg','png','webp','gif'];
function findAsset(files,name){
 if(files.has(name))return files.get(name);
 const base=name.replace(/\.[^.]+$/,'').toLowerCase();
 for(const e of IMG_EXT)for(const [n,u] of files)if(n.toLowerCase()===base+'.'+e)return u;
 return null;
}
function assetURL(asset){return `https://github.com/${CONFIG.owner}/${CONFIG.repo}/releases/download/${encodeURIComponent(CONFIG.tag)}/${encodeURIComponent(asset)}`;}
function renderCards(){
 const container=$('links');container.innerHTML='';document.documentElement.style.setProperty('--ratio',CONFIG.ratio||'16/9');
 CONFIG.cards.forEach(c=>{
  const li=document.createElement('li');
  const a=document.createElement('a');a.className='list-item';a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';
  const img=document.createElement('img');img.className='thumb';img.src=assetURL(c.asset);img.alt=c.title;img.loading='lazy';img.style.objectPosition=c.pos||'center';img.onload=()=>{img.style.opacity=''};img.onerror=()=>{img.style.opacity='.35';img.alt='이미지를 찾을 수 없습니다'};
  const info=document.createElement('div');info.className='list-body';const h=document.createElement('span');h.className='list-name';h.textContent=c.title;const p=document.createElement('span');p.className='list-desc';p.textContent=c.description;info.append(h,p);
  const arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');['class:list-arrow','viewBox:0 0 24 24','fill:none','stroke:currentColor','stroke-width:2','stroke-linecap:round','stroke-linejoin:round'].forEach(x=>{const [k,v]=x.split(':');arrow.setAttribute(k,v)});arrow.innerHTML='<path d="M9 6l6 6-6 6"/>';
  const row=document.createElement('div');row.className='row';row.append(info,arrow);a.append(img,row);li.append(a);container.append(li);
 });
}
async function loadRelease(){
 renderCards();
 try{
  const api=`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases/tags/${encodeURIComponent(CONFIG.tag)}`;
  const res=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});
  if(!res.ok)throw new Error(`GitHub API 응답 ${res.status}`);
  const release=await res.json();
  const files=new Map(release.assets.map(x=>[x.name,x.browser_download_url]));
  document.querySelectorAll('.thumb').forEach((img,i)=>{const u=findAsset(files,CONFIG.cards[i].asset);if(u&&img.src!==u)img.src=u;});
  const av=findAsset(files,CONFIG.avatarAsset);if(av){$('avatar').src=av;$('avatar').classList.remove('hidden');}
  const og=CONFIG.ogAssets.map(n=>findAsset(files,n)).find(Boolean);
  if(og){const m=document.querySelector('meta[property="og:image"]');if(m)m.setAttribute('content',og);}
  $('status').textContent='';
 }catch(e){$('status').textContent=' 이미지 연결 오류. PUBG INFO에 문의하여주세요';console.warn(e);}
}
loadRelease();
/* 테마 전환 */
(function(){
 const root=document.documentElement,btn=$('toggle'),moon=$('icon-moon'),sun=$('icon-sun'),meta=document.querySelector('meta[name="theme-color"]');
 const cur=()=>root.getAttribute('data-theme')||('dark');
 function apply(t){moon.classList.toggle('hidden',t==='dark');sun.classList.toggle('hidden',t!=='dark');if(meta)meta.content=t==='dark'?'#0b0b0e':'#d8d8de';}
 try{const s=localStorage.getItem('theme');if(s)root.setAttribute('data-theme',s);}catch(e){}
 apply(cur());
 btn.addEventListener('click',()=>{const n=cur()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}apply(n);});
})();
</script>
</body></html>
