<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PUBG INFO - V4.7 iOS 베타 테스터 모집</title>

  <meta property="og:title" content="PUBG INFO - V4.7 iOS 베타 테스터 모집">
  <meta property="og:description" content="PUBG MOBILE V4.7 iOS 베타 테스터 모집">
  <meta property="og:image" content="https://jf.x.com/images/media-preview/2057701131095314664">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://pubginfo.site/beta">
  <meta property="og:type" content="website">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  >

  <style>
    :root {
      --bg: #ffffff;
      --bg-item: #ffffff;
      --bg-item-hover: #f7f7f7;
      --line: #cccccc;
      --text: #111111;
      --text-sub: #888888;
      --text-muted: #bbbbbb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --bg-item: #111111;
        --bg-item-hover: #1c1c1c;
        --line: #3d3d3d;
        --text: #f0f0f0;
        --text-sub: #777777;
        --text-muted: #444444;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-family:
        'Pretendard Variable',
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        'Apple SD Gothic Neo',
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .header-wrap {
      max-width: 640px;
      height: 52px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .main {
      max-width: 640px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    .section {
      padding-top: 32px;
    }

    .section-title {
      padding: 0 20px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .list {
      list-style: none;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 20px;
      background: var(--bg-item);
      transition: background 0.12s;
    }

    .list-item:hover {
      background: var(--bg-item-hover);
    }

    .list-icon {
      width: 28px;
      font-size: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .list-body {
      flex: 1;
      min-width: 0;
    }

    .list-name {
      display: block;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.3;
    }

    .list-desc {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.3;
    }

    .list-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    @media (min-width: 641px) {
      .header-wrap,
      .main {
        max-width: 720px;
      }

      .list {
        margin: 0 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .section-title {
        padding-left: 24px;
        padding-right: 24px;
      }

      .list-item {
        padding: 16px 24px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-wrap">
    <a href="/" class="logo">PUBG INFO</a>
  </div>
</header>

<main class="main">

  <section class="section">
    <h2 class="section-title">베타 테스트</h2>

    <ul class="list">
      <li>
        <a
          class="list-item"
          href="https://forms.gle/Q8UpbJ1bMwBNBYuY8"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="list-icon">📝</span>

          <span class="list-body">
            <span class="list-name">
              V4.7 iOS 베타 테스터 모집
            </span>

            <span class="list-desc">
              Google Forms를 통해 신청
            </span>
          </span>

          <svg
            class="list-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </a>
      </li>
    </ul>
  </section>

</main>

</body>
</html>
