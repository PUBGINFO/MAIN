<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 - PUBG INFO</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    .field-error { margin: -4px 0 4px; font-size: 12px; line-height: 1.5; color: #d04444; }
    .field-error:empty { display: none; }
    .auth-form input[aria-invalid="true"] { border-color: #d04444; }
    .forgot-link { margin: -2px 0 4px; text-align: right; font-size: 12px; }
    .forgot-link a { color: var(--text-sub); text-decoration: underline; }
    .consent { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
    .consent input { width: auto; margin-top: 3px; }
    .consent a { text-decoration: underline; }
    .consent-note { font-size: 12px; line-height: 1.6; color: var(--text-sub); }
    .auth-footer-links { margin-top: 10px; font-size: 12px; color: var(--text-sub); text-align: center; }
    .auth-footer-links a { text-decoration: underline; }
  </style>
</head>
<body class="auth-locked">

  <div class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand">PUBG INFO</div>

      <h1>로그인</h1>
      <p>
        UC 계산기, 확률 계산기, 대회 일정 등<br>
        PUBG 모바일 정보를 한곳에서 확인하세요.
      </p>

      <form id="loginForm" class="auth-form" novalidate>
        <label for="loginId">아이디 또는 이메일</label>
        <input type="text" id="loginId" placeholder="아이디 또는 이메일"
          autocomplete="username" autocapitalize="none" spellcheck="false">
        <p class="field-error" id="loginIdError" role="alert"></p>

        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호"
          autocomplete="current-password">
        <p class="field-error" id="passwordError" role="alert"></p>

        <p class="forgot-link"><a href="/forgot-password.html">비밀번호를 잊으셨나요?</a></p>

        <button type="submit">로그인</button>
      </form>

      <p class="auth-message" id="message" role="status" aria-live="polite"></p>

      <p style="margin-top:6px; font-size:13px; color:var(--text-sub); text-align:center;">
        아직 계정이 없으신가요?
        <a href="/register.html" style="color:var(--text); font-weight:600;">회원가입</a>
      </p>
      <p class="auth-footer-links"><a href="/privacy.html">개인정보 처리방침</a></p>
    </div>
  </div>

  <script type="module">

    import { auth, db } from "./firebase.js";

    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const loginForm = document.getElementById("loginForm");
    const loginId = document.getElementById("loginId");
    const password = document.getElementById("password");
    const loginIdError = document.getElementById("loginIdError");
    const passwordError = document.getElementById("passwordError");
    const message = document.getElementById("message");
    const submitBtn = loginForm.querySelector('button[type="submit"]');

    // 아이디가 없는지, 비밀번호가 틀렸는지 구분되지 않도록 같은 문구를 쓴다.
    const LOGIN_FAILED = "아이디(또는 이메일) 또는 비밀번호가 올바르지 않습니다.";

    let busy = false;


    function setMessage(text, state) {
      message.textContent = text;
      if (state) {
        message.setAttribute("data-state", state);
      } else {
        message.removeAttribute("data-state");
      }
    }

    // 빈칸 아래에 빨간 글씨로 오류를 표시
    function setFieldError(input, errorEl, text) {
      errorEl.textContent = text;
      if (text) {
        input.setAttribute("aria-invalid", "true");
      } else {
        input.removeAttribute("aria-invalid");
      }
    }

    loginId.addEventListener("input", () => setFieldError(loginId, loginIdError, ""));
    password.addEventListener("input", () => setFieldError(password, passwordError, ""));


    if (new URLSearchParams(window.location.search).get("blocked") === "1") {
      setMessage("이용이 제한된 계정입니다. 문의가 필요하면 관리자에게 연락해주세요.", "error");
    }


    // 이미 로그인되어 있으면 로그인 화면을 건너뛴다.
    (async () => {
      try {
        await auth.authStateReady();
        const user = auth.currentUser;
        if (busy || !user) return;
        window.location.replace(user.emailVerified ? "/" : "/verify-email.html");
      } catch (error) {
        console.error(error);
      }
    })();


    // 아이디면 이메일로 변환, 이메일이면 그대로. 아이디가 없으면 null.
    async function resolveEmail(input) {
      const value = input.trim();
      if (value.includes("@")) return value;

      // 목록 조회가 아니라 문서 1건 조회 (아이디는 소문자로 저장됨)
      const snapshot = await getDoc(doc(db, "usernames", value.toLowerCase()));
      if (!snapshot.exists()) return null;
      return snapshot.data().email || null;
    }


    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      setMessage("", null);
      setFieldError(loginId, loginIdError, "");
      setFieldError(password, passwordError, "");

      // 빈칸 검사
      let firstInvalid = null;

      if (!loginId.value.trim()) {
        setFieldError(loginId, loginIdError, "아이디 또는 이메일을 입력해주세요.");
        firstInvalid = loginId;
      }

      if (!password.value) {
        setFieldError(password, passwordError, "비밀번호를 입력해주세요.");
        if (!firstInvalid) firstInvalid = password;
      }

      if (firstInvalid) {
        firstInvalid.focus();
        return;
      }

      busy = true;
      submitBtn.disabled = true;
      setMessage("로그인 중...", null);

      try {

        const email = await resolveEmail(loginId.value);

        if (!email) {
          throw { code: "app/login-failed" };
        }

        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password.value
        );

        // 이메일 인증 전이면 인증 화면으로 (메일 발송은 인증 화면에서 1회만)
        if (!credential.user.emailVerified) {
          window.location.replace("/verify-email.html?send=1");
          return;
        }

        setMessage("로그인 성공! 이동 중...", "success");
        window.location.href = "/";

      } catch (error) {

        console.error(error);

        busy = false;
        submitBtn.disabled = false;

        if (error.code === "auth/too-many-requests") {
          setMessage("로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.", "error");
        } else if (error.code === "auth/network-request-failed") {
          setMessage("네트워크 연결을 확인한 뒤 다시 시도해주세요.", "error");
        } else if (error.code === "permission-denied") {
          setMessage("아이디로 로그인할 수 없습니다. 이메일로 로그인해주세요.", "error");
        } else {
          setMessage(LOGIN_FAILED, "error");
        }

      }

    });

  </script>

</body>
</html>
