<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 - PUBG INFO</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-locked">

  <div class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand">PUBG INFO</div>

      <h1>로그인</h1>
      <p>
        UC 계산기, 확률 계산기, 대회 일정 등<br>
        PUBG 모바일 정보를 한곳에서 확인하세요.
      </p>

      <form id="loginForm" class="auth-form">
        <label for="loginId">아이디 또는 이메일</label>
        <input type="text" id="loginId" placeholder="아이디 또는 이메일" required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호" required>

        <button type="submit">로그인</button>
      </form>

      <p class="auth-message" id="message"></p>

      <p style="margin-top:6px; font-size:13px; color:var(--text-sub); text-align:center;">
        아직 계정이 없으신가요?
        <a href="/register.html" style="color:var(--text); font-weight:600;">회원가입</a>
      </p>
    </div>
  </div>

  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const loginForm = document.getElementById("loginForm");
    const loginId = document.getElementById("loginId");
    const password = document.getElementById("password");
    const message = document.getElementById("message");
    const submitBtn = loginForm.querySelector("button");


    function setMessage(text, state) {
      message.textContent = text;
      if (state) {
        message.setAttribute("data-state", state);
      } else {
        message.removeAttribute("data-state");
      }
    }


    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      submitBtn.disabled = true;
      setMessage("로그인 중...", null);


      try {

        let email = loginId.value.trim();


        // 이메일이 아니라 아이디를 입력한 경우
        if (!email.includes("@")) {

          const usersRef = collection(db, "users");

          const q = query(
            usersRef,
            where("username", "==", email)
          );

          const snapshot = await getDocs(q);


          if (snapshot.empty) {
            throw new Error("존재하지 않는 아이디입니다.");
          }


          const userData = snapshot.docs[0].data();

          email = userData.email;

        }


        // Firebase Authentication 로그인
        await signInWithEmailAndPassword(
          auth,
          email,
          password.value
        );


        setMessage("로그인 성공! 이동 중...", "success");

        // 로그인 성공
        window.location.href = "/";


      } catch (error) {

        console.error(error);

        submitBtn.disabled = false;

        if (error.message === "존재하지 않는 아이디입니다.") {

          setMessage(error.message, "error");

        } else {

          setMessage(
            "아이디(또는 이메일) 또는 비밀번호가 올바르지 않습니다.",
            "error"
          );

        }

      }

    });

  </script>

</body>
</html>
