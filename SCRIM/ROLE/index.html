<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PUBG INFO - 역할 관리</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      background:
        radial-gradient(
          circle at top,
          #252525 0%,
          #111 45%,
          #080808 100%
        );

      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;
    }

    .container {
      width: min(700px, calc(100% - 30px));
      margin: 40px auto;
    }

    .card {
      background: rgba(20, 20, 20, 0.96);
      border: 1px solid #333;
      border-radius: 14px;
      padding: 24px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .info-box {
      background: #171717;
      border: 1px solid #2f2f2f;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
    }

    .info-label {
      color: #999;
    }

    .info-value {
      font-weight: 600;
      text-align: right;
    }

    label {
      display: block;
      font-size: 14px;
      color: #bbb;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;

      border-radius: 9px;
      border: 1px solid #3a3a3a;

      background: #111;
      color: #fff;

      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #ffcc00;
    }

    button {
      border: 0;
      border-radius: 9px;

      padding: 12px 16px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;

      transition:
        opacity .15s,
        transform .1s;
    }

    button:hover {
      opacity: .9;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .yellow {
      background: #ffcc00;
      color: #111;
    }

    .dark {
      background: #292929;
      color: #fff;
      border: 1px solid #444;
    }

    .danger {
      background: #b92c2c;
      color: #fff;
    }

    .section {
      margin-top: 22px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .multi-select {
      position: relative;
    }

    .multi-select-button {
      width: 100%;
      background: #111;
      border: 1px solid #3a3a3a;
      color: #fff;

      display: flex;
      justify-content: space-between;
      align-items: center;

      text-align: left;
    }

    .multi-select-menu {
      position: absolute;
      z-index: 100;

      top: calc(100% + 7px);
      left: 0;
      right: 0;

      max-height: 360px;
      overflow-y: auto;

      background: #181818;
      border: 1px solid #3a3a3a;
      border-radius: 10px;

      padding: 8px;

      box-shadow:
        0 15px 35px rgba(0, 0, 0, .5);
    }

    .hidden {
      display: none;
    }

    .menu-actions {
      display: flex;
      gap: 8px;
      padding: 5px 4px 10px;

      border-bottom: 1px solid #333;
      margin-bottom: 6px;
    }

    .menu-actions button {
      flex: 1;
      padding: 9px;
      font-size: 12px;
    }

    .team-option {
      display: flex;
      align-items: center;

      gap: 10px;

      padding: 10px 8px;
      border-radius: 7px;

      cursor: pointer;
    }

    .team-option:hover {
      background: #252525;
    }

    .team-option input {
      width: auto;
      margin: 0;
      accent-color: #ffcc00;
    }

    .team-text {
      min-width: 0;
      flex: 1;
    }

    .team-seed {
      color: #ffcc00;
      font-weight: 700;
      margin-right: 8px;
    }

    .team-name {
      word-break: break-all;
    }

    .selected-info {
      margin-top: 9px;
      color: #aaa;
      font-size: 13px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 18px;
    }

    .buttons .full {
      grid-column: 1 / -1;
    }

    .status {
      margin-top: 18px;

      background: #101010;
      border: 1px solid #303030;

      border-radius: 9px;

      padding: 14px;

      font-size: 13px;
      line-height: 1.6;

      white-space: pre-line;
    }

    .success {
      color: #7dff9b;
    }

    .error {
      color: #ff7777;
    }

    .warning {
      color: #ffd35c;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 25px 10px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
      }

      .card {
        padding: 18px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .buttons .full {
        grid-column: auto;
      }

      .info-row {
        flex-direction: column;
        gap: 3px;
      }

      .info-value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>PUBG INFO 역할 관리</h1>

    <div class="subtitle">
      Google Sheets 정보를 기준으로 Discord 역할을 관리합니다.
    </div>

    <!-- 고정 정보 -->

    <div class="info-box">

      <div class="info-row">
        <span class="info-label">
          Discord 서버
        </span>

        <span class="info-value">
          PUBG INFO
        </span>
      </div>

      <div class="info-row">
        <span class="info-label">
          서버 ID
        </span>

        <span class="info-value">
          1413099667667026063
        </span>
      </div>

      <div class="info-row">
        <span class="info-label">
          관리 역할
        </span>

        <span class="info-value">
          白夜
        </span>
      </div>

      <div class="info-row">
        <span class="info-label">
          역할 ID
        </span>

        <span class="info-value">
          1541955349735538698
        </span>
      </div>

    </div>

    <!-- Google Sheet -->

    <div class="section">

      <div class="section-title">
        Google Sheets
      </div>

      <label for="sheetUrl">
        Google Sheets 주소
      </label>

      <input
        id="sheetUrl"
        type="url"
        placeholder="https://docs.google.com/spreadsheets/d/..."
      >

      <button
        id="loadSheetButton"
        class="yellow"
        style="width:100%; margin-top:10px;"
      >
        Google Sheets 정보 가져오기
      </button>

    </div>

    <!-- 팀 선택 -->

    <div
      class="section"
      id="selectionSection"
      style="display:none;"
    >

      <div class="section-title">
        대상 선택
      </div>

      <div class="multi-select">

        <button
          type="button"
          id="multiSelectButton"
          class="multi-select-button"
        >
          <span id="selectedCountText">
            선택된 항목 없음
          </span>

          <span>
            ▼
          </span>
        </button>

        <div
          id="multiSelectMenu"
          class="multi-select-menu hidden"
        >

          <div class="menu-actions">

            <button
              type="button"
              id="selectAllButton"
              class="dark"
            >
              전체 선택
            </button>

            <button
              type="button"
              id="unselectAllButton"
              class="dark"
            >
              전체 해제
            </button>

          </div>

          <div id="teamList"></div>

        </div>

      </div>

      <div
        id="selectedInfo"
        class="selected-info"
      >
        선택된 항목: 0개
      </div>

    </div>

    <!-- 실행 버튼 -->

    <div
      class="buttons"
      id="actionButtons"
      style="display:none;"
    >

      <button
        id="assignButton"
        class="yellow"
      >
        선택된 대상에게 白夜 지급
      </button>

      <button
        id="removeButton"
        class="danger"
      >
        선택된 대상에서 白夜 제거
      </button>

      <button
        id="removeAllButton"
        class="dark full"
      >
        서버의 白夜 역할 전체 제거
      </button>

    </div>

    <!-- 상태 -->

    <div
      id="status"
      class="status"
    >
      준비되었습니다.
    </div>

  </div>

</div>

<script>
  const API_BASE =
    "https://discord-bot.pubgmk14-kr.workers.dev";

  const FIXED_GUILD_ID =
    "1413099667667026063";

  const BAIYA_ROLE_ID =
    "1541955349735538698";

  const SHEET_URL_DEFAULT =
    "https://docs.google.com/spreadsheets/d/11WaBONeC1UQMymXvlc277y9-Cv36YWddW_BMkX2F0dg";

  let token =
    localStorage.getItem("session") || "";

  let sheetRows = [];

  const sheetUrlInput =
    document.getElementById(
      "sheetUrl"
    );

  const loadSheetButton =
    document.getElementById(
      "loadSheetButton"
    );

  const selectionSection =
    document.getElementById(
      "selectionSection"
    );

  const actionButtons =
    document.getElementById(
      "actionButtons"
    );

  const multiSelectButton =
    document.getElementById(
      "multiSelectButton"
    );

  const multiSelectMenu =
    document.getElementById(
      "multiSelectMenu"
    );

  const teamList =
    document.getElementById(
      "teamList"
    );

  const selectedCountText =
    document.getElementById(
      "selectedCountText"
    );

  const selectedInfo =
    document.getElementById(
      "selectedInfo"
    );

  const statusBox =
    document.getElementById(
      "status"
    );

  const assignButton =
    document.getElementById(
      "assignButton"
    );

  const removeButton =
    document.getElementById(
      "removeButton"
    );

  const removeAllButton =
    document.getElementById(
      "removeAllButton"
    );

  const selectAllButton =
    document.getElementById(
      "selectAllButton"
    );

  const unselectAllButton =
    document.getElementById(
      "unselectAllButton"
    );


  /* =====================================================
     기본 Sheet 주소
  ===================================================== */

  sheetUrlInput.value =
    SHEET_URL_DEFAULT;


  /* =====================================================
     API
  ===================================================== */

  async function api(
    path,
    options = {}
  ) {
    if (!token) {
      throw new Error(
        "로그인 세션이 없습니다."
      );
    }

    const headers = {
      "Content-Type":
        "application/json",

      "Authorization":
        `Bearer ${token}`,

      ...(options.headers || {})
    };

    const response =
      await fetch(
        API_BASE + path,
        {
          ...options,
          headers
        }
      );

    let data = null;

    try {
      data =
        await response.json();
    } catch {
      data = null;
    }

    if (!response.ok) {

      if (
        response.status === 401
      ) {
        localStorage.removeItem(
          "session"
        );

        token = "";

        throw new Error(
          "로그인 세션이 만료되었습니다. 다시 로그인해주세요."
        );
      }

      throw new Error(
        data?.error ||
        `HTTP ${response.status}`
      );
    }

    return data;
  }


  /* =====================================================
     로그인
  ===================================================== */

  function goLogin() {
    location.href =
      API_BASE + "/api/login";
  }


  /* =====================================================
     상태 표시
  ===================================================== */

  function setStatus(
    message,
    type = ""
  ) {
    statusBox.textContent =
      message;

    statusBox.className =
      "status";

    if (type) {
      statusBox.classList.add(
        type
      );
    }
  }


  /* =====================================================
     선택된 Sheet 항목
  ===================================================== */

  function getSelectedRows() {

    return sheetRows.filter(
      (_, index) => {

        const checkbox =
          document.querySelector(
            `.team-checkbox[data-index="${index}"]`
          );

        return (
          checkbox &&
          checkbox.checked
        );
      }
    );
  }


  /* =====================================================
     선택 개수 업데이트
  ===================================================== */

  function updateSelectionInfo() {

    const selected =
      getSelectedRows();

    selectedCountText.textContent =
      `${selected.length}개 선택됨`;

    selectedInfo.textContent =
      `전체 ${sheetRows.length}개 중 ${selected.length}개 선택됨`;

    if (
      selected.length === 0
    ) {
      selectedCountText.textContent =
        "선택된 항목 없음";
    }
  }


  /* =====================================================
     Sheet 목록 표시
  ===================================================== */

  function renderSheetRows() {

    teamList.innerHTML = "";

    if (
      sheetRows.length === 0
    ) {

      teamList.innerHTML = `
        <div class="empty">
          가져온 항목이 없습니다.
        </div>
      `;

      selectionSection.style.display =
        "block";

      actionButtons.style.display =
        "none";

      return;
    }

    sheetRows.forEach(
      (row, index) => {

        const wrapper =
          document.createElement(
            "label"
          );

        wrapper.className =
          "team-option";

        wrapper.innerHTML = `
          <input
            type="checkbox"
            class="team-checkbox"
            data-index="${index}"
            checked
          >

          <div class="team-text">

            <span class="team-seed">
              ${escapeHtml(
                row.seed || "-"
              )}
            </span>

            <span class="team-name">
              ${escapeHtml(
                row.nickname
              )}
            </span>

          </div>
        `;

        const checkbox =
          wrapper.querySelector(
            ".team-checkbox"
          );

        checkbox.addEventListener(
          "change",
          updateSelectionInfo
        );

        teamList.appendChild(
          wrapper
        );
      }
    );

    selectionSection.style.display =
      "block";

    actionButtons.style.display =
      "grid";

    updateSelectionInfo();
  }


  /* =====================================================
     HTML Escape
  ===================================================== */

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  /* =====================================================
     Sheet 가져오기
  ===================================================== */

  async function loadSheet() {

    const sheetUrl =
      sheetUrlInput.value.trim();

    if (!sheetUrl) {
      setStatus(
        "Google Sheets 주소를 입력해주세요.",
        "error"
      );

      return;
    }

    loadSheetButton.disabled =
      true;

    setStatus(
      "Google Sheets 정보를 가져오는 중..."
    );

    try {

      const encoded =
        encodeURIComponent(
          sheetUrl
        );

      const data =
        await api(
          `/api/role/sheet?url=${encoded}`
        );

      sheetRows =
        Array.isArray(data.rows)
          ? data.rows.filter(
              row =>
                String(
                  row.nickname || ""
                ).trim() !== ""
            )
          : [];

      renderSheetRows();

      setStatus(
        `Google Sheets 정보를 가져왔습니다.\n` +
        `사용 가능한 항목: ${sheetRows.length}개\n` +
        `모든 항목이 기본적으로 선택되었습니다.`,
        "success"
      );

    } catch (error) {

      setStatus(
        `❌ ${error.message}`,
        "error"
      );

    } finally {

      loadSheetButton.disabled =
        false;
    }
  }


  /* =====================================================
     선택된 닉네임 → Discord 멤버 찾기
  ===================================================== */

  async function resolveSelectedMembers() {

    const selected =
      getSelectedRows();

    if (
      selected.length === 0
    ) {
      throw new Error(
        "선택된 항목이 없습니다."
      );
    }

    const memberIds =
      new Set();

    const matchedInfo = [];

    for (
      let i = 0;
      i < selected.length;
      i++
    ) {

      const row =
        selected[i];

      setStatus(
        `Discord 멤버 확인 중...\n` +
        `${i + 1}/${selected.length}\n` +
        `닉네임: ${row.nickname}`
      );

      const encoded =
        encodeURIComponent(
          row.nickname
        );

      const data =
        await api(
          `/api/role/members?nickname=${encoded}`
        );

      const members =
        Array.isArray(
          data.members
        )
          ? data.members
          : [];

      matchedInfo.push({
        row,
        members
      });

      for (
        const member of members
      ) {
        if (member.id) {
          memberIds.add(
            member.id
          );
        }
      }
    }

    return {
      memberIds:
        [...memberIds],

      matchedInfo
    };
  }


  /* =====================================================
     선택 대상 역할 지급
  ===================================================== */

  async function assignSelected() {

    const selected =
      getSelectedRows();

    if (
      selected.length === 0
    ) {
      setStatus(
        "선택된 항목이 없습니다.",
        "warning"
      );

      return;
    }

    if (
      !confirm(
        `선택된 ${selected.length}개 항목의 Discord 멤버에게\n` +
        `「白夜」 역할을 지급하시겠습니까?`
      )
    ) {
      return;
    }

    assignButton.disabled =
      true;

    removeButton.disabled =
      true;

    removeAllButton.disabled =
      true;

    try {

      const resolved =
        await resolveSelectedMembers();

      if (
        resolved.memberIds.length === 0
      ) {
        setStatus(
          "선택된 닉네임과 정확히 일치하는 Discord 서버 닉네임을 가진 멤버가 없습니다.",
          "warning"
        );

        return;
      }

      setStatus(
        `역할 지급 중...\n` +
        `대상 Discord 멤버: ${resolved.memberIds.length}명`
      );

      const result =
        await api(
          "/api/role/assign-selected",
          {
            method: "POST",

            body:
              JSON.stringify({
                userIds:
                  resolved.memberIds
              })
          }
        );

      setStatus(
        `✅ 역할 지급 완료\n\n` +
        `대상 멤버: ${result.total}명\n` +
        `새로 지급: ${result.success}명\n` +
        `이미 보유: ${result.already}명\n` +
        `실패: ${result.failed}명`,
        result.failed > 0
          ? "warning"
          : "success"
      );

    } catch (error) {

      setStatus(
        `❌ ${error.message}`,
        "error"
      );

    } finally {

      assignButton.disabled =
        false;

      removeButton.disabled =
        false;

      removeAllButton.disabled =
        false;
    }
  }


  /* =====================================================
     선택 대상 역할 제거
  ===================================================== */

  async function removeSelected() {

    const selected =
      getSelectedRows();

    if (
      selected.length === 0
    ) {
      setStatus(
        "선택된 항목이 없습니다.",
        "warning"
      );

      return;
    }

    if (
      !confirm(
        `선택된 ${selected.length}개 항목에서\n` +
        `「白夜」 역할을 제거하시겠습니까?`
      )
    ) {
      return;
    }

    assignButton.disabled =
      true;

    removeButton.disabled =
      true;

    removeAllButton.disabled =
      true;

    try {

      const resolved =
        await resolveSelectedMembers();

      if (
        resolved.memberIds.length === 0
      ) {
        setStatus(
          "선택된 닉네임과 정확히 일치하는 Discord 서버 닉네임을 가진 멤버가 없습니다.",
          "warning"
        );

        return;
      }

      setStatus(
        `역할 제거 중...\n` +
        `대상 Discord 멤버: ${resolved.memberIds.length}명`
      );

      const result =
        await api(
          "/api/role/remove-selected",
          {
            method: "POST",

            body:
              JSON.stringify({
                userIds:
                  resolved.memberIds
              })
          }
        );

      setStatus(
        `✅ 역할 제거 완료\n\n` +
        `대상 멤버: ${result.total}명\n` +
        `제거: ${result.success}명\n` +
        `역할 없음: ${result.already}명\n` +
        `실패: ${result.failed}명`,
        result.failed > 0
          ? "warning"
          : "success"
      );

    } catch (error) {

      setStatus(
        `❌ ${error.message}`,
        "error"
      );

    } finally {

      assignButton.disabled =
        false;

      removeButton.disabled =
        false;

      removeAllButton.disabled =
        false;
    }
  }


  /* =====================================================
     서버 전체 白夜 제거
  ===================================================== */

  async function removeAll() {

    if (
      !confirm(
        "정말로 이 서버의 모든 白夜 역할을 제거하시겠습니까?"
      )
    ) {
      return;
    }

    assignButton.disabled =
      true;

    removeButton.disabled =
      true;

    removeAllButton.disabled =
      true;

    try {

      setStatus(
        "서버 전체 白夜 역할을 확인하는 중..."
      );

      const result =
        await api(
          "/api/role/remove-all",
          {
            method: "POST",

            body:
              JSON.stringify({})
          }
        );

      setStatus(
        `✅ 서버 전체 역할 제거 완료\n\n` +
        `확인된 대상: ${result.totalFound}명\n` +
        `제거 성공: ${result.success}명\n` +
        `실패: ${result.failed}명`,
        result.failed > 0
          ? "warning"
          : "success"
      );

    } catch (error) {

      setStatus(
        `❌ ${error.message}`,
        "error"
      );

    } finally {

      assignButton.disabled =
        false;

      removeButton.disabled =
        false;

      removeAllButton.disabled =
        false;
    }
  }


  /* =====================================================
     드롭다운
  ===================================================== */

  multiSelectButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      multiSelectMenu.classList.toggle(
        "hidden"
      );
    }
  );


  document.addEventListener(
    "click",
    event => {

      if (
        !multiSelectMenu.contains(
          event.target
        ) &&
        event.target !==
          multiSelectButton
      ) {
        multiSelectMenu.classList.add(
          "hidden"
        );
      }
    }
  );


  /* =====================================================
     전체 선택
  ===================================================== */

  selectAllButton.addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          ".team-checkbox"
        )
        .forEach(
          checkbox => {
            checkbox.checked =
              true;
          }
        );

      updateSelectionInfo();
    }
  );


  /* =====================================================
     전체 해제
  ===================================================== */

  unselectAllButton.addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          ".team-checkbox"
        )
        .forEach(
          checkbox => {
            checkbox.checked =
              false;
          }
        );

      updateSelectionInfo();
    }
  );


  /* =====================================================
     이벤트
  ===================================================== */

  loadSheetButton.addEventListener(
    "click",
    loadSheet
  );

  assignButton.addEventListener(
    "click",
    assignSelected
  );

  removeButton.addEventListener(
    "click",
    removeSelected
  );

  removeAllButton.addEventListener(
    "click",
    removeAll
  );


  /* =====================================================
     로그인 확인
  ===================================================== */

  if (!token) {

    setStatus(
      "로그인이 필요합니다. 페이지를 새로고침한 뒤 Discord 로그인을 진행해주세요.",
      "warning"
    );

  }

</script>

</body>
</html>
