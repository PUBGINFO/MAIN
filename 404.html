<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 (404 Not Found)</title>
<style>
  :root {
    --bg: #f7f7f8;
    --header-bg: #ffffff;
    --header-border: #ececec;
    --text-primary: #111111;
    --text-secondary: #9a9a9e;
    --line: #b9b9be;
    --btn-bg: #111111;
    --btn-text: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --header-bg: #1a1a1c;
      --header-border: #2a2a2c;
      --text-primary: #f5f5f5;
      --text-secondary: #8e8e93;
      --line: #6a6a6e;
      --btn-bg: #f5f5f5;
      --btn-text: #111111;
    }
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
    background-color: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  header {
    background-color: var(--header-bg);
    border-bottom: 1px solid var(--header-border);
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  header .logo-box {
    border: 1px solid var(--header-border);
    border-radius: 10px;
    padding: 6px 18px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  .illustration {
    width: 100%;
    max-width: 260px;
    margin-bottom: 40px;
  }

  .illustration svg {
    width: 100%;
    height: auto;
    stroke: var(--line);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .illustration .num404 {
    stroke: none;
    fill: var(--text-primary);
    font-size: 46px;
    font-weight: 800;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
  }

  .desc {
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 32px;
    max-width: 380px;
  }

  .btn-home {
    display: inline-block;
    background-color: var(--btn-bg);
    color: var(--btn-text);
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 6px;
    transition: opacity 0.15s ease;
  }

  .btn-home:hover {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <header>
    <div class="logo-box">
      <h1>PUBG INFO</h1>
    </div>
  </header>

  <main>
    <div class="illustration">
      <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
        <!-- browser window -->
        <rect x="10" y="10" width="180" height="140" rx="3"></rect>
        <line x1="10" y1="40" x2="190" y2="40"></line>
        <circle cx="23" cy="25" r="3"></circle>
        <circle cx="35" cy="25" r="3"></circle>
        <circle cx="47" cy="25" r="3"></circle>
        <text x="100" y="105" text-anchor="middle" class="num404">404</text>
      </svg>
    </div>

    <p class="desc">
      현재 입력하신 주소의 페이지는 삭제되었거나, 다른 페이지로 변경되었습니다.<br>
      주소를 다시 확인해 주세요.
    </p>

    <a href="./" class="btn-home">메인 페이지로 이동</a>
  </main>
</body>
</html>
