<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arsenal Database — PUBG Mobile Wiki</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --accent:#6c63ff;--accent-lt:#9d97ff;--accent-bg:rgba(108,99,255,.1);--accent-bd:rgba(108,99,255,.28);
  --red:#f04e4e;--pink:#e060a8;--purple:#9660dc;--blue:#4488e8;--green:#38b870;--orange:#f08030;
  --sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--ease:cubic-bezier(.4,0,.2,1);
  --r-sm:8px;--r-md:12px;--r-lg:16px;
}
[data-theme="dark"]{
  --bg:#0e1117;--surface:#161b24;--surface2:#1c2333;--surface3:#232d42;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --txt:#e8edf5;--txt2:#8892a4;--txt3:#4e5a6e;
  --sh:0 4px 24px rgba(0,0,0,.4);--sh-sm:0 2px 8px rgba(0,0,0,.3);
}
[data-theme="light"]{
  --bg:#f2f4f8;--surface:#fff;--surface2:#f8f9fc;--surface3:#edf0f7;
  --bd:rgba(0,0,0,.07);--bd2:rgba(0,0,0,.13);
  --txt:#111827;--txt2:#6b7280;--txt3:#9ca3af;
  --sh:0 4px 24px rgba(0,0,0,.08);--sh-sm:0 2px 8px rgba(0,0,0,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;transition:background .3s,color .3s;}
.layout{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{width:268px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s var(--ease);}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--bd);}
.logo-row{display:flex;align-items:center;gap:10px;}
.logo-icon{width:34px;height:34px;background:var(--accent-bg);border:1px solid var(--accent-bd);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-icon svg{width:18px;height:18px;color:var(--accent);}
.logo-name{font-size:15px;font-weight:700;letter-spacing:-.02em;}
.logo-sub{font-size:9px;color:var(--txt3);font-family:var(--mono);letter-spacing:.1em;}
.sb-search{padding:10px 12px;border-bottom:1px solid var(--bd);}
.search-inner{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--bd);border-radius:var(--r-sm);padding:7px 10px;transition:border-color .2s;}
.search-inner:focus-within{border-color:var(--accent);}
.search-inner svg{width:13px;height:13px;color:var(--txt3);flex-shrink:0;}
.search-inner input{background:none;border:none;outline:none;font-family:var(--sans);font-size:12.5px;color:var(--txt);width:100%;}
.search-inner input::placeholder{color:var(--txt3);}
.sb-tabs{display:flex;padding:8px 10px;gap:4px;border-bottom:1px solid var(--bd);}
.tab{flex:1;padding:7px 4px;font-size:11.5px;font-weight:500;color:var(--txt3);background:none;border:1px solid transparent;border-radius:var(--r-sm);cursor:pointer;transition:all .15s;font-family:var(--sans);text-align:center;}
.tab:hover{color:var(--txt2);}
.tab.active{background:var(--accent-bg);border-color:var(--accent-bd);color:var(--accent-lt);}
.sb-view{display:flex;gap:4px;padding:8px 12px 4px;}
.vbtn{flex:1;font-size:11px;font-family:var(--mono);padding:5px 0;border:1px solid var(--bd);border-radius:var(--r-sm);background:transparent;color:var(--txt3);cursor:pointer;transition:all .15s;text-align:center;}
.vbtn:hover{color:var(--txt2);border-color:var(--bd2);}
.vbtn.active{background:var(--accent-bg);border-color:var(--accent-bd);color:var(--accent-lt);}
.sb-list{flex:1;overflow-y:auto;padding:4px 0 8px;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent;}
.sb-list::-webkit-scrollbar{width:3px;}
.sb-list::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px;}
.sb-sec{font-size:9px;color:var(--txt3);font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:10px 16px 5px;}
.cat-item{display:flex;align-items:center;gap:8px;padding:7px 16px;cursor:pointer;transition:background .12s;position:relative;}
.cat-item:hover{background:var(--surface2);}
.cat-item.active{background:var(--accent-bg);}
.cat-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 2px 2px 0;}
.cat-name{font-size:12.5px;color:var(--txt2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-item.active .cat-name{color:var(--accent-lt);font-weight:500;}
.cat-cnt{font-size:10px;font-family:var(--mono);color:var(--txt3);}
.cat-item.active .cat-cnt{color:var(--accent);}
.sb-foot{padding:12px 16px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;}
.sf-item{text-align:center;}
.sf-val{font-size:17px;font-weight:700;}
.sf-lbl{font-size:9px;color:var(--txt3);font-family:var(--mono);}

/* Main */
.main{flex:1;margin-left:268px;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--bd);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.breadcrumb{font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:5px;}
.breadcrumb .cur{color:var(--txt);font-weight:500;}
.breadcrumb .sep{color:var(--txt3);}
.topbar-r{display:flex;align-items:center;gap:8px;}
.live-badge{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);color:var(--green);background:rgba(56,184,112,.1);border:1px solid rgba(56,184,112,.2);border-radius:20px;padding:4px 11px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s ease infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--bd2);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--txt2);}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
.icon-btn svg{width:15px;height:15px;}
.mob-btn{display:none;}
.content{flex:1;padding:24px;}

/* Grid */
.view-header{margin-bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.view-title{font-size:20px;font-weight:700;letter-spacing:-.02em;}
.view-sub{font-size:11px;color:var(--txt3);font-family:var(--mono);margin-top:2px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px;}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:13px;cursor:pointer;transition:all .18s var(--ease);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-bd);transition:background .18s;}
.card:hover{border-color:var(--accent-bd);transform:translateY(-2px);box-shadow:var(--sh-sm);}
.card:hover::before{background:var(--accent);}
.card-img{height:96px;border-radius:var(--r-sm);background:linear-gradient(150deg,var(--surface2),var(--surface3));display:flex;align-items:center;justify-content:center;margin-bottom:11px;position:relative;overflow:hidden;}
.card-img img{max-height:68px;max-width:88%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));}
.type-badge{position:absolute;top:7px;left:7px;font-size:9px;font-family:var(--mono);font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:var(--surface);border:1px solid var(--accent-bd);color:var(--accent-lt);}
.card-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
.card-meta{font-size:10.5px;font-family:var(--mono);color:var(--txt3);display:flex;gap:8px;flex-wrap:wrap;}
.card-meta .hl{color:var(--accent-lt);}
.grid-empty{padding:60px 20px;text-align:center;color:var(--txt3);grid-column:1/-1;}
.grid-empty svg{width:36px;height:36px;margin-bottom:12px;opacity:.4;}
.grid-empty p{font-size:12px;font-family:var(--mono);}

/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;}
.t-head,.t-row{display:grid;padding:0 14px;}
.t-head{background:var(--surface2);border-bottom:1px solid var(--bd);}
.th{font-size:9px;font-family:var(--mono);color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;padding:10px 7px;}
.t-row{border-bottom:1px solid var(--bd);align-items:center;transition:background .12s;cursor:pointer;}
.t-row:last-child{border-bottom:none;}
.t-row:hover{background:var(--surface2);}
.td{padding:9px 7px;font-size:12.5px;color:var(--txt);}
.td-rank{color:var(--txt3);font-family:var(--mono);font-size:11px;}
.td-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill{display:inline-flex;align-items:center;font-size:9.5px;font-family:var(--mono);padding:3px 8px;border-radius:20px;border:1px solid;white-space:nowrap;}
.bar-track{height:4px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:4px;}
.bar-fill{height:100%;border-radius:3px;transition:width .5s var(--ease);}

/* Weapons cols */
.t-cols-weapon{grid-template-columns:36px 1fr 90px 130px 80px 110px;}
/* Vehicles cols */
.t-cols-vehicle{grid-template-columns:36px 1fr 80px 80px 80px 90px;}

/* Detail */
.detail-view{animation:fadeUp .3s var(--ease);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);background:none;border:none;cursor:pointer;margin-bottom:14px;padding:4px 0;transition:color .15s;font-family:var(--sans);}
.back-btn:hover{color:var(--accent-lt);}
.back-btn svg{width:11px;height:11px;}
.detail-head{margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.detail-img{width:116px;height:116px;border-radius:var(--r-md);flex-shrink:0;background:linear-gradient(150deg,var(--surface2),var(--surface3));display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);}
.detail-img img{max-height:86px;max-width:88%;object-fit:contain;}
.detail-eyebrow{font-size:10px;font-family:var(--mono);color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;}
.detail-title{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;}
.detail-meta{font-size:12px;font-family:var(--mono);color:var(--txt3);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
.detail-meta .hl{color:var(--accent-lt);}
.sec-lbl{font-size:10px;font-family:var(--mono);color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 9px;}
.sec-lbl:first-of-type{margin-top:0;}
.stat-cards{display:flex;gap:8px;flex-wrap:wrap;}
.stat-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:13px 15px;flex:1;min-width:110px;}
.sc-lbl{font-size:9px;color:var(--txt3);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.sc-val{font-size:20px;font-weight:700;line-height:1;}
.sc-val span{font-size:10px;color:var(--txt3);font-weight:400;margin-left:2px;}
.sc-bar{margin-top:8px;}
.trait-row{display:flex;gap:9px;flex-wrap:wrap;}
.trait-card{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--bd);border-left:3px solid var(--green);border-radius:var(--r-md);padding:12px 14px;}
.trait-card.bad{border-left-color:var(--red);}
.trait-lbl{font-size:9px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px;}
.trait-txt{font-size:12.5px;color:var(--txt2);line-height:1.55;}
.map-grid{display:flex;flex-wrap:wrap;gap:6px;}
.map-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-family:var(--mono);padding:4px 10px;border-radius:20px;border:1px solid;font-weight:500;}
.map-chip.yes{color:var(--green);background:rgba(56,184,112,.1);border-color:rgba(56,184,112,.25);}
.map-chip.no{color:var(--txt3);background:var(--surface2);border-color:var(--bd);}
.map-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.attach-grid{display:flex;flex-wrap:wrap;gap:6px;}
.attach-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-family:var(--mono);padding:4px 10px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface2);color:var(--txt2);}
.attach-chip img{width:20px;height:20px;object-fit:contain;}

/* Loading */
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9999;transition:opacity .4s;}
.loading-overlay.hide{opacity:0;pointer-events:none;}
.spinner{width:30px;height:30px;border:2.5px solid var(--bd2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-txt{font-size:12px;color:var(--txt2);font-family:var(--mono);}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}
.sb-overlay.show{display:block;}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .mob-btn{display:flex;}
  .content{padding:14px;}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
<script src="gun-data.js"></script>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-txt">Loading arsenal data…</div>
</div>

<div class="layout">
  <div class="sb-overlay" id="sbOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="logo-row">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/>
            <line x1="12" y1="1.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22.5"/>
            <line x1="1.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22.5" y2="12"/>
          </svg>
        </div>
        <div>
          <div class="logo-name">Arsenal Database</div>
          <div class="logo-sub">PUBG MOBILE WIKI</div>
        </div>
      </div>
    </div>

    <div class="sb-search">
      <div class="search-inner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name…">
      </div>
    </div>

    <div class="sb-tabs">
      <button class="tab active" id="tabWeapon" onclick="switchTab('weapon')">Weapons</button>
      <button class="tab" id="tabVehicle" onclick="switchTab('vehicle')">Vehicles</button>
    </div>

    <div class="sb-view">
      <button class="vbtn active" id="vGrid" onclick="switchView('grid')">Grid</button>
      <button class="vbtn" id="vTable" onclick="switchView('table')">Table</button>
    </div>

    <div class="sb-list" id="catList"></div>

    <div class="sb-foot" id="sbFoot"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="icon-btn mob-btn" id="mobBtn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="breadcrumb" id="breadcrumb"></div>
      </div>
      <div class="topbar-r">
        <div class="live-badge"><span class="live-dot"></span><span id="liveCount">0 results</span></div>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────
let DB = { arms: [], vehicles: [] };

function imgSrc(path) {
  if (!path) return '';
  return path.startsWith('/') ? '.' + path : path;
}

// 데이터 소스의 실제 무기/차량 타입 필드값에 유연하게 대응하도록 초기화
let WEAPON_TYPES = [];
let VEHICLE_TYPES = [];

// ── State ─────────────────────────────────────────────
let state = {
  tab: 'weapon',       // 'weapon' | 'vehicle'
  view: 'grid',        // 'grid' | 'table'
  category: 'all',     // 'all' | type string
  search: '',
  detailId: null
};

// ── Boot ─────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (typeof pubgWeaponData !== 'undefined') {
    DB.arms     = pubgWeaponData.arms     || [];
    DB.vehicles = pubgWeaponData.vehicles || [];
    
    // 실제 데이터 내부의 고유한 type 값을 추출하여 유동적으로 카테고리 구성 생성
    WEAPON_TYPES = [...new Set(DB.arms.map(item => item.type).filter(Boolean))];
    VEHICLE_TYPES = [...new Set(DB.vehicles.map(item => item.type).filter(Boolean))];
  }
  
  setTimeout(() => {
    const overlay = document.getElementById('loadingOverlay');
    if(overlay) overlay.classList.add('hide');
  }, 300);

  document.getElementById('searchInput').addEventListener('input', e => {
    state.search   = e.target.value.toLowerCase();
    state.detailId = null;
    render();
  });
  
  document.getElementById('themeBtn').addEventListener('click', () => {
    const t = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'light' : 'dark');
  });
  
  const sidebar = document.getElementById('sidebar');
  const sbOverlay = document.getElementById('sbOverlay');
  document.getElementById('mobBtn').addEventListener('click', () => {
    sidebar.classList.add('open'); sbOverlay.classList.add('show');
  });
  sbOverlay.addEventListener('click', () => {
    sidebar.classList.remove('open'); sbOverlay.classList.remove('show');
  });

  render();
});

// ── Tab / View switches ───────────────────────────────
function switchTab(tab) {
  state.tab = tab; state.category = 'all'; state.detailId = null; state.search = '';
  document.getElementById('searchInput').value = '';
  render();
}
function switchView(view) {
  state.view = view; state.detailId = null;
  render();
}

// ── Helpers ───────────────────────────────────────────
function getPool() {
  return state.tab === 'weapon' ? DB.arms : DB.vehicles;
}
function getFiltered() {
  return getPool().filter(item => {
    const matchCat = state.category === 'all' || item.type === state.category;
    const matchQ   = item.name && item.name.toLowerCase().includes(state.search);
    return matchCat && matchQ;
  });
}
function typeList() {
  return state.tab === 'weapon' ? WEAPON_TYPES : VEHICLE_TYPES;
}

// ── Render ────────────────────────────────────────────
function render() {
  renderSidebar();
  if (state.detailId) {
    const pool = getPool();
    const item = pool.find(i => i.id === state.detailId);
    if (item) { renderDetail(item); return; }
  }
  renderList();
}

function renderSidebar() {
  // Tabs active toggle
  document.getElementById('tabWeapon').classList.toggle('active', state.tab === 'weapon');
  document.getElementById('tabVehicle').classList.toggle('active', state.tab === 'vehicle');
  document.getElementById('vGrid').classList.toggle('active', state.view === 'grid');
  document.getElementById('vTable').classList.toggle('active', state.view === 'table');

  // Category list 렌더링 수정 (카테고리 미생성 현상 해결)
  const pool  = getPool();
  const types = typeList();
  let html = `
    <div class="cat-item ${state.category === 'all' ? 'active' : ''}" onclick="setCategory('all')">
      <span class="cat-name">All ${state.tab === 'weapon' ? 'Weapons' : 'Vehicles'}</span>
      <span class="cat-cnt">${pool.length}</span>
    </div>
    <div class="sb-sec">Type</div>`;
    
  types.forEach(t => {
    const cnt = pool.filter(i => i.type === t).length;
    if (!cnt) return;
    html += `<div class="cat-item ${state.category === t ? 'active' : ''}" onclick="setCategory('${t}')">
      <span class="cat-name">${t.replace(/_/g,' ')}</span>
      <span class="cat-cnt">${cnt}</span>
    </div>`;
  });
  document.getElementById('catList').innerHTML = html;

  // Footer stats
  document.getElementById('sbFoot').innerHTML = `
    <div class="sf-item"><div class="sf-val">${DB.arms.length}</div><div class="sf-lbl">WEAPONS</div></div>
    <div class="sf-item"><div class="sf-val">${DB.vehicles.length}</div><div class="sf-lbl">VEHICLES</div></div>
    <div class="sf-item"><div class="sf-val">${DB.arms.length + DB.vehicles.length}</div><div class="sf-lbl">TOTAL</div></div>`;
}

function setCategory(cat) {
  state.category = cat; state.detailId = null; render();
}

function renderList() {
  const filtered = getFiltered();
  document.getElementById('liveCount').innerText = `${filtered.length} results`;
  document.getElementById('breadcrumb').innerHTML = `<span class="cur">${state.tab === 'weapon' ? 'Weapons' : 'Vehicles'}</span>`;

  const isWeapon = state.tab === 'weapon';
  let html = `<div style="animation:fadeUp .3s var(--ease)">
    <div class="view-header">
      <div>
        <h2 class="view-title">${isWeapon ? 'Arsenal' : 'Vehicles'} Overview</h2>
        <p class="view-sub">PUBG MOBILE · ${filtered.length} ITEMS</p>
      </div>
    </div>`;

  if (filtered.length === 0) {
    html += `<div class="card-grid"><div class="grid-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <p>No items found.</p></div></div>`;
  } else if (state.view === 'grid') {
    html += `<div class="card-grid">`;
    filtered.forEach(item => {
      const intro = item.arms_introduce || {};
      const meta  = isWeapon
        ? `<span>Ammo: <span class="hl">${intro.bullet || '-'}</span></span><span>DMG: <span class="hl">${intro.hurt || '-'}</span></span>`
        : `<span>Seats: <span class="hl">${intro.seat || '-'}</span></span><span>Top: <span class="hl">${intro.top || '-'}km/h</span></span>`;
      
      const itemType = item.type ? item.type.replace(/_/g,' ') : 'Unknown';
      html += `<div class="card" onclick="viewDetail('${item.id}')">
        <div class="card-img">
          <span class="type-badge">${itemType}</span>
          <img src="${imgSrc(item.image)}" alt="${item.name || ''}" onerror="this.style.display='none'">
        </div>
        <div class="card-name">${item.name || 'Unnamed'}</div>
        <div class="card-meta">${meta}</div>
      </div>`;
    });
    html += `</div>`;
  } else {
    // Table View
    const cols = isWeapon ? 't-cols-weapon' : 't-cols-vehicle';
    const heads = isWeapon
      ? ['#','NAME','AMMO','FIRE MODE','DMG','']
      : ['#','NAME','TYPE','SEATS','SPEED','DURABILITY'];
    html += `<div class="table-wrap">
      <div class="t-head ${cols}">${heads.map(h=>`<div class="th">${h}</div>`).join('')}</div>`;
    
    filtered.forEach((item, idx) => {
      const intro = item.arms_introduce || {};
      if (isWeapon) {
        html += `<div class="t-row ${cols}" onclick="viewDetail('${item.id}')">
          <div class="td td-rank">${idx+1}</div>
          <div class="td td-name">${item.name || 'Unnamed'}</div>
          <div class="td"><span class="pill" style="color:var(--green);background:rgba(56,184,112,.1);border-color:rgba(56,184,112,.2)">${intro.bullet || '-'}</span></div>
          <div class="td" style="font-size:11px;font-family:var(--mono);color:var(--txt2)">${intro.fireMethod || '-'}</div>
          <div class="td">
            <div style="font-weight:700;font-family:var(--mono)">${intro.hurt || 0}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${intro.hurt || 0}%;background:var(--accent)"></div></div>
          </div>
          <div class="td"></div>
        </div>`;
      } else {
        html += `<div class="t-row ${cols}" onclick="viewDetail('${item.id}')">
          <div class="td td-rank">${idx+1}</div>
          <div class="td td-name">${item.name || 'Unnamed'}</div>
          <div class="td"><span class="pill" style="color:var(--blue);background:rgba(68,136,232,.1);border-color:rgba(68,136,232,.2)">${intro.vehicle || 'Vehicle'}</span></div>
          <div class="td" style="font-family:var(--mono);font-weight:700">${intro.seat || '-'}</div>
          <div class="td" style="font-family:var(--mono);font-weight:700">${intro.top || 0}<span style="font-size:10px;color:var(--txt3);margin-left:2px">km/h</span></div>
          <div class="td">
            <div style="font-family:var(--mono);font-weight:700">${intro.blood || 0}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.min(parseInt(intro.blood || 0)/25,100)}%;background:var(--orange)"></div></div>
          </div>
        </div>`;
      }
    });
    html += `</div>`;
  }
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

function viewDetail(id) { state.detailId = id; render(); }
function closeDetail()  { state.detailId = null; render(); }

function renderDetail(item) {
  const intro    = item.arms_introduce || {};
  const isWeapon = state.tab === 'weapon';

  document.getElementById('liveCount').innerText = '1 result';
  document.getElementById('breadcrumb').innerHTML = `
    <span class="cur" onclick="closeDetail()" style="cursor:pointer">${isWeapon ? 'Weapons' : 'Vehicles'}</span>
    <span class="sep">/</span>
    <span class="cur">${item.name || 'Detail'}</span>`;

  // 1. Map Availability 파싱 완벽 수정 (오브젝트 배열 및 기본 필드 다중 매핑 대응)
  let mapHtml = '';
  if (Array.isArray(item.map)) {
    mapHtml = item.map.map(obj => {
      if (!obj) return '';
      // { Erangel: 1 } 형태 혹은 일반적인 원소 형태 모두 가공 처리
      const entries = Object.entries(obj);
      if (entries.length === 0) return '';
      const [name, val] = entries[0];
      const hasMap = val == 1 || val === true || val === "1";
      return `<span class="map-chip ${hasMap ? 'yes' : 'no'}"><span class="map-dot"></span>${name.replace(/_/g,' ')}</span>`;
    }).join('');
  } else if (item.map && typeof item.map === 'object') {
    mapHtml = Object.entries(item.map).map(([name, val]) => {
      const hasMap = val == 1 || val === true || val === "1";
      return `<span class="map-chip ${hasMap ? 'yes' : 'no'}"><span class="map-dot"></span>${name.replace(/_/g,' ')}</span>`;
    }).join('');
  } else {
    mapHtml = `<span class="view-sub" style="font-family:var(--mono)">No map data available</span>`;
  }

  let bodyHtml = '';
  if (isWeapon) {
    // 2. Attachments 파싱 완벽 수정 (item.arms_accessories 객체 구조 안전 가공)
    let attachHtml = '';
    const accList = item.arms_accessories || item.accessories || [];
    if (Array.isArray(accList) && accList.length > 0) {
      attachHtml = accList.map(a => {
        if (!a) return '';
        const name = a.accessories_name || a.name || 'Attachment';
        const img = a.accessories || a.image || '';
        return `<span class="attach-chip"><img src="${imgSrc(img)}" onerror="this.style.display='none'" alt="">${name}</span>`;
      }).join('');
    }

    bodyHtml = `
      <div class="sec-lbl" style="margin-top:0">Performance Rating</div>
      <div class="stat-cards">
        <div class="stat-card">
          <div class="sc-lbl">Damage</div>
          <div class="sc-val">${intro.hurt || 0}<span>/100</span></div>
          <div class="bar-track sc-bar"><div class="bar-fill" style="width:${intro.hurt || 0}%;background:var(--red)"></div></div>
        </div>
        <div class="stat-card">
          <div class="sc-lbl">Rate of Fire</div>
          <div class="sc-val">${intro.rateoffire || 0}<span>/100</span></div>
          <div class="bar-track sc-bar"><div class="bar-fill" style="width:${intro.rateoffire || 0}%;background:var(--purple)"></div></div>
        </div>
        <div class="stat-card">
          <div class="sc-lbl">Range</div>
          <div class="sc-val">${intro.range || 0}<span>/100</span></div>
          <div class="bar-track sc-bar"><div class="bar-fill" style="width:${intro.range || 0}%;background:var(--blue)"></div></div>
        </div>
        <div class="stat-card">
          <div class="sc-lbl">Stability</div>
          <div class="sc-val">${intro.precise || 0}<span>/100</span></div>
          <div class="bar-track sc-bar"><div class="bar-fill" style="width:${intro.precise || 0}%;background:var(--green)"></div></div>
        </div>
        <div class="stat-card">
          <div class="sc-lbl">Reload Speed</div>
          <div class="sc-val">${intro.loading || 0}<span>/100</span></div>
          <div class="bar-track sc-bar"><div class="bar-fill" style="width:${intro.loading || 0}%;background:var(--orange)"></div></div>
        </div>
      </div>
      <div class="sec-lbl">Evaluation</div>
      <div class="trait-row">
        <div class="trait-card">
          <div class="trait-lbl" style="color:var(--green)">Advantages</div>
          <div class="trait-txt">${intro.advantages || 'None'}</div>
        </div>
        <div class="trait-card bad">
          <div class="trait-lbl" style="color:var(--red)">Disadvantages</div>
          <div class="trait-txt">${intro.disadvantages || 'None'}</div>
        </div>
      </div>
      ${attachHtml ? `<div class="sec-lbl">Attachments</div><div class="attach-grid">${attachHtml}</div>` : ''}`;
  } else {
    bodyHtml = `
      <div class="sec-lbl" style="margin-top:0">Vehicle Specs</div>
      <div class="stat-cards">
        <div class="stat-card">
          <div class="sc-lbl">Seats</div>
          <div class="sc-val">${intro.seat || 0}<span>pax</span></div>
        </div>
        <div class="stat-card">
          <div class="sc-lbl">Top Speed</div>
          <div class="sc-val">${intro.top || 0}<span>km/h</span></div>
        </div>
        <div class="stat-card">
          <div class="sc-lbl">Durability</div>
          <div class="sc-val">${intro.blood || 0}</div>
          <div class="bar-track sc-bar"><div class="bar-fill" style="width:${Math.min(parseInt(intro.blood || 0)/25,100)}%;background:var(--orange)"></div></div>
        </div>
        <div class="stat-card">
          <div class="sc-lbl">Fuel Capacity</div>
          <div class="sc-val">${intro.fuel ? Number(intro.fuel).toLocaleString() : 0}</div>
        </div>
      </div>`;
  }

  const metaHtml = isWeapon
    ? `<span>Ammo: <span class="hl">${intro.bullet || '-'}</span></span>
       <span>Fire Mode: <span class="hl">${intro.fireMethod || '-'}</span></span>
       <span>Magazine: <span class="hl">${intro.magazine || '-'} rnd</span></span>`
    : `<span>Class: <span class="hl">${intro.vehicle || '-'}</span></span>
       <span>Seats: <span class="hl">${intro.seat || '-'}</span></span>`;

  const itemType = item.type ? item.type.replace(/_/g,' ') : 'Unknown';

  document.getElementById('content').innerHTML = `
    <div class="detail-view">
      <button class="back-btn" onclick="closeDetail()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to ${isWeapon ? 'Weapons' : 'Vehicles'}
      </button>
      <div class="detail-head">
        <div class="detail-img">
          <img src="${imgSrc(intro.arms_c || item.image)}" alt="${item.name || ''}" onerror="this.style.display='none'">
        </div>
        <div>
          <div class="detail-eyebrow">${itemType}</div>
          <h2 class="detail-title">${item.name || 'Unnamed'}</h2>
          <div class="detail-meta">${metaHtml}</div>
        </div>
      </div>
      ${bodyHtml}
      <div class="sec-lbl">Map Availability</div>
      <div class="map-grid">${mapHtml}</div>
    </div>`;
}
</script>
</body>
</html>
