<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 - PUBG INFO</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-locked">

  <div class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand">PUBG INFO</div>

      <h1>회원가입</h1>
      <p>
        PUBG INFO 계정을 만들고<br>
        UC 계산기 · 확률 계산기 · 대회 일정을 이용해보세요.
      </p>

      <form id="registerForm" class="auth-form">
        <label for="username">아이디</label>
        <input
          type="text"
          id="username"
          placeholder="4~20자"
          minlength="4"
          maxlength="20"
          required
        >

        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일 주소" required>

        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          placeholder="6자 이상"
          minlength="6"
          required
        >

        <label for="passwordConfirm">비밀번호 확인</label>
        <input
          type="password"
          id="passwordConfirm"
          placeholder="비밀번호 재입력"
          minlength="6"
          required
        >

        <button type="submit">회원가입</button>
      </form>

      <p class="auth-message" id="message"></p>

      <p style="margin-top:6px; font-size:13px; color:var(--text-sub); text-align:center;">
        이미 계정이 있으신가요?
        <a href="/login.html" style="color:var(--text); font-weight:600;">로그인</a>
      </p>
    </div>
  </div>


  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      collection,
      query,
      where,
      getDocs,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const registerForm = document.getElementById("registerForm");

    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const passwordConfirmInput = document.getElementById("passwordConfirm");

    const message = document.getElementById("message");
    const submitBtn = registerForm.querySelector("button");


    function setMessage(text, state) {
      message.textContent = text;
      if (state) {
        message.setAttribute("data-state", state);
      } else {
        message.removeAttribute("data-state");
      }
    }


    registerForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const passwordConfirm = passwordConfirmInput.value;


      setMessage("", null);


      // 비밀번호 확인
      if (password !== passwordConfirm) {

        setMessage("비밀번호가 일치하지 않습니다.", "error");

        return;
      }


      submitBtn.disabled = true;


      try {

        setMessage("가입 처리 중...", null);


        // 아이디 중복 확인
        const usersRef = collection(db, "users");

        const usernameQuery = query(
          usersRef,
          where("username", "==", username)
        );

        const usernameSnapshot = await getDocs(usernameQuery);


        if (!usernameSnapshot.empty) {

          setMessage("이미 사용 중인 아이디입니다.", "error");
          submitBtn.disabled = false;

          return;
        }


        // Firebase Authentication 계정 생성
        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user = userCredential.user;


        // Firestore 사용자 정보 저장
        await setDoc(
          doc(db, "users", user.uid),
          {
            username: username,
            email: email,
            role: "user",
            createdAt: serverTimestamp()
          }
        );


        setMessage("가입 완료! 이동 중...", "success");

        // 가입 즉시 로그인된 상태로 메인으로 이동
        window.location.href = "/";


      } catch (error) {

        console.error(error);

        submitBtn.disabled = false;


        if (error.code === "auth/email-already-in-use") {

          setMessage("이미 가입된 이메일입니다.", "error");

        } else if (error.code === "auth/invalid-email") {

          setMessage("올바른 이메일 주소를 입력해주세요.", "error");

        } else if (error.code === "auth/weak-password") {

          setMessage("비밀번호는 6자 이상이어야 합니다.", "error");

        } else {

          setMessage("회원가입 중 오류가 발생했습니다.", "error");

        }

      }

    });

  </script>

</body>
</html>
