<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG MOBILE - UC 계산기</title>
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="PUBG MOBILE - UC 계산기">
    <meta property="og:description" content="배틀그라운드 모바일 UC 최저가 계산기">
    <meta property="og:image" content="https://github.com/user-attachments/assets/08890d07-42a2-4c4a-a8b7-06d15a9a7c33">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://pubginfo.site">
    <meta property="og:type" content="website">
</head>
<body>

<div class="page" id="welcomePage">
    <div class="welcome-logo">UC 계산기</div>
    <div class="welcome-sub">PUBG MOBILE · 모바일 배틀그라운드</div>
    <div class="welcome-question">어떤 플랫폼의 정보를 원하시나요?</div>
    <div class="os-cards">

        <div class="os-card ios-card" onclick="selectOS('ios')">
            <div class="os-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-.96.04-2.13.64-2.82 1.45-.6.7-1.13 1.84-.99 2.94.1.08 2.16-.52 2.82-1.33z"/>
                </svg>
            </div>
            <div class="os-name">App Store (iOS)</div>
        </div>

        <div class="os-card android-card" onclick="selectOS('android')">
            <div class="os-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.523 15.3414c-.5511 0-1-.4489-1-1s.4489-1 1-1 1 .4489 1 1-.4489 1-1 1zm-11.046 0c-.5511 0-1-.4489-1-1s.4489-1 1-1 1 .4489 1 1-.4489 1-1 1zm11.546-4.9642l1.916-3.3186c.118-.2044.048-.4656-.156-.5836-.204-.118-.466-.048-.584.156l-1.942 3.3642C15.631 9.176 13.881 8.618 12 8.618c-1.881 0-3.631.558-5.257 1.4172L4.801 6.671c-.118-.204-.38-.274-.584-.156-.204.118-.274.3792-.156.5836l1.916 3.3186C2.784 12.353  layout.482 14.86 1.03 17.618h21.94c-.548-2.758-2.254-5.265-4.947-7.2408z"/>
                </svg>
            </div>
            <div class="os-name">Google Play (Android)</div>
        </div>

        <div class="os-card midas-card" onclick="selectOS('midasbuy')">
            <div class="os-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 22h20L12 2zm0 3.99L18.53 18H5.47L12 5.99zM11 11v4h2v-4h-2zm0-3v2h2V8h-2z"/>
                </svg>
            </div>
            <div class="os-name">MidasBuy (공식 웹숍)</div>
        </div>

    </div>
</div>

<div class="page hidden" id="calcPage">
    <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap=\"round\" stroke-linejoin=\"round\">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        플랫폼 선택으로 돌아가기
    </button>

    <h1 class="title" id="mainTitle">UC 최저가 계산기 <span class="title-badge" id="versionTag">v3.4</span></h1>
    
    <div class="calculator">
        <div class="input-group">
            <label id="inputLabel">필요한 UC를 입력하세요</label>
            <input type="number" id="mainInput" min="1" placeholder="예: 12000" onkeypress="handleEnterKey(event)">
        </div>
        
        <div class="checkbox-group" id="bonusRow">
            <input type="checkbox" id="useBonus" checked>
            <label for="useBonus">iOS 누적 충전 보너스 적용</label>
        </div>
        
        <button class="calc-btn" onclick="calculate()" id="calculateBtn">계산하기</button>
        <div id="result" class="result"></div>
        
        <div class="mode-toggle-wrapper">
            <div class="mode-pill">
                <div class="m-slider" id="mSlider"></div>
                <button class="m-tab active" id="tabPrice" onclick="setMode('price')">최저가 찾기</button>
                <button class="m-tab" id="tabUC" onclick="setMode('uc')">예산 맞춤</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
