<style>
:root{
  --bg:#f6f7f9; --bg2:#ffffff; --surface:#ffffff; --surface2:#f1f3f6;
  --border:#e4e7ec; --text:#111418; --text2:#5b6270; --text3:#9aa1ac;
  --accent:#2f6fed; --accent2:#7c5cff; --good:#12875a; --bad:#e0453c;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#0e1013; --bg2:#15171b; --surface:#17191d; --surface2:#1e2126;
  --border:#2a2d33; --text:#f0f1f3; --text2:#a8adb7; --text3:#6d727c;
  --accent:#5b8def; --accent2:#9c8bff; --good:#3ed195; --bad:#ff6b62;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; transition:background .3s,color .3s;
}
.page{width:100%; max-width:520px;}
.page.hidden{display:none !important;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.anim-up{animation:slideUp .38s cubic-bezier(.22,1,.36,1) both;}
.anim-down{animation:slideDown .38s cubic-bezier(.22,1,.36,1) both;}

/* top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:38px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); cursor:pointer; color:var(--text2); transition:all .2s;
}
.icon-btn:hover{background:var(--surface2); color:var(--text);}
.icon-btn svg{width:18px; height:18px;}
.back-link{display:inline-flex; align-items:center; gap:6px; font-size:.84rem; font-weight:600; color:var(--text3); background:none; border:none; cursor:pointer; padding:0; transition:color .2s;}
.back-link:hover{color:var(--text);}
.back-link svg{width:15px; height:15px;}

/* welcome */
#welcomePage{text-align:center;}
.welcome-logo{font-size:2.2rem; font-weight:800; letter-spacing:-.5px; margin-bottom:6px;}
.welcome-sub{font-size:.86rem; color:var(--text3); margin-bottom:40px;}
.welcome-question{font-size:.95rem; font-weight:600; color:var(--text2); margin-bottom:18px;}
.os-cards{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.os-card{
  flex:1; min-width:130px; max-width:160px; padding:26px 14px 20px;
  border-radius:18px; cursor:pointer; border:1px solid var(--border);
  background:var(--surface); transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.os-card:hover{transform:translateY(-4px); box-shadow:var(--shadow);}
.os-icon{width:44px; height:44px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; color:var(--text2);}
.os-icon svg{width:100%; height:100%;}
.os-name{font-size:.95rem; font-weight:700; margin-bottom:4px;}
.os-desc{font-size:.72rem; color:var(--text3); line-height:1.5;}

/* 플랫폼별 브랜드 컬러 포인트 */

.ios-card .os-icon{color:#2f6fed;}
.ios-card .os-name{color:#2f6fed;}
.ios-card:hover{border-color:#2f6fed;}

.aos-card{background:linear-gradient(160deg, rgba(52,168,83,.08), var(--surface) 55%);}
.aos-card .os-icon{color:#2fa757;}
.aos-card .os-name{color:#238a48;}
.aos-card:hover{border-color:#34a853;}

.midas-card{background:linear-gradient(160deg, rgba(245,158,11,.09), var(--surface) 55%);}
.midas-card .os-name{color:#e08a0c;}
.midas-card:hover{border-color:#f5a623;}
[data-theme="dark"] .ios-card{background:linear-gradient(160deg, rgba(59,130,246,.14), var(--surface) 55%);}
[data-theme="dark"] .aos-card{background:linear-gradient(160deg, rgba(52,168,83,.15), var(--surface) 55%);}

button.calc-btn{

.mode-pill{display:flex; background:var(--bg); border-radius:50px; padding:4px; gap:2px; position:relative; border:1px solid var(--border);}

<script>
let platform = 'ios', mode = 'price';

const data = {
    ios: [
        { price:1100,   baseUC:60,   bonusUC:0,    totalUC:60,   label:'60 UC' },
        { price:4400,   baseUC:180,  bonusUC:10,   totalUC:190,  label:'190 UC' },
        { price:14000,  baseUC:600,  bonusUC:60,   totalUC:660,  label:'660 UC' },
        { price:33000,  baseUC:1500, bonusUC:300,  totalUC:1800, label:'1,800 UC' },
        { price:66000,  baseUC:2950, bonusUC:900,  totalUC:3850, label:'3,850 UC' },
        { price:149000, baseUC:5900, bonusUC:2200, totalUC:8100, label:'8,100 UC' }
    ],
    android: [
        { price:1100,   baseUC:60,   bonusUC:0,    totalUC:60,   label:'60 UC' },
        { price:3300,   baseUC:180,  bonusUC:10,   totalUC:190,  label:'180 + 10 UC' },
        { price:11000,  baseUC:600,  bonusUC:60,   totalUC:660,  label:'600 + 60 UC' },
        { price:27500,  baseUC:1500, bonusUC:300,  totalUC:1800, label:'1,500 + 300 UC' },
        { price:55000,  baseUC:2950, bonusUC:900,  totalUC:3850, label:'2,950 + 900 UC' },
        { price:110000, baseUC:5900, bonusUC:2200, totalUC:8100, label:'5,900 + 2,200 UC' }
    ],
    midasbuy: [
        { price:1100,   baseUC:60,   bonusUC:0,    totalUC:60,   label:'60 UC' },
        { price:3300,   baseUC:180,  bonusUC:15,   totalUC:195,  label:'180 + 15 UC' },
        { price:11000,  baseUC:600,  bonusUC:80,   totalUC:680,  label:'600 + 80 UC' },
        { price:27500,  baseUC:1500, bonusUC:350,  totalUC:1850, label:'1,500 + 350 UC' },
        { price:55000,  baseUC:2950, bonusUC:1000, totalUC:3950, label:'2,950 + 1,000 UC' },
        { price:110000, baseUC:5900, bonusUC:2400, totalUC:8300, label:'5,900 + 2,400 UC' }
    ]
};

function getBonus(baseUC, on) {
    if (!on) return 0;
    let b = 0;
    if (baseUC >= 1000) b += 450;
    if (baseUC >= 2000) b += 450;
    if (baseUC >= 3000) b += 450;
    for (let i = 5000; i <= 39000; i += 2000) {
        if (baseUC >= i) b += 900; else break;
    }
    return b;
}

// ---- 테마 ----
function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('uc-theme', t);
}
function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function initTheme(){
    const saved = localStorage.getItem('uc-theme');
    applyTheme(saved === 'dark' ? 'dark' : 'light');
})();

// ---- DP 빌더: 그리디 선결제 + 좁힌 범위 DP 하이브리드 ----
function buildMinCostDP(pkgs, maxBaseUC) {
    const dp = new Array(maxBaseUC + 1).fill(Infinity);
    const dpTotal = new Array(maxBaseUC + 1).fill(0);
    const ch = new Array(maxBaseUC + 1).fill(-1);
    dp[0] = 0; dpTotal[0] = 0;
    for (let i = 0; i < pkgs.length; i++) {
        for (let j = pkgs[i].baseUC; j <= maxBaseUC; j++) {
            const prev = dp[j - pkgs[i].baseUC];
            if (prev === Infinity) continue;
            const newCost = prev + pkgs[i].price;
            const newTotal = dpTotal[j - pkgs[i].baseUC] + pkgs[i].totalUC;
            if (newCost < dp[j] || (newCost === dp[j] && newTotal > dpTotal[j])) {
                dp[j] = newCost; dpTotal[j] = newTotal; ch[j] = i;
            }
        }
    }
    return { dp, dpTotal, ch };
}

function traceback(ch, pkgs, startValue, key = 'baseUC') {
    const counts = new Array(pkgs.length).fill(0);
    let tmp = startValue;
    while (tmp > 0 && ch[tmp] !== -1) {
        const pkgIdx = ch[tmp];
        counts[pkgIdx]++;
        tmp -= pkgs[pkgIdx][key];
    }
    return counts;
}

function mergeCounts(base, extra) {
    return base.map((c, i) => c + (extra[i] || 0));
}

function countsToLines(pkgs, counts) {
    return pkgs.map((p, i) => counts[i] > 0 ? { price: p.price, label: p.label, qty: counts[i] } : null).filter(Boolean);
}

function totalPaymentClicks(counts) {
    return counts.reduce((a, b) => a + b, 0);
}

// ---- 페이지 전환 ----
function showPage(showId, hideId, animClass) {
    const s = document.getElementById(showId);
    const h = document.getElementById(hideId);
    if (h) h.classList.add('hidden');
    if (s) { s.classList.remove('hidden', 'anim-up', 'anim-down'); void s.offsetWidth; s.classList.add(animClass); }
}

function selectOS(os) {
    platform = os; mode = 'price';
    document.getElementById('result').classList.remove('show');
    document.getElementById('result').innerHTML = '';
    document.getElementById('mainInput').value = '';
    document.getElementById('useBonus').checked = true;
    document.getElementById('tabPrice').classList.add('active');
    document.getElementById('tabUC').classList.remove('active');
    document.getElementById('inputLabel').textContent = '필요한 UC를 입력하세요';
    document.getElementById('mainInput').placeholder = '예: 12000';
    document.getElementById('mainTitle').innerHTML = 'UC 최저가 계산기 <span class="title-badge">BETA</span>';
    const bonusRow = document.getElementById('bonusRow');
    if (bonusRow) bonusRow.style.display = os === 'ios' ? 'flex' : 'none';
    const verMap = { ios: 'v4.0 (iOS)', android: 'v4.0 (Android)', midasbuy: 'v4.0 (MidasBuy)' };
    document.getElementById('versionTag').textContent = verMap[os];
    showPage('calcPage', 'welcomePage', 'anim-up');
    setTimeout(() => updateMSlider(), 260);
    setTimeout(() => document.getElementById('mainInput').focus(), 420);
}

function goBack() {
    document.getElementById('versionTag').textContent = 'v4.0';
    showPage('welcomePage', 'calcPage', 'anim-down');
}

function updateMSlider() {
    const s = document.getElementById('mSlider');
    const t = document.getElementById(mode === 'price' ? 'tabPrice' : 'tabUC');
    if (s && t && t.offsetWidth > 0) {
        s.style.left = (t.offsetLeft - 4) + 'px';
        s.style.width = t.offsetWidth + 'px';
    }
}

function setMode(m) {
    if (mode === m) return;
    mode = m; resetResult();
    document.getElementById('tabPrice').classList.toggle('active', m === 'price');
    document.getElementById('tabUC').classList.toggle('active', m === 'uc');
    document.getElementById('inputLabel').textContent = m === 'price' ? '필요한 UC를 입력하세요' : '보유 예산을 입력하세요 (원)';
    document.getElementById('mainInput').placeholder = m === 'price' ? '예: 12000' : '예: 50000';
    document.getElementById('mainTitle').innerHTML = (m === 'price' ? 'UC 최저가 계산기' : 'UC 예산 계산기') + ' <span class="title-badge">BETA</span>';
    setTimeout(updateMSlider, 10);
    document.getElementById('mainInput').focus();
}

function resetResult() {
    const r = document.getElementById('result');
    if (r) { r.classList.remove('show'); r.innerHTML = ''; }
    document.getElementById('mainInput').value = '';
}

function handleEnterKey(e) { if (e.key === 'Enter') calculate(); }
function calculate() { mode === 'price' ? calcMinPrice() : calcMaxUC(); }

// ---- 모드 A: UC 입력 -> [최저 가격 / 최대 획득 / 묶음 위주] 3대 카드를 모두 분석하여 제안 ----
function calcMinPrice() {
    const input = document.getElementById('mainInput');
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('calculateBtn');
    const bonusOn = platform === 'ios' && document.getElementById('useBonus').checked;
    const targetUC = parseInt(input.value);
    if (isNaN(targetUC) || targetUC <= 0) return;

    btn.innerHTML = '<span class="loading"></span> 계산중...'; btn.disabled = true;

    setTimeout(() => {
        const pkgs = data[platform];
        const best = pkgs[pkgs.length - 1]; // 최고가 패키지
        const maxBase = Math.max(...pkgs.map(p => p.baseUC));

        // 1. 그리디 선결제 범위 축소
        let preBuyCount = 0;
        let remainingTarget = targetUC;
        const safetyMargin = maxBase * 2;
        if (targetUC > best.baseUC * 3) {
            const affordable = Math.floor((targetUC - safetyMargin) / best.baseUC);
            preBuyCount = Math.max(affordable, 0);
            remainingTarget = targetUC - preBuyCount * best.baseUC;
        }

        const searchMax = remainingTarget + maxBase * 3;
        const { dp, dpTotal, ch } = buildMinCostDP(pkgs, searchMax);

        // 2. 유효 후보군 생성
        const candidates = [];
        for (let b = 0; b <= searchMax; b++) {
            if (dp[b] === Infinity) continue;
            const preBase = preBuyCount * best.baseUC;
            const totalBase = preBase + b;
            const effective = (dpTotal[b] + preBuyCount * best.totalUC) + (bonusOn ? getBonus(totalBase, true) : 0);
            if (effective < targetUC) continue;
            const price = dp[b] + preBuyCount * best.price;
            candidates.push({ b, price, effective, totalBase });
        }

        if (candidates.length === 0) {
            resultDiv.innerHTML = '<div class="empty-msg">계산 가능한 조합을 찾지 못했습니다.</div>';
            resultDiv.classList.add('show');
            btn.innerHTML = '계산하기'; btn.disabled = false;
            return;
        }

        // 역추적 보조 함수들
        function countsOf(c) {
            const dpCounts = traceback(ch, pkgs, c.b, 'baseUC');
            dpCounts[pkgs.length - 1] += preBuyCount;
            return dpCounts;
        }
        function clicksOf(c) { return totalPaymentClicks(countsOf(c)); }

        // 3. 우승 후보 선출
        // [카드 1] 최저 가격 (Cheapest)
        candidates.sort((a, b) => a.price - b.price || b.effective - a.effective);
        const cCheapest = candidates[0];

        // [카드 2] 최대 획득 (가성비를 고려하여 약간의 마진(15% 이내)에서 획득량 극대화)
        const yieldCandidates = candidates.filter(c => c.price <= cCheapest.price * 1.15 && c.effective > cCheapest.effective);
        yieldCandidates.sort((a,b) => (a.price / a.effective) - (b.price / b.effective) || b.effective - a.effective);
        const cMaxYield = yieldCandidates.length > 0 ? yieldCandidates[0] : cCheapest;

        // [카드 3] 묶음 상품 위주 (25% 예산 추가 한도 내에서 결제 횟수가 최소인 구성)
        const bundleCandidates = candidates.filter(c => c.price <= cCheapest.price * 1.25);
        bundleCandidates.sort((a,b) => clicksOf(a) - clicksOf(b) || a.price - b.price);
        const cBundle = bundleCandidates.length > 0 ? bundleCandidates[0] : cCheapest;

        // 4. 어떤 추천 카드를 "★ 추천(Winner)"으로 강조 표시할지 의사결정폭포 가중치 판정
        let recommendedCard = cCheapest;
        let recommendedTag = '최저 가격';

        const priceMargin = Math.max(pkgs[0].price, cCheapest.price * 0.05);

        // [조건 1] 묶음 결제가 최저가와 비슷하거나 더 쌀 경우 묶음을 강력추천
        if (clicksOf(cBundle) < clicksOf(cCheapest) && (cBundle.price <= cCheapest.price || (cBundle.price - cCheapest.price) <= priceMargin)) {
            recommendedCard = cBundle;
            recommendedTag = '묶음 상품 위주';
        }
        // [조건 2] 돈 차이는 거의 안 나는데 보너스를 훨씬 더 많이 준다면 가성비 최대 획득을 추천
        else if (cMaxYield !== cCheapest && (cMaxYield.price - cCheapest.price) <= priceMargin && cMaxYield.effective > cCheapest.effective) {
            recommendedCard = cMaxYield;
            recommendedTag = '최대 획득 보너스';
        }

        // 5. 카드 렌더링 헬퍼 함수
        function renderPriceCard(tag, tagClass, c) {
            const counts = countsOf(c);
            const lines = countsToLines(pkgs, counts);
            const rate = (c.price / c.effective).toFixed(1);
            const isWinner = (c === recommendedCard);

            let html = `<div class="rec-card ${isWinner ? 'best' : ''}"><div class="rec-card-head">
                <span class="rec-tag ${isWinner ? 'tag-min' : tagClass}">${tag}${isWinner ? ' ★ 추천' : ''}</span>
                <span class="rec-price">${c.price.toLocaleString()}원</span>
              </div>
              <div class="rec-sub">획득 UC: <strong>${c.effective.toLocaleString()}</strong> · 단가 ${rate}원/UC</div>`;
            lines.forEach(l => {
                html += `<div class="pkg-line"><span>${l.price.toLocaleString()}원 (${l.label})</span><b>× ${l.qty}</b></div>`;
            });
            html += `</div>`;
            return html;
        }

        const avgRate = (recommendedCard.price / recommendedCard.effective).toFixed(1);
        let out = `<div class="rate-banner">
            <div><div class="rb-label">추천 조합 1 UC당 단가</div><div class="rb-value">${avgRate}원 / UC</div></div>
          </div><div class="cards">`;

        // 3대 카드 렌더링 (동일한 조합일 경우 중복 출력을 걸러줍니다)
        out += renderPriceCard('최저 가격', 'tag-simple', cCheapest);

        if (cMaxYield !== cCheapest) {
            out += renderPriceCard('최대 획득', 'tag-value', cMaxYield);
        }
        if (cBundle !== cCheapest && cBundle !== cMaxYield) {
            out += renderPriceCard('묶음 상품 위주', 'tag-min', cBundle);
        }
        out += `</div>`;

        resultDiv.innerHTML = out; resultDiv.classList.add('show');
        btn.innerHTML = '계산하기'; btn.disabled = false;
    }, 250);
}

// ---- 모드 B: 예산 입력 -> 최대 UC ----
function calcMaxUC() {
    const input = document.getElementById('mainInput');
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('calculateBtn');
    const bonusOn = platform === 'ios' && document.getElementById('useBonus').checked;
    const budget = parseInt(input.value);
    if (isNaN(budget) || budget <= 0) return;

    btn.innerHTML = '<span class="loading"></span> 계산중...'; btn.disabled = true;

    setTimeout(() => {
        const pkgs = data[platform];

        const cheapestRate = Math.min(...pkgs.map(p => p.price / p.baseUC));
        const maxBase = Math.ceil(budget / cheapestRate) + 6000;

        const dp = new Array(maxBase + 1).fill(Infinity);
        const dpTotal = new Array(maxBase + 1).fill(0);
        const dpClicks = new Array(maxBase + 1).fill(Infinity);
        const ch = new Array(maxBase + 1).fill(-1);
        dp[0] = 0; dpClicks[0] = 0;

        for (let i = 0; i < pkgs.length; i++) {
            for (let b = pkgs[i].baseUC; b <= maxBase; b++) {
                const prev = dp[b - pkgs[i].baseUC];
                if (prev === Infinity) continue;
                const nc = prev + pkgs[i].price;
                if (nc > budget) continue;
                const nt = dpTotal[b - pkgs[i].baseUC] + pkgs[i].totalUC;
                const nClicks = dpClicks[b - pkgs[i].baseUC] + 1;
                if (nc < dp[b] || (nc === dp[b] && nClicks < dpClicks[b]) || (nc === dp[b] && nClicks === dpClicks[b] && nt > dpTotal[b])) {
                    dp[b] = nc; dpTotal[b] = nt; dpClicks[b] = nClicks; ch[b] = i;
                }
            }
        }

        function traceCounts(b) {
            const counts = new Array(pkgs.length).fill(0);
            let tmp = b;
            while (tmp > 0 && ch[tmp] !== -1) { counts[ch[tmp]]++; tmp -= pkgs[ch[tmp]].baseUC; }
            return counts;
        }

        // 후보 수집
        const candidates = [];
        for (let b = 0; b <= maxBase; b++) {
            if (dp[b] === Infinity) continue;
            const bonus = bonusOn ? getBonus(b, true) : 0;
            const total = dpTotal[b] + bonus;
            if (total <= 0) continue;
            candidates.push({ base: b, cost: dp[b], total, clicks: dpClicks[b] });
        }

        if (candidates.length === 0) {
            resultDiv.innerHTML = '<div class="empty-msg">예산이 부족합니다.</div>';
            resultDiv.classList.add('show');
            btn.innerHTML = '계산하기'; btn.disabled = false;
            return;
        }

        // 카드 1: 최대 획득 UC
        candidates.sort((a, b) => b.total - a.total || a.cost - b.cost);
        const c1 = candidates[0];

        // 카드 2: 갓성비 역전 - UC가 c1보다 살짝 적더라도 단가가 훨씬 좋은 조합
        let c2 = c1;
        let bestRate = c1.cost / c1.total;
        candidates.forEach(c => {
            if (c1.total - c.total <= Math.max(pkgs[0].totalUC, c1.total * 0.03)) {
                const rate = c.cost / c.total;
                if (rate < bestRate - 0.001) { bestRate = rate; c2 = c; }
            }
        });

        // 카드 3: 결제 간편 - 총 UC가 c1의 90% 이상이면서 결제 횟수가 가장 적은 조합
        let c3 = c1;
        candidates.forEach(c => {
            if (c.total >= c1.total * 0.9) {
                if (c.clicks < c3.clicks || (c.clicks === c3.clicks && c.total > c3.total)) c3 = c;
            }
        });

        function renderCard(tag, tagClass, c) {
            const counts = traceCounts(c.base);
            const bonus = bonusOn ? getBonus(c.base, true) : 0;
            const remain = budget - c.cost;
            const rate = (c.cost / c.total).toFixed(1);
            let html = `<div class="rec-card"><div class="rec-card-head">
                <span class="rec-tag ${tagClass}">${tag}</span>
                <span class="rec-price">${c.total.toLocaleString()} UC</span>
              </div>
              <div class="rec-sub">사용: <strong>${c.cost.toLocaleString()}원</strong> / ${budget.toLocaleString()}원 · 단가 ${rate}원/UC${bonus ? ` · 누적보너스 ${bonus.toLocaleString()} UC 포함` : ''}${remain > 0 ? `<br>잔여: ${remain.toLocaleString()}원` : ''}</div>`;
            counts.forEach((cnt, i) => {
                if (cnt > 0) html += `<div class="pkg-line"><span>${pkgs[i].price.toLocaleString()}원 (${pkgs[i].label})</span><b>× ${cnt}</b></div>`;
            });
            html += `</div>`;
            return html;
        }

        const avgRate = (c1.cost / c1.total).toFixed(1);
        let out = `<div class="rate-banner">
            <div><div class="rb-label">추천 조합 1 UC당 단가</div><div class="rb-value">${avgRate}원 / UC</div></div>
          </div><div class="cards">`;
        out += renderCard('최대 획득', 'tag-min', c1);
        if (c2 !== c1) out += renderCard('갓성비 역전', 'tag-value', c2);
        if (c3 !== c1 && c3 !== c2) out += renderCard('결제 간편', 'tag-simple', c3);
        out += `</div>`;

        resultDiv.innerHTML = out; resultDiv.classList.add('show');
        btn.innerHTML = '계산하기'; btn.disabled = false;
    }, 250);
}
