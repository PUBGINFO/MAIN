/* =======================
   Variables (메인 사이트와 동일)
======================= */

  --bg:          #ffffff;

  --tag-update-text: #1a5abf;
  --tag-info-bg:     #f2f2f2;

}

@media (prefers-color-scheme: dark) {

    --bg:          #111111;
    --bg-item:     #111111;

    --tag-update-bg:   #001228;
    --tag-update-text: #5090e0;
    --tag-info-bg:     #1e1e1e;
    --tag-info-text:   #777777;
  }
}

[data-theme="dark"] {

/* =======================
   Reset
======================= */

html {

  -moz-osx-font-smoothing: grayscale;
}
body {
  background: var(--bg); color: var(--text);

}
a { text-decoration: none; color: inherit; }

/* =======================
   Header (메인 사이트와 동일)
======================= */
.header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--line); transition: background .2s, border-color .2s; }
.header-wrap { max-width: 800px; margin: 0 auto; padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
.logo-sub { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-left: 8px; letter-spacing: 0; }
.app { min-height: calc(100vh - 53px); display: flex; align-items: center; justify-content: center; padding: 24px; }
.page { width: 100%; max-width: 520px; }
.page.hidden { display: none !important; }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.anim-up   { animation: slideUp .4s ease both; }
.anim-down { animation: slideDown .4s ease both; }

/* =======================
   Top bar
======================= */

.pkg-line { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--bg-item-hover); margin-bottom: 5px; }

@media (max-width: 400px) {

</style>

<script>
let platform = 'android', mode = 'price';   // 'android' = iOS + Android 공용

// 2027.2.3 09:00 이후 가격 (전 플랫폼 동일) / 보너스 UC만 스토어별로 다름
const PRICES = [1300, 4000, 13000, 33000, 66000, 130000];
const data = {
    android: [   // iOS + Android
        { baseUC:60,   bonusUC:0,    totalUC:60,   label:'60 UC' },
        { baseUC:180,  bonusUC:10,   totalUC:190,  label:'180 + 10 UC' },
        { baseUC:600,  bonusUC:60,   totalUC:660,  label:'600 + 60 UC' },
        { baseUC:1500, bonusUC:300,  totalUC:1800, label:'1,500 + 300 UC' },
        { baseUC:2950, bonusUC:900,  totalUC:3850, label:'2,950 + 900 UC' },
        { baseUC:5900, bonusUC:2200, totalUC:8100, label:'5,900 + 2,200 UC' }
    ],
    midasbuy: [
        { baseUC:60,   bonusUC:0,    totalUC:60,   label:'60 UC' },
        { baseUC:180,  bonusUC:15,   totalUC:195,  label:'180 + 15 UC' },
        { baseUC:600,  bonusUC:80,   totalUC:680,  label:'600 + 80 UC' },
        { baseUC:1500, bonusUC:350,  totalUC:1850, label:'1,500 + 350 UC' },
        { baseUC:2950, bonusUC:1000, totalUC:3950, label:'2,950 + 1,000 UC' },
        { baseUC:5900, bonusUC:2400, totalUC:8300, label:'5,900 + 2,400 UC' }
    ]
};
const PLATFORM_NAME = { android:'iOS + Android', midasbuy:'MidasBuy' };
function getPkgs(os) { return data[os].map((p, i) => ({ ...p, price: PRICES[i] })); }

// ---- 테마 ----
function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('uc-theme', t);
}
function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme')
        || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function initTheme(){
    const saved = localStorage.getItem('uc-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
})();

// ---- DP 빌더: 총 UC(보너스 포함) 기준 최소비용 (정확히 u UC를 얻는 최소 가격) ----
function buildMinCostDP(pkgs, maxU) {
    const dp = new Array(maxU + 1).fill(Infinity);
    const dpClicks = new Array(maxU + 1).fill(Infinity);
    const ch = new Array(maxU + 1).fill(-1);
    dp[0] = 0; dpClicks[0] = 0;
    for (let u = 1; u <= maxU; u++) {
        for (let i = 0; i < pkgs.length; i++) {
            const t = pkgs[i].totalUC;
            if (u < t || dp[u - t] === Infinity) continue;
            const nc = dp[u - t] + pkgs[i].price;
            const ncl = dpClicks[u - t] + 1;
            if (nc < dp[u] || (nc === dp[u] && ncl < dpClicks[u])) {
                dp[u] = nc; dpClicks[u] = ncl; ch[u] = i;
            }
        }
    }
    return { dp, ch };
}

function traceback(ch, pkgs, startValue) {
    const counts = new Array(pkgs.length).fill(0);
    let tmp = startValue;
    while (tmp > 0 && ch[tmp] !== -1) {
        const pkgIdx = ch[tmp];
        counts[pkgIdx]++;
        tmp -= pkgs[pkgIdx].totalUC;
    }
    return counts;
}

function mergeCounts(base, extra) {
    return base.map((c, i) => c + (extra[i] || 0));
}

function countsToLines(pkgs, counts) {
    return pkgs.map((p, i) => counts[i] > 0 ? { price: p.price, label: p.label, qty: counts[i] } : null).filter(Boolean);
}

function totalPaymentClicks(counts) {
    return counts.reduce((a, b) => a + b, 0);
}

// ---- 페이지 전환 ----
function showPage(showId, hideId, animClass) {
    const s = document.getElementById(showId);
    const h = document.getElementById(hideId);
    if (h) h.classList.add('hidden');
    if (s) { s.classList.remove('hidden', 'anim-up', 'anim-down'); void s.offsetWidth; s.classList.add(animClass); }
}

function selectOS(os) {
    platform = os; mode = 'price';
    document.getElementById('result').classList.remove('show');
    document.getElementById('result').innerHTML = '';
    document.getElementById('mainInput').value = '';
    document.getElementById('tabPrice').classList.add('active');
    document.getElementById('tabUC').classList.remove('active');
    document.getElementById('inputLabel').textContent = '필요한 UC를 입력하세요';
    document.getElementById('mainInput').placeholder = '예: 12000';
    document.getElementById('mainTitle').innerHTML = 'UC 최저가 계산기 <span class="title-badge">BETA</span>';
    document.getElementById('platChip').textContent = PLATFORM_NAME[os];
    document.getElementById('versionTag').textContent = 'v5.0 (' + PLATFORM_NAME[os] + ')';
    showPage('calcPage', 'welcomePage', 'anim-up');
    setTimeout(() => updateMSlider(), 260);
    setTimeout(() => document.getElementById('mainInput').focus(), 420);
}

function goBack() {
    document.getElementById('versionTag').textContent = 'v5.0';
    showPage('welcomePage', 'calcPage', 'anim-down');
}

function updateMSlider() {
    const s = document.getElementById('mSlider');
    const t = document.getElementById(mode === 'price' ? 'tabPrice' : 'tabUC');
    if (s && t && t.offsetWidth > 0) {
        s.style.left = (t.offsetLeft - 4) + 'px';
        s.style.width = t.offsetWidth + 'px';
    }
}

function setMode(m) {
    if (mode === m) return;
    mode = m; resetResult();
    document.getElementById('tabPrice').classList.toggle('active', m === 'price');
    document.getElementById('tabUC').classList.toggle('active', m === 'uc');
    document.getElementById('inputLabel').textContent = m === 'price' ? '필요한 UC를 입력하세요' : '보유 예산을 입력하세요 (원)';
    document.getElementById('mainInput').placeholder = m === 'price' ? '예: 12000' : '예: 50000';
    document.getElementById('mainTitle').innerHTML = (m === 'price' ? 'UC 최저가 계산기' : 'UC 예산 계산기') + ' <span class="title-badge">BETA</span>';
    setTimeout(updateMSlider, 10);
    document.getElementById('mainInput').focus();
}

function resetResult() {
    const r = document.getElementById('result');
    if (r) { r.classList.remove('show'); r.innerHTML = ''; }
    document.getElementById('mainInput').value = '';
}

function handleEnterKey(e) { if (e.key === 'Enter') calculate(); }
function calculate() { mode === 'price' ? calcMinPrice() : calcMaxUC(); }

// ---- 모드 A: UC 입력 -> [최저 가격 / 최대 획득 / 묶음 위주] 3대 카드를 모두 분석하여 제안 ----
function calcMinPrice() {
    const input = document.getElementById('mainInput');
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('calculateBtn');
    const targetUC = parseInt(input.value);
    if (isNaN(targetUC) || targetUC <= 0) return;

    btn.innerHTML = '<span class="loading"></span> 계산중...'; btn.disabled = true;

    setTimeout(() => {
        const pkgs = getPkgs(platform);
        // UC당 단가가 가장 낮은 패키지 (큰 목표일 때 미리 담아두는 용도)
        const bestIdx = pkgs.reduce((bi, p, i) => (p.price / p.totalUC < pkgs[bi].price / pkgs[bi].totalUC ? i : bi), 0);
        const best = pkgs[bestIdx];
        const maxTotal = Math.max(...pkgs.map(p => p.totalUC));

        // 1. 큰 목표는 최저 단가 패키지를 먼저 담아 DP 범위 축소 (총 UC 기준)
        let preBuyCount = 0;
        let remainingTarget = targetUC;
        if (targetUC > best.totalUC * 3) {
            preBuyCount = Math.max(Math.floor((targetUC - maxTotal * 2) / best.totalUC), 0);
            remainingTarget = targetUC - preBuyCount * best.totalUC;
        }

        const searchMax = remainingTarget + maxTotal * 2;
        const { dp, ch } = buildMinCostDP(pkgs, searchMax);

        // 2. 유효 후보군: 총 UC가 목표 이상인 모든 (정확히 u UC) 조합
        const candidates = [];
        for (let u = Math.max(remainingTarget, 0); u <= searchMax; u++) {
            if (dp[u] === Infinity) continue;
            candidates.push({
                b: u,
                price: dp[u] + preBuyCount * best.price,
                effective: u + preBuyCount * best.totalUC
            });
        }

        if (candidates.length === 0) {
            resultDiv.innerHTML = '<div class="empty-msg">계산 가능한 조합을 찾지 못했습니다.</div>';
            resultDiv.classList.add('show');
            btn.innerHTML = '계산하기'; btn.disabled = false;
            return;
        }

        // 역추적 보조 함수들
        function countsOf(c) {
            const dpCounts = traceback(ch, pkgs, c.b);
            dpCounts[bestIdx] += preBuyCount;
            return dpCounts;
        }
        function clicksOf(c) { return totalPaymentClicks(countsOf(c)); }

        // 3. 우승 후보 선출
        // [카드 1] 최저 가격 (Cheapest)
        candidates.sort((a, b) => a.price - b.price || b.effective - a.effective);
        const cCheapest = candidates[0];

        // [카드 2] 가성비 (최저가 +15% 이내에서 UC당 단가가 가장 낮은 조합)
        const yieldCandidates = candidates.filter(c => c.price <= cCheapest.price * 1.15 && c.effective > cCheapest.effective);
        yieldCandidates.sort((a,b) => (a.price / a.effective) - (b.price / b.effective) || b.effective - a.effective);
        const cMaxYield = yieldCandidates.length > 0 ? yieldCandidates[0] : cCheapest;

        // [카드 3] 최대 획득 (최저가 +15% 이내에서 획득 UC가 가장 많은 조합, 같으면 더 저렴한 쪽)
        const cTopYield = candidates
            .filter(c => c.price <= cCheapest.price * 1.15)
            .reduce((best, c) => (c.effective > best.effective || (c.effective === best.effective && c.price < best.price)) ? c : best, cCheapest);

        // [카드 3] 묶음 상품 위주 (25% 예산 추가 한도 내에서 결제 횟수가 최소인 구성)
        const bundleCandidates = candidates.filter(c => c.price <= cCheapest.price * 1.25);
        bundleCandidates.sort((a,b) => clicksOf(a) - clicksOf(b) || a.price - b.price);
        const cBundle = bundleCandidates.length > 0 ? bundleCandidates[0] : cCheapest;

        // 4. 어떤 추천 카드를 "★ 추천(Winner)"으로 강조 표시할지 의사결정폭포 가중치 판정
        let recommendedCard = cCheapest;
        let recommendedTag = '최저 가격';

        const priceMargin = Math.max(pkgs[0].price, cCheapest.price * 0.05);

        // [조건 1] 묶음 결제가 최저가와 비슷하거나 더 쌀 경우 묶음을 강력추천
        if (clicksOf(cBundle) < clicksOf(cCheapest) && (cBundle.price <= cCheapest.price || (cBundle.price - cCheapest.price) <= priceMargin)) {
            recommendedCard = cBundle;
            recommendedTag = '묶음 상품 위주';
        }
        // [조건 2] 돈 차이는 거의 안 나는데 보너스를 훨씬 더 많이 준다면 가성비 최대 획득을 추천
        else if (cMaxYield !== cCheapest && (cMaxYield.price - cCheapest.price) <= priceMargin && cMaxYield.effective > cCheapest.effective) {
            recommendedCard = cMaxYield;
            recommendedTag = '가성비';
        }

        // 5. 카드 렌더링 헬퍼 함수
        function renderPriceCard(tag, tagClass, c) {
            const counts = countsOf(c);
            const lines = countsToLines(pkgs, counts);
            const rate = (c.price / c.effective).toFixed(1);
            const isWinner = (c === recommendedCard);

            let html = `<div class="rec-card ${isWinner ? 'best' : ''}"><div class="rec-card-head">
                <span class="rec-tag ${isWinner ? 'tag-min' : tagClass}">${tag}${isWinner ? ' ★ 추천' : ''}</span>
                <span class="rec-price">${c.price.toLocaleString()}원</span>
              </div>
              <div class="rec-sub">획득 UC: <strong>${c.effective.toLocaleString()}</strong> · 단가 ${rate}원/UC</div>`;
            lines.forEach(l => {
                html += `<div class="pkg-line"><span>${l.price.toLocaleString()}원 (${l.label})</span><b>× ${l.qty}</b></div>`;
            });
            html += `</div>`;
            return html;
        }

        const avgRate = (recommendedCard.price / recommendedCard.effective).toFixed(1);
        let out = `<div class="rate-banner">
            <div><div class="rb-label">추천 조합 1 UC당 단가</div><div class="rb-value">${avgRate}원 / UC</div></div>
          </div><div class="cards">`;

        // 3대 카드 렌더링 (동일한 조합일 경우 중복 출력을 걸러줍니다)
        out += renderPriceCard('최저 가격', 'tag-simple', cCheapest);

        if (cMaxYield !== cCheapest) {
            out += renderPriceCard('가성비 (단가↓)', 'tag-value', cMaxYield);
        }
        if (cTopYield !== cCheapest && cTopYield !== cMaxYield) {
            out += renderPriceCard('최대 획득', 'tag-min', cTopYield);
        }
        if (cBundle !== cCheapest && cBundle !== cMaxYield && cBundle !== cTopYield) {
            out += renderPriceCard('묶음 상품 위주', 'tag-min', cBundle);
        }
        out += `</div>`;

        resultDiv.innerHTML = out; resultDiv.classList.add('show');
        btn.innerHTML = '계산하기'; btn.disabled = false;
    }, 250);
}

// ---- 모드 B: 예산 입력 -> 최대 UC ----
function calcMaxUC() {
    const input = document.getElementById('mainInput');
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('calculateBtn');
    const budget = parseInt(input.value);
    if (isNaN(budget) || budget <= 0) return;

    btn.innerHTML = '<span class="loading"></span> 계산중...'; btn.disabled = true;

    setTimeout(() => {
        const pkgs = getPkgs(platform);

        // 가격 단위(최대공약수)로 나눠 "정확히 s×단위 원을 쓸 때 얻는 최대 UC"를 계산
        const gcd = (x, y) => y ? gcd(y, x % y) : x;
        const unit = pkgs.reduce((g, p) => gcd(g, p.price), 0);
        const steps = Math.floor(budget / unit);
        if (steps > 3000000) {
            resultDiv.innerHTML = '<div class="empty-msg">예산이 너무 큽니다. (최대 약 ' + (3000000 * unit).toLocaleString() + '원)</div>';
            resultDiv.classList.add('show');
            btn.innerHTML = '계산하기'; btn.disabled = false;
            return;
        }

        const dpU = new Array(steps + 1).fill(-1);
        const dpClicks = new Array(steps + 1).fill(Infinity);
        const ch = new Array(steps + 1).fill(-1);
        dpU[0] = 0; dpClicks[0] = 0;
        for (let st = 1; st <= steps; st++) {
            for (let i = 0; i < pkgs.length; i++) {
                const ps = pkgs[i].price / unit;
                if (st < ps || dpU[st - ps] < 0) continue;
                const nt = dpU[st - ps] + pkgs[i].totalUC;
                const ncl = dpClicks[st - ps] + 1;
                if (nt > dpU[st] || (nt === dpU[st] && ncl < dpClicks[st])) {
                    dpU[st] = nt; dpClicks[st] = ncl; ch[st] = i;
                }
            }
        }

        function traceCounts(st) {
            const counts = new Array(pkgs.length).fill(0);
            let tmp = st;
            while (tmp > 0 && ch[tmp] !== -1) { counts[ch[tmp]]++; tmp -= pkgs[ch[tmp]].price / unit; }
            return counts;
        }

        // 후보 수집 (예산 이하로 쓰는 모든 도달 가능 금액)
        const candidates = [];
        for (let st = 1; st <= steps; st++) {
            if (dpU[st] <= 0) continue;
            candidates.push({ st, cost: st * unit, total: dpU[st], clicks: dpClicks[st] });
        }

        if (candidates.length === 0) {
            resultDiv.innerHTML = '<div class="empty-msg">예산이 부족합니다.</div>';
            resultDiv.classList.add('show');
            btn.innerHTML = '계산하기'; btn.disabled = false;
            return;
        }

        // 카드 1: 최대 획득 UC
        candidates.sort((a, b) => b.total - a.total || a.cost - b.cost);
        const c1 = candidates[0];

        // 카드 2: 갓성비 역전 - UC가 c1보다 살짝 적더라도 단가가 훨씬 좋은 조합
        let c2 = c1;
        let bestRate = c1.cost / c1.total;
        candidates.forEach(c => {
            if (c1.total - c.total <= Math.max(pkgs[0].totalUC, c1.total * 0.03)) {
                const rate = c.cost / c.total;
                if (rate < bestRate - 0.001) { bestRate = rate; c2 = c; }
            }
        });

        // 카드 3: 결제 간편 - 총 UC가 c1의 90% 이상이면서 결제 횟수가 가장 적은 조합
        let c3 = c1;
        candidates.forEach(c => {
            if (c.total >= c1.total * 0.9) {
                if (c.clicks < c3.clicks || (c.clicks === c3.clicks && c.total > c3.total)) c3 = c;
            }
        });

        function renderCard(tag, tagClass, c) {
            const counts = traceCounts(c.st);
            const remain = budget - c.cost;
            const rate = (c.cost / c.total).toFixed(1);
            let html = `<div class="rec-card"><div class="rec-card-head">
                <span class="rec-tag ${tagClass}">${tag}</span>
                <span class="rec-price">${c.total.toLocaleString()} UC</span>
              </div>
              <div class="rec-sub">사용: <strong>${c.cost.toLocaleString()}원</strong> / ${budget.toLocaleString()}원 · 단가 ${rate}원/UC${remain > 0 ? `<br>잔여: ${remain.toLocaleString()}원` : ''}</div>`;
            counts.forEach((cnt, i) => {
                if (cnt > 0) html += `<div class="pkg-line"><span>${pkgs[i].price.toLocaleString()}원 (${pkgs[i].label})</span><b>× ${cnt}</b></div>`;
            });
            html += `</div>`;
            return html;
        }

        const avgRate = (c1.cost / c1.total).toFixed(1);
        let out = `<div class="rate-banner">
            <div><div class="rb-label">추천 조합 1 UC당 단가</div><div class="rb-value">${avgRate}원 / UC</div></div>
          </div><div class="cards">`;
        out += renderCard('최대 획득', 'tag-min', c1);
        if (c2 !== c1) out += renderCard('갓성비 역전', 'tag-value', c2);
        if (c3 !== c1 && c3 !== c2) out += renderCard('결제 간편', 'tag-simple', c3);
        out += `</div>`;

        resultDiv.innerHTML = out; resultDiv.classList.add('show');
        btn.innerHTML = '계산하기'; btn.disabled = false;
    }, 250);
}
