<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 PUBGM 국내대회 일정표</title>
    
    <meta property="og:title" content="2026 PUBGM 국내대회 일정표">
    <meta property="og:description" content="배틀그라운드 모바일 국내 대회 실시간 일정 및 정보 확인">
    <meta property="og:url" content="https://pubginfo.site/esports-loadmap-kr/">
    <meta property="og:type" content="website">

    <style>
        /* 기본 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 페이지 스크롤을 막고 시트 내부 스크롤만 활성화 */
        }

        /* 상단 헤더 영역 */
        .schedule-header {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            z-index: 10;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 라이브 애니메이션 뱃지 */
        .live-badge {
            background: #ef4444;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* 메인 계산기로 가기 버튼 */
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #fbbf24;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 8px 16px;
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #fbbf24;
            color: #0f0f1a;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
        }

        /* 구글 스프레드시트 반응형 래퍼 */
        .sheet-container {
            flex: 1;
            width: 100%;
            position: relative;
            background: #ffffff;
        }

        .sheet-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 모바일 최적화 미디어 쿼리 */
        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .back-btn {
                width: 100%;
                text-align: center;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>

    <header class="schedule-header">
        <div class="header-container">
            <h1 class="header-title">
                2026 PUBGM 국내대회 일정표 
                <span class="live-badge">LIVE</span>
            </h1>
            <a href="/" class="back-btn">← UC 계산기 가기</a>
        </div>
    </header>

    <main class="sheet-container">
        <<iframe 
    src="https://docs.google.com/spreadsheets/d/18nJMIkgdWOP6d1pQnrPKp1eB137JvA5te8IytP7BWqM/preview?widget=false&amp;headers=false&amp;chrome=false" 
    frameborder="0" 
    scrolling="yes"
    allowfullscreen>
</iframe>
    </main>
</body>
</html>
