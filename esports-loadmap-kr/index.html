<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 UC 이벤트 일정표</title>
    
    <meta property="og:title" content="2026 UC 이벤트 일정표">
    <meta property="og:description" content="2026 UC 이벤트 일정표">
    <meta property="og:url" content="https://pubginfo.site/esports-loadmap-kr/">
    <meta property="og:type" content="website">

    <style>
        /* 기본 디자인 세팅 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000; /* 전체 배경을 완전한 검은색으로 고정 */
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 네비게이션 헤더 */
        .schedule-header {
            background: #0f0f1a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            z-index: 10;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* LIVE 애니메이션 뱃지 */
        .live-badge {
            background: #ef4444;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* 메인 복귀 버튼 */
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #fbbf24;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #fbbf24;
            color: #000000;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }

        /* 💡 핵심: 하얀 배경을 없애고 표를 중앙 정렬하는 컨테이너 */
        .sheet-container {
            flex: 1;
            width: 100%;
            background: #000000; /* 구글 시트 여백을 덮어버릴 검은색 설정 */
            display: flex;
            justify-content: center; /* 가로 정중앙 정렬 */
            align-items: center;     /* 세로 정중앙 정렬 */
            position: relative;
        }

        .sheet-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000000;
        }

        /* 모바일 최적화 레이아웃 */
        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .back-btn {
                width: 100%;
                text-align: center;
                margin-top: 3px;
            }
        }
    </style>
</head>
<body>

    <header class="schedule-header">
        <div class="header-container">
            <h1 class="header-title">
                2026 UC 이벤트 일정표
                <span class="live-badge">LIVE</span>
            </h1>
            <a href="/" class="back-btn">← PUBG INFO WEB</a>
        </div>
    </header>

    <main class="sheet-container">
        <iframe 
            src="https://docs.google.com/spreadsheets/d/10HaYd2NioeYoCcuYnPY-Qd9N25YyotboQviAtWZ-HwM/preview?widget=false&amp;headers=false&amp;chrome=false" 
            frameborder="0" 
            scrolling="yes"
            allowfullscreen>
        </iframe>
    </main>

</body>
</html>
