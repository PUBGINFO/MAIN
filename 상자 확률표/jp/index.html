<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG 모바일 최신 확률표</title>
  <style>
    #chart-area img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h2>PUBG Mobile 최신 확률표</h2>
  
  <div id="chart-area">최신 확률표를 불러오는 중...</div>

  <script>
    const domain = 'https://pubgmobile.jp';
    const proxy = 'https://corsproxy.io/?';

    // 1. 에디터 ID 자동 검색 후 최신 글 가져오기
    async function loadLatestChart() {
      try {
        // 작성자(yu-murashita) 정보 조회
        const userUrl = proxy + encodeURIComponent(`${domain}/wp-json/wp/v2/users?slug=yu-murashita`);
        const userRes = await fetch(userUrl);
        const userData = await userRes.json();

        if (!userData || userData.length === 0) {
          document.getElementById('chart-area').innerText = '작성자 정보를 찾을 수 없습니다.';
          return;
        }

        const authorId = userData[0].id; // 작성자의 진짜 ID 확보

        // 해당 작성자가 올린 최신 글 1개 조회
        const postsUrl = proxy + encodeURIComponent(`${domain}/wp-json/wp/v2/posts?author=${authorId}&per_page=1`);
        const postsRes = await fetch(postsUrl);
        const postsData = await postsRes.json();

        if (postsData && postsData.length > 0) {
          const latestPostHtml = postsData[0].content.rendered;

          // HTML 내용 중에서 확률표 이미지 링크 추출
          const imgMatch = latestPostHtml.match(/src=\\"(https?:[^\"]+\.(?:png|jpg|jpeg))\\"/i) || 
                           latestPostHtml.match(/src="(https?:[^\"]+\.(?:png|jpg|jpeg))"/i);

          if (imgMatch && imgMatch[1]) {
            const cleanImgUrl = imgMatch[1].replace(/\\/g, '');
            document.getElementById('chart-area').innerHTML = 
              `<img src="${cleanImgUrl}" alt="PUBG Mobile 최신 확률표">`;
          } else {
            document.getElementById('chart-area').innerText = '최신 글에 이미지가 없습니다.';
          }
        } else {
          document.getElementById('chart-area').innerText = '작성된 글이 없습니다.';
        }

      } catch (err) {
        console.error(err);
        document.getElementById('chart-area').innerText = '확률표를 불러오지 못했습니다.';
      }
    }

    loadLatestChart();
  </script>

</body>
</html>
