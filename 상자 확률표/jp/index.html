<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG 모바일 확률표</title>
  <style>
    /* 이미지가 반응형으로 깔끔하게 보이도록 설정 */
    #probability-image-container img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h2>PUBG Mobile 최신 확률표</h2>

  <div id="probability-image-container">
    확률표를 불러오는 중입니다...
  </div>

  <script>
    const targetUrl = 'https://pubgmobile.jp/wp-json/wp/v2/pages?slug=probability-chart';
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

    fetch(proxyUrl)
      .then(response => response.json())
      .then(data => {
        if (data && data.length > 0) {
          const rawHtml = data[0].content.rendered;
          
          // HTML을 임시 엘리먼트로 변환
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = rawHtml;
          
          // 클릭 시 타 사이트로 이동시키는 <a> 태그(링크)를 모두 제거하고 내용물(이미지)만 남김
          const links = tempDiv.querySelectorAll('a');
          links.forEach(a => {
            while (a.firstChild) {
              a.parentNode.insertBefore(a.firstChild, a);
            }
            a.parentNode.removeChild(a);
          });

          // 이동 링크가 제거된 순수 이미지를 화면에 배치
          document.getElementById('probability-image-container').innerHTML = tempDiv.innerHTML;
        } else {
          document.getElementById('probability-image-container').innerText = '확률표 데이터를 찾을 수 없습니다.';
        }
      })
      .catch(error => {
        console.error('에러 발생:', error);
        document.getElementById('probability-image-container').innerText = '확률표를 불러오지 못했습니다.';
      });
  </script>

</body>
</html>
