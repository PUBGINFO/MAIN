<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG MOBILE JP 확률표</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
}

h2{
    padding:20px;
}

#chart-area{
    padding:20px;
}

#chart-area img{
    max-width:100%;
    height:auto;
    display:block;
    margin:0 auto;
}
</style>
</head>
<body>

<h2>PUBG MOBILE JP 최신 확률표</h2>

<div id="chart-area">불러오는 중...</div>

<script>
async function loadChart() {
    try {
        const response = await fetch("https://pubgm-crate-jp.pubgmk14-kr.workers.dev/");
        const data = await response.json();

        const html = data[0].content.rendered;

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        const img = doc.querySelector("img");

        if (!img) throw new Error("이미지를 찾을 수 없습니다.");

        document.getElementById("chart-area").innerHTML =
            `<img src="${img.src}" alt="PUBG MOBILE JP 확률표">`;

    } catch (e) {
        console.error(e);
        document.getElementById("chart-area").textContent =
            "확률표를 불러오지 못했습니다.";
    }
}

loadChart();
</script>

</body>
</html>
