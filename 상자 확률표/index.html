<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"DM Sans", sans-serif;
}

body{
    background:#f4f6fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:min(92%,520px);
    background:#fff;
    border-radius:18px;
    padding:40px 30px;
    box-shadow:0 15px 45px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:35px;
}

.logo h1{

    font-weight:700;

}

    margin-top:8px;
    font-size:14px;
    font-weight:400;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    border:1px solid #e5e7eb;
    border-radius:14px;
    text-decoration:none;
    color:#222;
    transition:.2s;
}

.item:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    border-color:#6c63ff;
}

.left{
    display:flex;
    align-items:center;
    gap:15px;
}

.flag{
    font-size:30px;
}

.title{
    font-size:18px;
    font-weight:700;
}

.desc{
    color:#888;
    font-size:13px;
    margin-top:4px;
    font-weight:400;
}

.arrow{
    font-size:22px;
    color:#999;
    font-family: "DM Mono", monospace;
}

.footer{
    margin-top:28px;
    text-align:center;
    color:#999;
    font-size:12px;
    font-family: "DM Mono", monospace;
}
</style>
</head>
