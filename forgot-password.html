<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex">
  <title>비밀번호 찾기 - PUBG INFO</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    .field-error { margin: -4px 0 4px; font-size: 12px; line-height: 1.5; color: #d04444; }
    .field-error:empty { display: none; }
    .auth-form input[aria-invalid="true"] { border-color: #d04444; }
    .wait-info { margin: 0; font-size: 12px; text-align: center; color: var(--text-sub); }
    .wait-info:empty { display: none; }
    .wait-info[data-state="error"] { color: #d04444; }
  </style>
</head>
<body class="auth-locked">

  <div class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand">PUBG INFO</div>

      <h1>비밀번호를 잊으셨나요?</h1>
      <p>
        가입할 때 사용한 이메일을 입력하면<br>
        비밀번호 재설정 링크를 보내드립니다.
      </p>

      <form id="forgotForm" class="auth-form" novalidate>
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="가입한 이메일 주소"
          autocomplete="email" autocapitalize="none" spellcheck="false">
        <p class="field-error" id="emailError" role="alert"></p>

        <button type="submit" id="sendBtn">재설정 메일 보내기</button>
        <p class="wait-info" id="waitInfo" role="timer" aria-live="off"></p>
      </form>

      <p class="auth-message" id="message" role="status" aria-live="polite"></p>

      <p style="margin-top:6px; font-size:13px; color:var(--text-sub); text-align:center;">
        <a href="/login.html" style="color:var(--text); font-weight:600;">로그인으로 돌아가기</a>
      </p>
    </div>
  </div>

  <script type="module">

    import { auth } from "./firebase.js";

    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import { formatWait } from "./auth-utils.js";

    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const emailError = document.getElementById("emailError");
    const message = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const waitInfo = document.getElementById("waitInfo");

    const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const SENT_NOTICE = "입력한 이메일로 비밀번호 재설정 안내 메일을 보냈습니다. 받은편지함과 스팸함을 확인해주세요.";
    const NOT_FOUND = "해당 이메일로 가입된 계정을 찾을 수 없습니다.";
    const STORE_KEY = "pubginfo:resetMailWait";
    const NORMAL_WAIT_SEC = 60;
    const LIMIT_WAIT_SEC = 15 * 60;

    let timer = null;
    let sending = false;

    function setMessage(text, state) {
      message.textContent = text;
      if (state) message.setAttribute("data-state", state);
      else message.removeAttribute("data-state");
    }

    function showError(text) {
      emailError.textContent = text;
      if (text) emailInput.setAttribute("aria-invalid", "true");
      else emailInput.removeAttribute("aria-invalid");
    }

    // 저장된 대기 정보: { until(ms), kind: "normal" | "limit" }
    function readWait() {
      try {
        const data = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (!data) return { left: 0, kind: "normal" };
        return { left: Math.max(0, Math.ceil((data.until - Date.now()) / 1000)), kind: data.kind };
      } catch (_) { return { left: 0, kind: "normal" }; }
    }

    function startWait(sec, kind) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ until: Date.now() + sec * 1000, kind: kind })); } catch (_) {}
      tick();
    }

    // 남은 시간을 1초마다 정확하게 표시
    function tick() {
      clearInterval(timer);
      const update = () => {
        const { left, kind } = readWait();
        if (left > 0) {
          sendBtn.disabled = true;
          sendBtn.textContent = "재설정 메일 보내기";
          waitInfo.textContent = kind === "limit"
            ? "요청이 너무 많아 잠시 제한됐어요. " + formatWait(left) + " 뒤에 다시 시도해주세요."
            : "재설정 메일은 " + formatWait(left) + " 뒤에 다시 보낼 수 있어요.";
          if (kind === "limit") waitInfo.setAttribute("data-state", "error");
          else waitInfo.removeAttribute("data-state");
        } else {
          sendBtn.disabled = sending;
          waitInfo.textContent = "";
          waitInfo.removeAttribute("data-state");
          clearInterval(timer);
        }
      };
      update();
      if (readWait().left > 0) timer = setInterval(update, 1000);
    }

    tick();

    emailInput.addEventListener("input", () => showError(""));

    form.addEventListener("submit", async (event) => {

      event.preventDefault();
      setMessage("", null);
      showError("");

      const email = emailInput.value.trim();

      if (!email) {
        showError("이메일을 입력해주세요.");
        emailInput.focus();
        return;
      }

      if (!EMAIL_PATTERN.test(email)) {
        showError("올바른 이메일 형식으로 입력해주세요.");
        emailInput.focus();
        return;
      }

      if (readWait().left > 0 || sending) return;

      sending = true;
      sendBtn.disabled = true;
      setMessage("재설정 메일 발송 중...", null);

      try {

        try {
          await sendPasswordResetEmail(auth, email, {
            url: window.location.origin + "/login.html"
          });
        } catch (error) {
          // 현재 도메인이 Firebase 승인된 도메인에 없으면 링크 없이 재시도
          if (
            error.code === "auth/unauthorized-continue-uri" ||
            error.code === "auth/invalid-continue-uri"
          ) {
            await sendPasswordResetEmail(auth, email);
          } else {
            throw error;
          }
        }

        setMessage(SENT_NOTICE, "success");
        sending = false;
        startWait(NORMAL_WAIT_SEC, "normal");

      } catch (error) {

        console.error("비밀번호 재설정 오류:", error);
        sending = false;

        if (error.code === "auth/user-not-found") {
          setMessage("", null);
          showError(NOT_FOUND);
          emailInput.focus();
          tick();
        } else if (error.code === "auth/invalid-email") {
          setMessage("", null);
          showError("올바른 이메일 형식으로 입력해주세요.");
          tick();
        } else if (error.code === "auth/too-many-requests") {
          setMessage("요청이 너무 많아 메일을 보내지 못했습니다.", "error");
          startWait(LIMIT_WAIT_SEC, "limit");
        } else {
          setMessage("재설정 메일을 보내지 못했습니다. 잠시 후 다시 시도해주세요.", "error");
          tick();
        }

      }

    });

  </script>

</body>
</html>
