<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMHI 2026 - 관리자</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 30px 16px;
  }

  /* 로그인 화면 */
  #loginScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    gap: 16px;
  }
  #loginScreen h2 { color: #e07070; font-size: 1.5rem; }
  #loginScreen input {
    padding: 12px 20px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #16213e;
    color: #fff;
    font-size: 1rem;
    width: 260px;
    text-align: center;
  }
  #loginScreen button {
    padding: 12px 40px;
    background: #e07070;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  .error-msg { color: #ff6666; font-size: 0.85rem; }

  /* 관리자 화면 */
  #adminScreen { display: none; }
  h1 {
    text-align: center;
    color: #e07070;
    font-size: 1.8rem;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: #aaa;
    font-size: 0.85rem;
    margin-bottom: 30px;
  }

  /* 추가 폼 */
  .form-box {
    max-width: 700px;
    margin: 0 auto 30px;
    background: #16213e;
    border-radius: 12px;
    padding: 24px;
    border: 1px solid #e0707044;
  }
  .form-box h3 {
    color: #e07070;
    margin-bottom: 16px;
    font-size: 1rem;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .form-grid.full { grid-template-columns: 1fr; }
  label {
    font-size: 0.78rem;
    color: #aaa;
    display: block;
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    background: #0f1b35;
    border: 1px solid #333;
    border-radius: 6px;
    color: #fff;
    font-size: 0.9rem;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #e07070;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .btn-primary { background: #e07070; color: #fff; }
  .btn-secondary { background: #333; color: #aaa; }
  .btn-danger { background: #c0392b; color: #fff; }
  .btn-small {
    padding: 5px 12px;
    font-size: 0.78rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }

  /* 일정 목록 */
  .list-wrap {
    max-width: 900px;
    margin: 0 auto;
    overflow-x: auto;
    border-radius: 12px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #16213e;
  }
  thead tr { background: #c0504d; }
  th {
    padding: 12px 14px;
    font-size: 0.82rem;
    text-align: center;
    white-space: nowrap;
  }
  td {
    padding: 11px 14px;
    text-align: center;
    font-size: 0.85rem;
    border-bottom: 1px solid #ffffff0f;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr.done-row td { color: #444; }

  .empty { text-align: center; padding: 50px; color: #555; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #27ae60;
    color: #fff;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen">
  <h2>🔐 관리자 로그인</h2>
  <input type="password" id="pwInput" placeholder="비밀번호 입력" />
  <button onclick="checkLogin()">로그인</button>
  <p class="error-msg" id="loginError"></p>
</div>

<!-- 관리자 화면 -->
<div id="adminScreen">
  <h1>⚡ PMHI 2026 관리자</h1>
  <p class="subtitle">일정 추가 / 수정 / 삭제</p>

  <!-- 추가 폼 -->
  <div class="form-box">
    <h3 id="formTitle">➕ 일정 추가</h3>
    <div class="form-grid">
      <div>
        <label>날짜 & 시간 (KST)</label>
        <input type="datetime-local" id="fTime" />
      </div>
      <div>
        <label>부분 (라운드/매치)</label>
        <input type="text" id="fLabel" placeholder="예: 매치 1 (Match1)" />
      </div>
      <div>
        <label>MAP</label>
        <input type="text" id="fMap" placeholder="예: 론도 (Rondo)" />
      </div>
      <div>
        <label>팀</label>
        <input type="text" id="fTeam" placeholder="예: Red Team & Green Team" value="Red Team & Green Team" />
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="resetForm()">초기화</button>
      <button class="btn btn-primary" id="submitBtn" onclick="submitSchedule()">추가</button>
    </div>
  </div>

  <!-- 목록 -->
  <div class="list-wrap">
    <table>
      <thead>
        <tr>
          <th>날짜</th>
          <th>시간</th>
          <th>부분</th>
          <th>MAP</th>
          <th>팀</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="6" class="empty">⏳ 로딩 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyClByQBVoznJznLBTLcQ-6fszkOxGck99Y",
  authDomain: "countdown-pubg.firebaseapp.com",
  databaseURL: "https://countdown-pubg-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "countdown-pubg",
  storageBucket: "countdown-pubg.firebasestorage.app",
  messagingSenderId: "474098863700",
  appId: "1:474098863700:web:523b316e14b710970527c1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ✅ 비밀번호 (여기서 변경 가능)
const ADMIN_PW = 'pmhi2026!';

let allItems = [];
let editingId = null;

const pad = n => String(n).padStart(2, '0');

function formatDate(ts) {
  const d = new Date(ts);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}
function formatTime(ts) {
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 로그인
window.checkLogin = function() {
  const pw = document.getElementById('pwInput').value;
  if (pw === ADMIN_PW) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    startDB();
  } else {
    document.getElementById('loginError').textContent = '비밀번호가 틀렸습니다.';
  }
};

document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.checkLogin();
});

function startDB() {
  onValue(ref(db, 'schedules'), snapshot => {
    const data = snapshot.val();
    allItems = data
      ? Object.entries(data)
          .map(([id, v]) => ({ id, ...v }))
          .sort((a, b) => a.targetTime - b.targetTime)
      : [];
    renderList();
  });
}

function renderList() {
  const now = Date.now();
  const tbody = document.getElementById('listBody');
  if (!allItems.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">등록된 일정이 없습니다</td></tr>';
    return;
  }
  tbody.innerHTML = allItems.map(item => {
    const done = item.targetTime <= now;
    return `
      <tr class="${done ? 'done-row' : ''}">
        <td>${formatDate(item.targetTime)}</td>
        <td>${formatTime(item.targetTime)}</td>
        <td>${item.label || '-'}</td>
        <td>${item.map || '-'}</td>
        <td>${item.team || '-'}</td>
        <td>
          <button class="btn-small btn-primary" style="background:#3498db;color:#fff;margin-right:4px" onclick="window._edit('${item.id}')">수정</button>
          <button class="btn-small btn-danger" style="background:#c0392b;color:#fff" onclick="window._delete('${item.id}')">삭제</button>
        </td>
      </tr>`;
  }).join('');
}

// 추가 / 수정
window.submitSchedule = async function() {
  const timeVal = document.getElementById('fTime').value;
  const label = document.getElementById('fLabel').value.trim();
  const map = document.getElementById('fMap').value.trim();
  const team = document.getElementById('fTeam').value.trim();

  if (!timeVal || !label) {
    showToast('날짜/시간과 부분은 필수입니다!', '#e07070');
    return;
  }

  const targetTime = new Date(timeVal).getTime();
  const data = { targetTime, label, map, team };

  if (editingId) {
    await set(ref(db, `schedules/${editingId}`), data);
    showToast('✅ 수정 완료!');
  } else {
    await push(ref(db, 'schedules'), data);
    showToast('✅ 추가 완료!');
  }
  resetForm();
};

window._edit = function(id) {
  const item = allItems.find(i => i.id === id);
  if (!item) return;
  editingId = id;

  const d = new Date(item.targetTime);
  const local = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('fTime').value = local;
  document.getElementById('fLabel').value = item.label || '';
  document.getElementById('fMap').value = item.map || '';
  document.getElementById('fTeam').value = item.team || '';
  document.getElementById('formTitle').textContent = '✏️ 일정 수정';
  document.getElementById('submitBtn').textContent = '수정 완료';
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window._delete = async function(id) {
  if (!confirm('삭제할까요?')) return;
  await remove(ref(db, `schedules/${id}`));
  showToast('🗑 삭제 완료!', '#e07070');
};

window.resetForm = function() {
  editingId = null;
  document.getElementById('fTime').value = '';
  document.getElementById('fLabel').value = '';
  document.getElementById('fMap').value = '';
  document.getElementById('fTeam').value = 'Red Team & Green Team';
  document.getElementById('formTitle').textContent = '➕ 일정 추가';
  document.getElementById('submitBtn').textContent = '추가';
};

function showToast(msg, bg = '#27ae60') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = bg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
