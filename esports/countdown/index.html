    .session-card-header { flex-direction: column; align-items: flex-start !important; }
  }

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, get } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

// =========================================================================
// 디렉션 설정 및 유튜브 API 연동
const YOUTUBE_API_KEY = "AIzaSyD2m8nMBWtJrI7lw6tcZvG8z18NJ-GsiWk"; 
const SESSION_CLOSE_DELAY_MINUTES = 40; // 마지막 라운드 시작 후 세션이 완전히 닫히기까지의 버퍼 시간 (테스트 시 5~10으로 조절 가능)

let youtubeCheckTimers = {}; 
// =========================================================================

const firebaseConfig = {
  apiKey: "AIzaSyClByQBVoznJznLBTLcQ-6fszkOxGck99Y",
  authDomain: "countdown-pubg.firebaseapp.com",
  databaseURL: "https://countdown-pubg-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "countdown-pubg"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const pad = n => String(n).padStart(2,'0');
const $ = id => document.getElementById(id);

// SVG 아이콘 인라인 헬퍼
const ic = (name, extra='') => `<svg class="icon ${extra}"><use href="#ic-${name}"/></svg>`;

const STD_ROUNDS = ['Live on','Round 1','Round 2','Round 3','Round 4','Round 5','Round 6'];
const STD_TITLES = ['PMMI 2026','PMPS S2 2026','PMWC 2026'];
const STD_TEAMS  = ['Group Stage Day 1','Group Stage Day 2','Group Stage Day 3','Grand Finals','Red Group & Green Group','Red Group & Yellow Group','Yellow Group & Green Group','전체'];

let allSessions = []; 
let loggedIn = false, currentUser = null, selectedDay = null, ticker = null;
let editSessId = null, editRoundSessId = null, editRoundId = null;

// --- 유틸 함수 ---
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()}(${['일','월','화','수','목','금','토'][d.getDay()]})`;
}
function fmtTime(ts) { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtCd(ms) {
  if (ms <= 0) return null;
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return d > 0 ? `${d}일 ${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(h)}:${pad(m)}:${pad(sec)}`;
}
// 시간 문자열(HH:MM)을 파싱. 24 이상이면 다음날로 넘겨서 계산하되, 화면 표기는 입력값 그대로(예: 25:00) 유지한다.
function dateToTs(dateStr, timeStr) {
  const t = (timeStr || '00:00').split(':');
  let hh = parseInt(t[0], 10) || 0;
  const mm = parseInt(t[1], 10) || 0;
  let dayOffset = 0;
  if (hh >= 24) { dayOffset = Math.floor(hh / 24); hh = hh % 24; }
  const base = new Date(`${dateStr}T00:00:00`);
  base.setDate(base.getDate() + dayOffset);
  base.setHours(hh, mm, 0, 0);
  return base.getTime();
}

// --- 유튜브 다중 분기대응 API 로직 ---
function parseLiveLink(url) {
  if (!url) return { type: 'none', value: null };
  const videoMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_\-]+)/);
  if (videoMatch) return { type: 'video', value: videoMatch[1], originalUrl: url };
  const handleMatch = url.match(/youtube\.com\/(@[a-zA-Z0-9_\-\.]+)/);
  if (handleMatch) return { type: 'channel_handle', value: handleMatch[1], originalUrl: url };
  const channelIdMatch = url.match(/youtube\.com\/v3\/channel\/([a-zA-Z0-9_\-]+)/) || url.match(/youtube\.com\/channel\/([a-zA-Z0-9_\-]+)/);
  if (channelIdMatch) return { type: 'channel_id', value: channelIdMatch[1], originalUrl: url };
  return { type: 'external', value: null, originalUrl: url };
}

async function checkYouTubeLiveStatus(managedUrl) {
  const info = parseLiveLink(managedUrl);
  if (info.type === 'external' || info.type === 'none' || !YOUTUBE_API_KEY) return { isLive: false, finalUrl: managedUrl };

  try {
    if (info.type === 'video') {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${info.value}&key=${YOUTUBE_API_KEY}`);
      const data = await res.json();
      if (data.items && data.items.length > 0) return { isLive: data.items[0].snippet.liveBroadcastContent === 'live', finalUrl: info.originalUrl };
    }
    let channelId = null;
    if (info.type === 'channel_handle') {
      const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=${info.value}&key=${YOUTUBE_API_KEY}`);
      const chData = await chRes.json();
      if (chData.items && chData.items.length > 0) channelId = chData.items[0].id;
    } else { channelId = info.value; }

    if (channelId) {
      const streamRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&type=video&eventType=live&key=${YOUTUBE_API_KEY}`);
      const streamData = await streamRes.json();
      if (streamData.items && streamData.items.length > 0) return { isLive: true, finalUrl: `https://www.youtube.com/watch?v=${streamData.items[0].id.videoId}` };
    }
  } catch (e) { console.error("유튜브 API 통신 장애:", e); }
  return { isLive: false, finalUrl: managedUrl };
}

function manageLiveTrackingScheduler(session, rounds) {
  const sessId = session.id; const managedUrl = session.link;
  if (!managedUrl || parseLiveLink(managedUrl).type === 'external' || !rounds || rounds.length === 0) return;

  const sortedRounds = [...rounds].sort((a,b) => dateToTs(session.date, a.time) - dateToTs(session.date, b.time));
  const firstRoundTs = dateToTs(session.date, sortedRounds[0].time);
  const lastRoundTs = dateToTs(session.date, sortedRounds[sortedRounds.length - 1].time);

  const FortyMinsBeforeFirstRound = firstRoundTs - (40 * 60 * 1000);
  const StartCheckEndedTs = lastRoundTs + (30 * 60 * 1000);
  const MaxCheckTimeoutTs = lastRoundTs + (90 * 60 * 1000);

  if (youtubeCheckTimers[sessId]) clearInterval(youtubeCheckTimers[sessId].intervalId);
  else youtubeCheckTimers[sessId] = { isLiveConfirmed: false, isEndedConfirmed: false, currentStreamUrl: managedUrl };

  let lastApiCheckTime = 0;
  const FIVE_MINUTES = 5 * 60 * 1000;

  youtubeCheckTimers[sessId].intervalId = setInterval(async () => {
    const currentNow = Date.now();
    const state = youtubeCheckTimers[sessId];

    if (currentNow >= FortyMinsBeforeFirstRound && currentNow <= firstRoundTs && !state.isLiveConfirmed) {
      if (currentNow - lastApiCheckTime >= FIVE_MINUTES) {
        lastApiCheckTime = currentNow;
        const result = await checkYouTubeLiveStatus(managedUrl);
        if (result.isLive) {
          state.isLiveConfirmed = true; state.currentStreamUrl = result.finalUrl;
          showToast(`${ic('megaphone')} 방송 시작 감지: 중계 링크 자동 연결 완료.`);
        }
      }
    }
    if (currentNow >= StartCheckEndedTs && !state.isEndedConfirmed) {
      if (currentNow >= MaxCheckTimeoutTs) {
        state.isEndedConfirmed = true; clearInterval(state.intervalId);
        return;
      }
      if (currentNow - lastApiCheckTime >= FIVE_MINUTES) {
        lastApiCheckTime = currentNow;
        const result = await checkYouTubeLiveStatus(state.currentStreamUrl);
        if (!result.isLive) {
          state.isEndedConfirmed = true; clearInterval(state.intervalId);
          showToast(`${ic('flag')} 방송 종료가 정상 감지되었습니다.`);
        }
      }
    }
  }, 10000); 
}

// --- 화면 전환 및 로그인 ---
function showScreen(name) {
  $('publicScreen').style.display = 'none'; $('loginScreen').style.display = 'none'; $('adminScreen').style.display = 'none';
  if (name === 'public') { $('publicScreen').style.display = 'block'; window.location.hash = ''; }
  else if (name === 'login') { $('loginScreen').style.display = 'flex'; window.location.hash = 'admin'; }
  else if (name === 'admin') {
    $('adminScreen').style.display = 'block';
    if (currentUser && currentUser.toLowerCase() === 'admin1') {
      $('superAdminSection').style.display = 'block';
      $('adminRoleBadge').className = 'account-role'; $('adminRoleBadge').textContent = 'SUPER ADMIN';
      renderAccounts();
    } else {
      $('superAdminSection').style.display = 'none';
      $('adminRoleBadge').className = 'account-role'; $('adminRoleBadge').style.cssText = 'background:rgba(71,85,105,0.1);color:var(--txt2);'; $('adminRoleBadge').textContent = 'STAFF';
    }
    renderAdmin();
  }
}

window.goAdmin  = () => loggedIn ? showScreen('admin') : showScreen('login');
window.goPublic = () => showScreen('public');
window.doLogout = () => { loggedIn = false; currentUser = null; showScreen('public'); };

window.doLogin = async function() {
  const id = $('idInput').value.trim(), pw = $('pwInput').value;
  if (!id || !pw) { $('loginError').textContent = '정보를 입력하세요.'; return; }
  try {
    const snap = await get(ref(db, `admins/${id}`));
    if (snap.exists() && snap.val().pw === pw) {
      loggedIn = true; currentUser = id;
      $('idInput').value = ''; $('pwInput').value = ''; showScreen('admin');
    } else { $('loginError').textContent = '계정 정보 불일치'; }
  } catch(e) { $('loginError').textContent = '오류 발생'; }
};
['idInput','pwInput'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') window.doLogin(); }));

window.addEventListener('hashchange', () => { window.location.hash === '#admin' ? (loggedIn ? showScreen('admin') : showScreen('login')) : showScreen('public'); });
if(window.location.hash === '#admin') showScreen('login');

// --- 데이터 로드 ---
onValue(ref(db, 'sessions'), snapshot => {
  const data = snapshot.val();
  allSessions = data ? Object.entries(data).map(([id, v]) => ({
        id, date: v.date || '', title: v.title || '', team: v.team || '', link: v.link || '',
        rounds: v.rounds ? Object.entries(v.rounds).map(([rid, rv]) => ({ id: rid, ...rv })) : []
      })) : [];
  allSessions.sort((a,b) => a.date.localeCompare(b.date));
  
  allSessions.forEach(sess => manageLiveTrackingScheduler(sess, sess.rounds || []));
  renderPublic();
  if (loggedIn) renderAdmin();
});

// --- 공개 화면 렌더링 ---
function renderPublic() {
  const now = Date.now();
  $('nowTime').textContent = `현재 시각: ${new Date(now).toLocaleString('ko-KR')}`;
  
  if (!allSessions.length) { $('publicBody').innerHTML = `<tr><td colspan="7" class="empty">등록된 일정이 없습니다</td></tr>`; $('tabs').innerHTML = ''; return; }

  const daySet = new Set(allSessions.map(s => s.date));
  $('tabs').innerHTML = [`<button class="tab ${!selectedDay?'active':''}" onclick="window._day(null)">전체</button>`, ...[...daySet].sort().map(d => `<button class="tab ${selectedDay===d?'active':''}" onclick="window._day('${d}')">${fmtDate(dateToTs(d,'00:00'))}</button>`)].join('');

  let dynamicSessions = allSessions.map(sess => {
    let isSessionEnded = false;
    if(sess.rounds.length > 0) {
      const sorted = sess.rounds.slice().sort((a,b) => dateToTs(sess.date, a.time||'00:00') - dateToTs(sess.date, b.time||'00:00'));
      const lastRoundTs = dateToTs(sess.date, sorted[sorted.length - 1].time || '00:00');
      // 대기 버퍼 시간을 최상단 선언 변수(SESSION_CLOSE_DELAY_MINUTES)로 유연하게 처리
      if (now >= lastRoundTs + (SESSION_CLOSE_DELAY_MINUTES * 60 * 1000)) isSessionEnded = true; 
    }
    return { ...sess, isSessionEnded };
  });

  // 복합 배열 해체 전 1차 상태 동합
  let flatRounds = [];
  dynamicSessions.forEach(sess => {
    if (selectedDay && sess.date !== selectedDay) return;
    const sortedRounds = sess.rounds.slice().sort((a,b) => dateToTs(sess.date, a.time||'00:00') - dateToTs(sess.date, b.time||'00:00'));
    sortedRounds.forEach((r, idx) => {
      flatRounds.push({ ...r, parentSession: sess, ts: dateToTs(sess.date, r.time || '00:00'), nextTs: sortedRounds[idx + 1] ? dateToTs(sess.date, sortedRounds[idx + 1].time || '00:00') : null });
    });
  });

  // 추출된 모든 라운드들을 [세션 종료 여부] 기준으로 1차 정렬하고, 그 안에서 [시간순]으로 2차 정렬합니다.
  flatRounds.sort((a, b) => {
    const aEnded = a.parentSession.isSessionEnded ? 1 : 0;
    const bEnded = b.parentSession.isSessionEnded ? 1 : 0;
    if (aEnded !== bEnded) return aEnded - bEnded;
    return a.ts - b.ts;
  });

  // 현재 활성화된 고정 'LIVE' 세트와 '다가올 다음 대기 경기(NEXT)' 세트를 각각 다른 변수로 정밀 분리 추출
  let currentLiveBroadcast = flatRounds.find(r => r.label === 'Live on' && (now >= r.ts && now - r.ts < SESSION_CLOSE_DELAY_MINUTES * 60 * 1000));
  let incomingNextMatch = flatRounds.find(r => r.ts > now);

  if (flatRounds.length === 0) { $('publicBody').innerHTML = '<tr><td colspan="7" class="empty">표시할 라운드가 없습니다.</td></tr>'; return; }

  let html = '', lastSessionId = null;
  flatRounds.forEach(r => {
    const sess = r.parentSession;
    if (lastSessionId !== sess.id) {
      lastSessionId = sess.id;
      let liveBtnUrl = sess.link;
      if (youtubeCheckTimers[sess.id] && youtubeCheckTimers[sess.id].isLiveConfirmed) liveBtnUrl = youtubeCheckTimers[sess.id].currentStreamUrl;
      
      html += `
        <tr class="session-row ${sess.isSessionEnded ? 'session-ended' : ''}">
          <td colspan="7">
            <div class="session-container">
              <div class="session-info">
                <span class="session-tag">${sess.title || '대회'}</span><span>${fmtDate(dateToTs(sess.date, '00:00'))}</span><span>•</span><span>${sess.team || '팀 정보 미정'}</span>
                ${sess.isSessionEnded ? '<span style="color:#cbd5e1;font-size:0.75rem;">(종료됨)</span>' : ''}
              </div>
              ${sess.link ? `<a href="${liveBtnUrl}" target="_blank" class="link-btn">${ic('tv')} 중계</a>` : ''}
            </div>
          </td>
        </tr>`;
    }

    const ms = r.ts - now, isLiveOn = r.label === 'Live on';
    let done = ms <= 0, cdCell = '';
    
    // 두 고유 상태 객체와의 정확한 매핑 여부 대조 판별
    const isCurrentLive = currentLiveBroadcast && r.id === currentLiveBroadcast.id && sess.id === currentLiveBroadcast.parentSession.id;
    const isIncomingNext = incomingNextMatch && r.id === incomingNextMatch.id && sess.id === incomingNextMatch.parentSession.id;

    if (done) {
      if (isLiveOn) {
        if (now - r.ts < SESSION_CLOSE_DELAY_MINUTES * 60 * 1000) cdCell = `<div style="display:flex;align-items:center;gap:5px;justify-content:center"><span class="cd" style="color:#10b981; font-weight:800; display:flex; align-items:center; gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;"></span>LIVE BROADCAST</span></div>`;
        else cdCell = `<div style="display:flex;align-items:center;gap:5px;justify-content:center"><span style="color:var(--txt3); font-weight:600; display:flex; align-items:center; gap:5px;">${ic('check-circle')} 방송 종료</span></div>`;
      } else {
        if (r.nextTs && now < r.nextTs) {
          done = false; cdCell = `<div style="display:flex;align-items:center;gap:5px;justify-content:center"><span class="cd" style="color:var(--accent); font-weight:700; display:flex; align-items:center; gap:5px;">${ic('swords')} 경기 진행중</span></div>`;
        } else { cdCell = `<div style="display:flex;align-items:center;gap:5px;justify-content:center"><span style="color:var(--txt3); font-weight:600; display:flex; align-items:center; gap:5px;">${ic('check-circle')} 매치 종료</span></div>`; }
      }
    } else {
      let badgeHtml = '';
      if (isIncomingNext) {
        badgeHtml = isLiveOn ? `<span class="badge" style="background:#10b981;">${ic('tv')} NEXT LIVE</span>` : `<span class="badge-match">${ic('swords')} NEXT MATCH</span>`;
      }
      cdCell = `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;justify-content:center"><span class="cd">${fmtCd(ms)}</span>${badgeHtml}</div>`;
    }

    // 조건부 렌더링 클래스 할당 규칙 개편 정밀화
    let rowClass = '';
    if (done) rowClass = 'done';
    else if (isCurrentLive && ms <= 0) rowClass = 'live-on-row'; 
    else if (isIncomingNext) {
      rowClass = isLiveOn ? 'live-on-row' : 'next-match-row';
    }

    html += `
      <tr class="${rowClass}">
        <td>${fmtDate(r.ts)}</td><td>${r.time || '-'}</td><td>${cdCell}</td>
        <td>${sess.title || '-'}</td><td>${r.label || '-'}</td><td>${r.map || '-'}</td><td>${sess.team || '-'}</td>
        <td class="m-top-flex"><span style="font-size: 1.25rem !important; font-weight: 800 !important;">${r.time || '-'}</span><span style="font-size: 1.05rem !important; font-weight: 700 !important;">${r.label || '-'}</span></td>
        <td class="m-bottom-flex"><div style="text-align: left;">${cdCell}</div><span style="font-size: 0.85rem !important; font-weight: 600; color: var(--txt2);">${r.map || '-'}</span></td>
      </tr>`;
  });
  $('publicBody').innerHTML = html;
}

window._day = function(d) { selectedDay = d; renderPublic(); };
if (ticker) clearInterval(ticker); ticker = setInterval(renderPublic, 1000);

// --- 관리자 폼 제어 ---
window.toggleSCustom = function(){ $('sTitleCustom').style.display = $('sTitle').value === 'custom' ? 'block' : 'none'; $('sTeamCustom').style.display = $('sTeam').value === 'custom' ? 'block' : 'none'; };
window.toggleMCustom = function(){ $('mTitleCustom').style.display = $('mTitle').value === 'custom' ? 'block' : 'none'; $('mTeamCustom').style.display = $('mTeam').value === 'custom' ? 'block' : 'none'; };
window.toggleRCustom = function(){ $('rLabelCustom').style.display = $('rLabel').value === 'custom' ? 'block' : 'none'; };
window.toggleRoundAddCustom = function(sessId){ const sel = $(`rl_${sessId}`), inp = $(`rlc_${sessId}`); if (sel && inp) inp.style.display = sel.value === 'custom' ? 'block' : 'none'; };

function renderAdmin() {
  if (!allSessions.length) { $('sessionsWrap').innerHTML = '<div class="empty">등록된 세션이 없습니다.</div>'; return; }
  $('sessionsWrap').innerHTML = allSessions.map(sess => {
    const roundRows = sess.rounds.length ? sess.rounds.slice().sort((a,b) => dateToTs(sess.date, a.time||'00:00') - dateToTs(sess.date, b.time||'00:00')).map(r => `
          <tr><td>${r.time || '-'}</td><td>${r.label || '-'}</td><td>${r.map || '-'}</td>
          <td><button class="btn-sm btn-edit" onclick="openRoundEdit('${sess.id}','${r.id}')">${ic('edit')} 수정</button> <button class="btn-sm btn-del" onclick="delRound('${sess.id}','${r.id}')">${ic('trash')} 삭제</button></td></tr>`).join('') 
          : `<tr><td colspan="4">라운드가 없습니다.</td></tr>`;
    return `
    <div class="session-card">
      <div class="session-card-header">
        <div class="session-card-title"><span class="session-tag">${sess.title || '대회'}</span><strong>${sess.date}</strong><span style="font-size:0.8rem;color:var(--txt2);">${sess.team || ''}</span></div>
        <div style="display:flex;gap:4px;flex-shrink:0;">
          <button class="btn-sm btn-edit" onclick="openSessionEdit('${sess.id}')">${ic('edit')} 수정</button><button class="btn-sm btn-copy" onclick="copySession('${sess.id}')">${ic('copy')} 복사</button><button class="btn-sm btn-del" onclick="delSession('${sess.id}')">${ic('trash')} 삭제</button>
        </div>
      </div>
      <table class="round-table"><thead><tr><th>시간</th><th>라운드</th><th>MAP</th><th>관리</th></tr></thead><tbody>${roundRows}</tbody></table>
      <div class="round-add-row">
        <div class="form-group"><label>시간 * <span style="font-weight:400;color:var(--txt3);font-size:0.68rem;">(자정 넘으면 25:00처럼)</span></label><input type="text" id="rt_${sess.id}" placeholder="예: 20:00 / 25:00" pattern="[0-9]{1,2}:[0-9]{2}"></div>
        <div class="form-group">
          <label>라운드 *</label>
          <select id="rl_${sess.id}" onchange="toggleRoundAddCustom('${sess.id}')"><option value="Live on">Live on</option><option value="Round 1">Round 1</option><option value="Round 2">Round 2</option><option value="Round 3">Round 3</option><option value="Round 4">Round 4</option><option value="Round 5">Round 5</option><option value="Round 6">Round 6</option><option value="custom">직접 입력</option></select>
          <input type="text" id="rlc_${sess.id}" placeholder="라운드명" style="display:none;margin-top:6px;">
        </div>
        <div class="form-group"><label>MAP</label><select id="rm_${sess.id}"><option value="">-- 선택 --</option><option value="Rondo">Rondo</option><option value="Erangel">Erangel</option><option value="Miramar">Miramar</option><option value="Sanhok">Sanhok</option></select></div>
        <button class="btn btn-green" onclick="addRound('${sess.id}')">${ic('plus')} 라운드 추가</button>
      </div>
    </div>`;
  }).join('');
}

// --- CRUD ---
window.addSession = async function() {
  const date = $('sDate').value, link = $('sLink').value.trim();
  let title = $('sTitle').value; if(title==='custom') title=$('sTitleCustom').value.trim();
  let team = $('sTeam').value; if(team==='custom') team=$('sTeamCustom').value.trim();
  if (!date || !title) return showToast('필수 필드 누락!', '#ef4444');
  await push(ref(db, 'sessions'), { date, title, team, link }); showToast('세션이 추가되었습니다.');
};
window.copySession = async function(sessId) {
  const original = allSessions.find(s => s.id === sessId); if (!original || !confirm('세션을 복사하시겠습니까?')) return;
  try {
    const sessionData = { date: original.date, title: original.title, team: original.team, link: original.link };
    if (original.rounds && original.rounds.length > 0) {
      sessionData.rounds = {}; original.rounds.forEach(r => sessionData.rounds[push(ref(db, `dummy`)).key] = { time: r.time||'', label: r.label||'', map: r.map||'' });
    }
    await set(push(ref(db, 'sessions')), sessionData); showToast('세션 복사 성공!');
  } catch(e) { showToast('복사 실패', '#ef4444'); }
};
window.openSessionEdit = function(sessId) {
  const s = allSessions.find(x => x.id === sessId); if(!s) return;
  editSessId = sessId; $('mDate').value = s.date;
  $('mTitle').value = STD_TITLES.includes(s.title) ? s.title : 'custom'; $('mTitleCustom').value = s.title; toggleMCustom();
  $('mTeam').value = STD_TEAMS.includes(s.team) ? (s.team || '') : 'custom'; $('mTeamCustom').value = s.team; toggleMCustom();
  $('mLink').value = s.link || ''; $('sessionModal').classList.add('open');
};
window.saveSession = async function() {
  const date = $('mDate').value, link = $('mLink').value.trim();
  let title = $('mTitle').value; if(title==='custom') title=$('mTitleCustom').value.trim();
  let team = $('mTeam').value; if(team==='custom') team=$('mTeamCustom').value.trim();
  const sess = allSessions.find(s => s.id === editSessId); const roundsData = {};
  if (sess && sess.rounds.length) sess.rounds.forEach(r => { roundsData[r.id] = { time: r.time, label: r.label, map: r.map }; });
  await set(ref(db, `sessions/${editSessId}`), { date, title, team, link, rounds: roundsData }); closeModal('sessionModal'); showToast('수정 완료!');
};
window.delSession = async function(sessId) { if (confirm('삭제할까요?')) await remove(ref(db, `sessions/${sessId}`)); };
// HH:MM 형식 검증 (시는 0~29, 자정 넘김 표기 25:00 등 허용 / 분은 0~59)
function isValidTimeStr(t) {
  const m = /^([0-9]{1,2}):([0-9]{2})$/.exec((t||'').trim());
  if (!m) return false;
  const hh = parseInt(m[1], 10), mm = parseInt(m[2], 10);
  return hh >= 0 && hh <= 29 && mm >= 0 && mm <= 59;
}

window.addRound = async function(sessId) {
  const time = $(`rt_${sessId}`).value.trim(), map = $(`rm_${sessId}`).value;
  let label = $(`rl_${sessId}`).value; if (label === 'custom') label = $(`rlc_${sessId}`).value.trim();
  if (!time || !label) return;
  if (!isValidTimeStr(time)) return showToast('시간 형식이 올바르지 않습니다. 예: 20:00, 자정 초과 시 25:00', '#ef4444');
  await push(ref(db, `sessions/${sessId}/rounds`), { time, label, map }); showToast('라운드 추가 완료!');
};
window.openRoundEdit = function(sessId, roundId) {
  const s = allSessions.find(x => x.id === sessId); const r = s.rounds.find(x => x.id === roundId);
  editRoundSessId = sessId; editRoundId = roundId; $('rTime').value = r.time;
  $('rLabel').value = STD_ROUNDS.includes(r.label) ? r.label : 'custom'; $('rLabelCustom').value = r.label; toggleRCustom();
  $('rMap').value = r.map || ''; $('roundModal').classList.add('open');
};
window.saveRound = async function() {
  const time = $('rTime').value.trim(), map = $('rMap').value;
  let label = $('rLabel').value; if (label === 'custom') label = $('rLabelCustom').value.trim();
  if (!isValidTimeStr(time)) return showToast('시간 형식이 올바르지 않습니다. 예: 20:00, 자정 초과 시 25:00', '#ef4444');
  await set(ref(db, `sessions/${editRoundSessId}/rounds/${editRoundId}`), { time, label, map }); closeModal('roundModal'); showToast('라운드 수정 완료!');
};
window.delRound = async function(sessId, roundId) { if(confirm('삭제할까요?')) await remove(ref(db, `sessions/${sessId}/rounds/${roundId}`)); };
window.closeModal = id => $(id).classList.remove('open');
['sessionModal','roundModal'].forEach(id => { $(id).addEventListener('click', e => { if(e.target === $(id)) closeModal(id); }); });

async function renderAccounts() {
  try {
    const snap = await get(ref(db, 'admins')); if (!snap.exists()) return;
    $('accountList').innerHTML = Object.keys(snap.val()).map(id => `<div class="account-item"><strong>${id}</strong><span class="account-role">${id.toLowerCase()==='admin1'?'SUPER ADMIN':'STAFF'}</span></div>`).join('');
  } catch(e){}
}
window.addAccount = async function() {
  const id = $('aId').value.trim(), pw = $('aPw').value;
  await set(ref(db, `admins/${id}`), { pw }); renderAccounts();
};

let dark = false;
window.toggleTheme = function() {
  dark = !dark; document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  $('ico-dark').style.display = dark ? 'none' : ''; $('ico-light').style.display = dark ? '' : 'none';
};
function showToast(msg, bg = '#10b981') { const t = $('toast'); t.innerHTML = msg; t.style.background = bg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
</script>
