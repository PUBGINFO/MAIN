<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG MOBILE ESPORTS - PMHI 2026</title>
<style>
  /* ─── 다크 모드 ─── */
  [data-theme="dark"] {
    --bg:       #0e1117;
    --surface:  #161b24;
    --surface2: #1c2333;
    --surface3: #232d42;
    --bd:       rgba(255,255,255,.07);
    --bd2:      rgba(255,255,255,.13);
    --txt:      #e8edf5;
    --txt2:     #8892a4;
    --txt3:     #4e5a6e;
    --sh:       0 4px 24px rgba(0,0,0,.4);
    --sh-sm:    0 2px 8px rgba(0,0,0,.3);
    --accent:   #e07070;
    --accent2:  #c0504d;
    --table-bg: #161b24;
    --thead-bg: #c0504d;
    --row-done: #2a2a2a;
    --row-done-txt: #4e5a6e;
    --row-next: rgba(255,255,255,.04);
    --border-row: rgba(255,255,255,.06);
    --input-bg: #0f1b35;
    --input-bd: #2a2a4a;
    --btn-sec-bg: #2a2a4a;
    --btn-sec-txt: #aaa;
    --btn-sec-hov: #333;
    --day-hdr-bg: rgba(192,80,77,.1);
    --login-box-bg: #16213e;
  }
  /* ─── 라이트 모드 ─── */
  [data-theme="light"] {
    --bg:       #f2f4f8;
    --surface:  #ffffff;
    --surface2: #f8f9fc;
    --surface3: #edf0f7;
    --bd:       rgba(0,0,0,.07);
    --bd2:      rgba(0,0,0,.13);
    --txt:      #111827;
    --txt2:     #6b7280;
    --txt3:     #9ca3af;
    --sh:       0 4px 24px rgba(0,0,0,.08);
    --sh-sm:    0 2px 8px rgba(0,0,0,.05);
    --accent:   #c0392b;
    --accent2:  #a93226;
    --table-bg: #ffffff;
    --thead-bg: #c0392b;
    --row-done: #f5f5f5;
    --row-done-txt: #bbb;
    --row-next: rgba(192,57,43,.04);
    --border-row: rgba(0,0,0,.06);
    --input-bg: #f8f9fc;
    --input-bd: #d1d5db;
    --btn-sec-bg: #e5e7eb;
    --btn-sec-txt: #6b7280;
    --btn-sec-hov: #d1d5db;
    --day-hdr-bg: rgba(192,57,43,.06);
    --login-box-bg: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 30px 16px;
    transition: background .3s, color .3s;
  }

  /* ─── 공통 ─── */
  h1 { text-align: center; color: var(--accent); font-size: 1.8rem; margin-bottom: 6px; }
  .subtitle { text-align: center; color: var(--txt2); font-size: 0.85rem; margin-bottom: 8px; }
  .now-time { text-align: center; color: var(--txt3); font-size: 0.78rem; margin-bottom: 24px; font-variant-numeric: tabular-nums; }

  /* ─── 탭 (날짜 필터) ─── */
  .tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tab {
    padding: 7px 18px; border-radius: 20px;
    border: 1px solid var(--accent); background: transparent;
    color: var(--accent); cursor: pointer; font-size: 0.82rem; transition: all 0.2s;
  }
  .tab.active { background: var(--accent); color: #fff; font-weight: bold; }

  /* ─── 테이블 ─── */
  .table-wrap { max-width: 920px; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: var(--sh); }
  table { width: 100%; border-collapse: collapse; background: var(--table-bg); }
  thead tr { background: var(--thead-bg); }
  th { padding: 12px 14px; font-size: 0.82rem; text-align: center; white-space: nowrap; color: #fff; }
  td { padding: 12px 14px; text-align: center; font-size: 0.88rem; border-bottom: 1px solid var(--border-row); white-space: nowrap; color: var(--txt); }
  tr:last-child td { border-bottom: none; }
  tr.done td { color: var(--row-done-txt); background: var(--row-done); }
  tr.next { background: var(--row-next); }
  tr.next .cd { color: #ffd700; font-weight: bold; }
  .cd { font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .badge {
    display: inline-block; background: #ffd700; color: #000;
    font-size: 0.62rem; font-weight: bold;
    padding: 1px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle;
  }
  .day-header td {
    background: var(--day-hdr-bg); color: var(--accent);
    font-size: 0.8rem; font-weight: bold; letter-spacing: 1px; text-align: left;
  }
  .empty { text-align: center; padding: 50px; color: var(--txt3); }

  /* ─── 관리자 nav ─── */
  .top-nav {
    display: flex; justify-content: flex-end; align-items: center;
    max-width: 920px; margin: 0 auto 16px; gap: 8px;
  }
  .nav-btn {
    padding: 6px 16px; border-radius: 6px; border: 1px solid var(--bd2);
    background: transparent; color: var(--txt2); cursor: pointer; font-size: 0.78rem;
    transition: all .2s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── 테마 토글 버튼 ─── */
  .theme-btn {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--bd2);
    background: transparent; color: var(--txt2); cursor: pointer; font-size: 1rem;
    transition: all .2s; line-height: 1;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── 로그인 화면 ─── */
  #loginScreen {
    display: none; flex-direction: column; align-items: center;
    justify-content: center; min-height: 80vh; gap: 16px;
  }
  #loginScreen h2 { color: var(--accent); font-size: 1.4rem; }
  .login-box {
    background: var(--login-box-bg); border-radius: 12px; padding: 36px 40px;
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    border: 1px solid var(--bd2); min-width: 300px; box-shadow: var(--sh);
  }
  .login-box input {
    width: 100%; padding: 12px 16px; border-radius: 8px;
    border: 1px solid var(--input-bd); background: var(--input-bg); color: var(--txt);
    font-size: 1rem; text-align: center; letter-spacing: 2px;
  }
  .login-box input:focus { outline: none; border-color: var(--accent); }
  .login-box button {
    width: 100%; padding: 12px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold;
  }
  .login-box button:hover { background: var(--accent2); }
  .login-error { color: #ff6666; font-size: 0.82rem; min-height: 18px; }
  .back-btn {
    color: var(--txt3); font-size: 0.8rem; cursor: pointer; text-decoration: underline;
  }
  .back-btn:hover { color: var(--txt2); }

  /* ─── 관리자 화면 ─── */
  #adminScreen { display: none; }
  .admin-header {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 920px; margin: 0 auto 24px;
  }
  .admin-header h1 { margin: 0; }
  .logout-btn {
    padding: 7px 16px; border-radius: 6px; border: 1px solid var(--bd2);
    background: transparent; color: var(--txt2); cursor: pointer; font-size: 0.8rem;
    transition: all .2s;
  }
  .logout-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 폼 */
  .form-box {
    max-width: 920px; margin: 0 auto 24px;
    background: var(--surface); border-radius: 12px; padding: 22px 24px;
    border: 1px solid var(--bd); box-shadow: var(--sh-sm);
  }
  .form-box h3 { color: var(--accent); font-size: 0.95rem; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  .form-group label { font-size: 0.75rem; color: var(--txt2); display: block; margin-bottom: 5px; }
  .form-group input, .form-group select {
    width: 100%; padding: 10px 12px; background: var(--input-bg);
    border: 1px solid var(--input-bd); border-radius: 6px; color: var(--txt); font-size: 0.88rem;
    appearance: none; -webkit-appearance: none;
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
  .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { padding: 10px 22px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: bold; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary { background: var(--btn-sec-bg); color: var(--btn-sec-txt); }
  .btn-secondary:hover { background: var(--btn-sec-hov); }

  /* 관리자 목록 */
  .admin-table-wrap { max-width: 920px; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: var(--sh); }
  .btn-sm {
    padding: 4px 10px; border: none; border-radius: 4px;
    cursor: pointer; font-size: 0.75rem; font-weight: bold;
  }
  .btn-edit { background: #3498db; color: #fff; margin-right: 4px; }
  .btn-edit:hover { background: #2980b9; }
  .btn-del { background: #c0392b; color: #fff; }
  .btn-del:hover { background: #a93226; }

  /* 토스트 */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #27ae60; color: #fff; padding: 12px 28px;
    border-radius: 8px; font-size: 0.88rem;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999;
  }
  .toast.show { opacity: 1; }

  /* ─── 공개 페이지 헤더 영역 ─── */
  .page-brand {
    text-align: center; color: var(--txt3); font-size: 0.7rem;
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2px;
  }
</style>
</head>
<body>

<!-- ════════════ 공개 페이지 ════════════ -->
<div id="publicScreen">
  <div class="top-nav">
    <button class="theme-btn" onclick="toggleTheme()" title="테마 전환">
      <span id="ico-dark">🌙</span><span id="ico-light" style="display:none">☀️</span>
    </button>
    <button class="nav-btn" onclick="goAdmin()">🔐 관리자</button>
  </div>
  <p class="page-brand">PUBG MOBILE ESPORTS</p>
  <h1>⚡ PMHI 2026</h1>
  <p class="subtitle">실시간 일정 & 카운트다운</p>
  <p class="now-time" id="nowTime">-</p>
  <div class="tabs" id="tabs"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>날짜</th><th>시간 (KST)</th><th>카운트다운</th>
          <th>라운드</th><th>MAP</th><th>팀</th>
        </tr>
      </thead>
      <tbody id="publicBody">
        <tr><td colspan="6" class="empty">⏳ 로딩 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ════════════ 로그인 화면 ════════════ -->
<div id="loginScreen">
  <div class="login-box">
    <h2>🔐 관리자 로그인</h2>
    <input type="password" id="pwInput" placeholder="비밀번호" />
    <p class="login-error" id="loginError"></p>
    <button onclick="doLogin()">로그인</button>
    <span class="back-btn" onclick="goPublic()">← 돌아가기</span>
  </div>
</div>

<!-- ════════════ 관리자 화면 ════════════ -->
<div id="adminScreen">
  <div class="admin-header">
    <div>
      <h1>⚙️ 관리자</h1>
      <p class="subtitle" style="text-align:left;margin:0">PMHI 2026 일정 관리</p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="logout-btn" onclick="goPublic()">← 공개 페이지</button>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <!-- 추가/수정 폼 -->
  <div class="form-box">
    <h3 id="formTitle">➕ 일정 추가</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>날짜 & 시간 (KST) *</label>
        <input type="datetime-local" id="fTime" />
      </div>
      <div class="form-group">
        <label>대회명 *</label>
        <input type="text" id="fTitle" placeholder="예: PMHI 2026 Super Weekend" />
      </div>
      <div class="form-group">
        <label>라운드 *</label>
        <select id="fLabel">
          <option value="">-- 라운드 선택 --</option>
          <option value="Round 1">Round 1</option>
          <option value="Round 2">Round 2</option>
          <option value="Round 3">Round 3</option>
          <option value="Round 4">Round 4</option>
          <option value="Round 5">Round 5</option>
          <option value="Round 6">Round 6</option>
        </select>
      </div>
      <div class="form-group">
        <label>MAP</label>
        <select id="fMap">
          <option value="">-- 맵 선택 --</option>
          <option value="Rondo">Rondo</option>
          <option value="Erangel">Erangel</option>
          <option value="Miramar">Miramar</option>
          <option value="Sanhok">(Sanhok)</option>
        </select>
      </div>
      <div class="form-group">
        <label>팀</label>
        <input type="text" id="fTeam" placeholder="예: Red Team & Green Team" />
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="resetForm()">초기화</button>
      <button class="btn btn-primary" id="submitBtn" onclick="submitSchedule()">추가</button>
    </div>
  </div>

  <!-- 목록 -->
  <div class="admin-table-wrap">
    <table>
      <thead>
        <tr>
          <th>날짜</th><th>시간</th><th>대회명</th><th>라운드</th><th>MAP</th><th>팀</th><th>관리</th>
        </tr>
      </thead>
      <tbody id="adminBody">
        <tr><td colspan="7" class="empty">⏳ 로딩 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

// ── Firebase 설정 ──
const firebaseConfig = {
  apiKey: "AIzaSyClByQBVoznJznLBTLcQ-6fszkOxGck99Y",
  authDomain: "countdown-pubg.firebaseapp.com",
  databaseURL: "https://countdown-pubg-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "countdown-pubg",
  storageBucket: "countdown-pubg.firebasestorage.app",
  messagingSenderId: "474098863700",
  appId: "1:474098863700:web:523b316e14b710970527c1"
};

// ── 관리자 비밀번호 (여기서 변경) ──
const ADMIN_PW = 'pmhi2026!';

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let allItems  = [];
let editingId = null;
let selectedDay = null;
let loggedIn  = false;
let ticker    = null;

const pad = n => String(n).padStart(2, '0');

const $ = id => document.getElementById(id);

// ──────────────────────────────────────
// 화면 전환
// ──────────────────────────────────────
function showScreen(name) {
  $('publicScreen').style.display = 'none';
  $('loginScreen').style.display  = 'none';
  $('adminScreen').style.display  = 'none';

  if (name === 'public') {
    $('publicScreen').style.display = 'block';
    window.location.hash = '';
  } else if (name === 'login') {
    $('loginScreen').style.display = 'flex';
    window.location.hash = 'admin';
    setTimeout(() => $('pwInput').focus(), 100);
  } else if (name === 'admin') {
    $('adminScreen').style.display = 'block';
    window.location.hash = 'admin';
    renderAdmin();
  }
}

window.goAdmin  = () => loggedIn ? showScreen('admin') : showScreen('login');
window.goPublic = () => showScreen('public');
window.doLogout = () => { loggedIn = false; showScreen('public'); };

// ──────────────────────────────────────
// 로그인
// ──────────────────────────────────────
window.doLogin = function() {
  const pw = $('pwInput').value;
  if (pw === ADMIN_PW) {
    loggedIn = true;
    $('pwInput').value = '';
    $('loginError').textContent = '';
    showScreen('admin');
  } else {
    $('loginError').textContent = '❌ 비밀번호가 틀렸습니다.';
    $('pwInput').value = '';
    $('pwInput').focus();
  }
};
$('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin(); });

// ──────────────────────────────────────
// URL 해시 라우팅
// ──────────────────────────────────────
function handleHash() {
  if (window.location.hash === '#admin') {
    loggedIn ? showScreen('admin') : showScreen('login');
  } else {
    showScreen('public');
  }
}
window.addEventListener('hashchange', handleHash);
handleHash(); // 최초 진입

// ──────────────────────────────────────
// Firebase 구독
// ──────────────────────────────────────
onValue(ref(db, 'schedules'), snapshot => {
  const data = snapshot.val();
  allItems = data
    ? Object.entries(data)
        .map(([id, v]) => ({ id, ...v }))
        .sort((a, b) => a.targetTime - b.targetTime)
    : [];
  renderPublic();
  if (loggedIn) renderAdmin();
});

// ──────────────────────────────────────
// 유틸
// ──────────────────────────────────────
function fmtDate(ts) {
  const d = new Date(ts);
  const day = ['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${day})`;
}
function fmtTime(ts) {
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function getDayKey(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function fmtCd(ms) {
  if (ms <= 0) return null;
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return d > 0 ? `${d}일 ${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(h)}:${pad(m)}:${pad(sec)}`;
}

// ──────────────────────────────────────
// 공개 페이지 렌더
// ──────────────────────────────────────
function renderPublic() {
  const now = Date.now();
  const nd  = new Date(now);
  $('nowTime').textContent =
    `현재 시각: ${nd.getFullYear()}/${pad(nd.getMonth()+1)}/${pad(nd.getDate())} ` +
    `${pad(nd.getHours())}:${pad(nd.getMinutes())}:${pad(nd.getSeconds())}`;

  if (!allItems.length) {
    $('publicBody').innerHTML = '<tr><td colspan="6" class="empty">등록된 일정이 없습니다</td></tr>';
    $('tabs').innerHTML = '';
    return;
  }

  // 날짜 그룹
  const dayMap = {};
  allItems.forEach(item => {
    const k = getDayKey(item.targetTime);
    if (!dayMap[k]) dayMap[k] = [];
    dayMap[k].push(item);
  });
  const days = Object.keys(dayMap).sort();

  // 탭
  $('tabs').innerHTML = [
    `<button class="tab ${!selectedDay ? 'active' : ''}" onclick="window._day(null)">전체</button>`,
    ...days.map(d => {
      const ts = dayMap[d][0].targetTime;
      return `<button class="tab ${selectedDay === d ? 'active' : ''}" onclick="window._day('${d}')">${fmtDate(ts)}</button>`;
    })
  ].join('');

  // 다음 매치
  let nextItem = null;
  for (const item of allItems) {
    if (item.targetTime > now) { nextItem = item; break; }
  }

  const filtered = selectedDay ? (dayMap[selectedDay] || []) : allItems;
  let html = '';
  let lastDay = null;

  filtered.forEach(item => {
    const dk = getDayKey(item.targetTime);
    if (!selectedDay && dk !== lastDay) {
      lastDay = dk;
      html += `<tr class="day-header"><td colspan="6">📅 ${fmtDate(item.targetTime)}</td></tr>`;
    }
    const ms   = item.targetTime - now;
    const done = ms <= 0;
    const isNext = nextItem && item.id === nextItem.id;
    const cd   = fmtCd(ms);
    const cdCell = cd
      ? `<span class="cd">${cd}</span>${isNext ? '<span class="badge">NEXT</span>' : ''}`
      : `<span style="color:var(--txt3)">✅ 종료</span>`;

    html += `
      <tr class="${done ? 'done' : ''} ${isNext ? 'next' : ''}">
        <td>${fmtDate(item.targetTime)}</td>
        <td>${fmtTime(item.targetTime)}</td>
        <td>${cdCell}</td>
        <td>${item.label || '-'}</td>
        <td>${item.map   || '-'}</td>
        <td>${item.team  || '-'}</td>
      </tr>`;
  });

  $('publicBody').innerHTML = html || '<tr><td colspan="6" class="empty">일정 없음</td></tr>';
}

window._day = function(d) { selectedDay = d; renderPublic(); };

// 1초 타이머
if (ticker) clearInterval(ticker);
ticker = setInterval(renderPublic, 1000);

// ──────────────────────────────────────
// 관리자 목록 렌더
// ──────────────────────────────────────
function renderAdmin() {
  const now = Date.now();
  if (!allItems.length) {
    $('adminBody').innerHTML = '<tr><td colspan="7" class="empty">등록된 일정이 없습니다</td></tr>';
    return;
  }
  $('adminBody').innerHTML = allItems.map(item => {
    const done = item.targetTime <= now;
    return `
      <tr class="${done ? 'done' : ''}">
        <td>${fmtDate(item.targetTime)}</td>
        <td>${fmtTime(item.targetTime)}</td>
        <td>${item.title || '-'}</td>
        <td>${item.label || '-'}</td>
        <td>${item.map   || '-'}</td>
        <td>${item.team  || '-'}</td>
        <td>
          <button class="btn-sm btn-edit" onclick="window._edit('${item.id}')">수정</button>
          <button class="btn-sm btn-del"  onclick="window._del('${item.id}')">삭제</button>
        </td>
      </tr>`;
  }).join('');
}

// ──────────────────────────────────────
// CRUD
// ──────────────────────────────────────
window.submitSchedule = async function() {
  const timeVal = $('fTime').value;
  const title   = $('fTitle').value.trim();
  const label   = $('fLabel').value.trim();
  const map     = $('fMap').value.trim();
  const team    = $('fTeam').value.trim();

  if (!timeVal || !label) { showToast('날짜/시간과 라운드는 필수입니다!', '#e07070'); return; }

  const data = { targetTime: new Date(timeVal).getTime(), title, label, map, team };

  if (editingId) {
    await set(ref(db, `schedules/${editingId}`), data);
    showToast('✅ 수정 완료!');
  } else {
    await push(ref(db, 'schedules'), data);
    showToast('✅ 추가 완료!');
  }
  resetForm();
};

window._edit = function(id) {
  const item = allItems.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  const d = new Date(item.targetTime);
  $('fTime').value  = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('fTitle').value = item.title || '';
  $('fLabel').value = item.label || '';
  $('fMap').value   = item.map   || '';
  $('fTeam').value  = item.team  || '';
  $('formTitle').textContent   = '✏️ 일정 수정';
  $('submitBtn').textContent   = '수정 완료';
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window._del = async function(id) {
  if (!confirm('정말 삭제할까요?')) return;
  await remove(ref(db, `schedules/${id}`));
  showToast('🗑 삭제 완료!', '#e07070');
};

window.resetForm = function() {
  editingId = null;
  $('fTime').value  = '';
  $('fTitle').value = '';
  $('fLabel').value = '';
  $('fMap').value   = '';
  $('fTeam').value  = '';
  $('formTitle').textContent = '➕ 일정 추가';
  $('submitBtn').textContent = '추가';
};

// ──────────────────────────────────────
// 테마 토글 (다크/라이트)
// ──────────────────────────────────────
let dark = true; // 기본값: 다크 모드
window.toggleTheme = function() {
  dark = !dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  $('ico-dark').style.display  = dark ? 'none' : '';
  $('ico-light').style.display = dark ? '' : 'none';
};

// ──────────────────────────────────────
// 토스트
// ──────────────────────────────────────
function showToast(msg, bg = '#27ae60') {
  const t = $('toast');
  t.textContent = msg;
  t.style.background = bg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
