<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMHI 2026 - Group Stage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 30px 16px;
  }

  h1 {
    font-size: 1.6rem;
    color: #e07070;
    margin-bottom: 4px;
  }

  .day-label {
    font-size: 1rem;
    color: #aaa;
    margin-bottom: 6px;
  }

  .now {
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 24px;
  }

  table {
    width: 100%;
    max-width: 800px;
    border-collapse: collapse;
    background: #16213e;
    border-radius: 12px;
    overflow: hidden;
  }

  thead tr {
    background: #c0504d;
  }

  th {
    padding: 12px 16px;
    font-size: 0.85rem;
    letter-spacing: 1px;
    text-align: center;
  }

  td {
    padding: 12px 16px;
    text-align: center;
    font-size: 0.95rem;
    border-bottom: 1px solid #ffffff11;
  }

  tr:last-child td { border-bottom: none; }

  tr.done td { color: #555; }
  tr.next td { background: #ffffff08; }
  tr.next .countdown { color: #ffd700; font-weight: bold; }

  .countdown {
    font-variant-numeric: tabular-nums;
    font-size: 1rem;
    letter-spacing: 1px;
  }

  .badge {
    display: inline-block;
    background: #ffd700;
    color: #000;
    font-size: 0.65rem;
    font-weight: bold;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .done-text { color: #555; font-size: 0.85rem; }
</style>
</head>
<body>

<h1>⚡ PMHI 2026</h1>
<div class="day-label">6월 29일 — Group Stage Day 1</div>
<div class="now" id="nowTime">로딩 중...</div>

<table>
  <thead>
    <tr>
      <th>시간 (UTC+9)</th>
      <th>카운트다운</th>
      <th>부분</th>
      <th>MAP</th>
      <th>팀</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <tr><td colspan="5" style="color:#666;padding:30px">데이터 불러오는 중...</td></tr>
  </tbody>
</table>

<script>
// ✅ 여기에 구글 시트 CSV URL 붙여넣기
const CSV_URL = 'YOUR_CSV_URL_HERE';

const schedule = [
  { time: '16:30', label: '선수 출발',    map: '-',               roundIdx: null },
  { time: '17:30', label: '선수 테스트',  map: '-',               roundIdx: null },
  { time: '19:00', label: '매치 1 (Match1)', map: '론도 (Rondo)',    roundIdx: 0 },
  { time: '19:30', label: '매치 2 (Match2)', map: '에란겔 (Erangel)', roundIdx: 1 },
  { time: '20:10', label: '매치 3 (Match3)', map: '에란겔 (Erangel)', roundIdx: 2 },
  { time: '20:55', label: '매치 4 (Match4)', map: '에란겔 (Erangel)', roundIdx: 3 },
  { time: '21:35', label: '매치 5 (Match5)', map: '미라마 (Miramar)', roundIdx: 4 },
  { time: '22:15', label: '매치 6 (Match6)', map: '미라마 (Miramar)', roundIdx: 5 },
  { time: '23:30', label: '선수 퇴장',    map: '-',               roundIdx: null },
];

let targets = [];

function pad(n) { return String(n).padStart(2, '0'); }

function formatCountdown(ms) {
  if (ms <= 0) return null;
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (d > 0) return `${d}일 ${pad(h)}:${pad(m)}:${pad(sec)}`;
  return `${pad(h)}:${pad(m)}:${pad(sec)}`;
}

function render() {
  const now = Date.now();
  const nd = new Date(now);
  document.getElementById('nowTime').textContent =
    `현재 시각: ${nd.getFullYear()}/${pad(nd.getMonth()+1)}/${pad(nd.getDate())} ${pad(nd.getHours())}:${pad(nd.getMinutes())}:${pad(nd.getSeconds())}`;

  // 다음 매치 인덱스 찾기
  let nextScheduleIdx = -1;
  for (let i = 0; i < schedule.length; i++) {
    const ri = schedule[i].roundIdx;
    if (ri !== null && targets[ri] && targets[ri] > now) {
      nextScheduleIdx = i;
      break;
    }
  }

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = schedule.map((item, i) => {
    const ri = item.roundIdx;
    const target = ri !== null ? targets[ri] : null;
    const ms = target ? target - now : null;
    const done = ms !== null && ms <= 0;
    const isNext = i === nextScheduleIdx;
    const cd = ms !== null ? formatCountdown(ms) : null;

    const countdownCell = cd
      ? `<span class="countdown">${cd}</span>${isNext ? '<span class="badge">NEXT</span>' : ''}`
      : done
        ? `<span class="done-text">✅ 종료</span>`
        : `<span style="color:#444">-</span>`;

    return `
      <tr class="${done ? 'done' : ''} ${isNext ? 'next' : ''}">
        <td>${item.time}</td>
        <td>${countdownCell}</td>
        <td>${item.label}</td>
        <td>${item.map}</td>
        <td>Red Team &amp; Green Team</td>
      </tr>`;
  }).join('');
}

// CSV 파싱
function parseCSV(text) {
  const lines = text.trim().split('\n').slice(1); // 헤더 제거
  targets = lines.map(line => {
    const cols = line.split(',');
    const val = cols[1]?.replace(/"/g, '').trim();
    return val ? new Date(val).getTime() : null;
  });
  render();
  setInterval(render, 1000);
}

// CSV 불러오기
fetch(CSV_URL)
  .then(r => r.text())
  .then(parseCSV)
  .catch(() => {
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="5" style="color:#e07070">❌ CSV 불러오기 실패 — URL을 확인하세요</td></tr>';
  });
</script>
</body>
</html>
