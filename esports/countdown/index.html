<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG MOBILE ESPORTS - CENTRAL</title>
<style>
  [data-theme="light"] {
    --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --surface3:#e2e8f0;
    --bd:#e2e8f0; --bd2:#cbd5e1; --txt:#0f172a; --txt2:#475569; --txt3:#94a3b8;
    --sh:0 4px 20px rgba(15,23,42,0.06); --sh-sm:0 2px 8px rgba(15,23,42,0.04);
    --accent:#b91c1c; --accent2:#991b1b; --accent-soft:rgba(185,28,28,0.08);
    --thead-bg:#1e293b; --row-done:#f8fafc; --row-done-txt:#94a3b8;
    --row-next:rgba(185,28,28,0.04); --border-row:#f1f5f9;
    --input-bg:#ffffff; --input-bd:#cbd5e1;
    --sess-hd:#f1f5f9; --sess-bd:#e2e8f0;
    --green:#059669; --green2:#047857;
    --blue:#2563eb; --blue2:#1d4ed8;
  }
  [data-theme="dark"] {
    --bg:#0f172a; --surface:#1e293b; --surface2:#334155; --surface3:#475569;
    --bd:#334155; --bd2:#475569; --txt:#f8fafc; --txt2:#94a3b8; --txt3:#64748b;
    --sh:0 4px 25px rgba(0,0,0,0.3); --sh-sm:0 2px 8px rgba(0,0,0,0.2);
    --accent:#ef4444; --accent2:#dc2626; --accent-soft:rgba(239,68,68,0.08);
    --thead-bg:#0f172a; --row-done:#151d2a; --row-done-txt:#475569;
    --row-next:rgba(239,68,68,0.06); --border-row:#334155;
    --input-bg:#0f172a; --input-bd:#475569;
    --sess-hd:#1a2744; --sess-bd:#334155;
    --green:#059669; --green2:#047857;
    --blue:#2563eb; --blue2:#1d4ed8;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:28px 16px;transition:background .3s,color .3s;}

  /* ── 공통 레이아웃 ── */
  .wrap{max-width:960px;margin:0 auto;}

  /* ── 헤더 ── */
  .page-brand{text-align:center;color:var(--txt3);font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;font-weight:700;}
  h1{text-align:center;font-size:1.85rem;font-weight:800;margin-bottom:4px;letter-spacing:-0.5px;}
  h1 span{color:var(--accent);}
  .subtitle{text-align:center;color:var(--txt2);font-size:0.85rem;margin-bottom:6px;font-weight:500;}
  .now-time{text-align:center;color:var(--txt3);font-size:0.76rem;margin-bottom:26px;font-variant-numeric:tabular-nums;}

  /* ── 탑 네비 ── */
  .top-nav{display:flex;justify-content:flex-end;align-items:center;max-width:960px;margin:0 auto 18px;gap:8px;}
  .nav-btn{padding:6px 14px;border-radius:5px;border:1px solid var(--bd2);background:var(--surface);color:var(--txt2);cursor:pointer;font-size:0.78rem;font-weight:500;transition:all .2s;}
  .nav-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface2);}
  .theme-btn{padding:5px 10px;border-radius:5px;border:1px solid var(--bd2);background:var(--surface);color:var(--txt2);cursor:pointer;font-size:0.92rem;transition:all .2s;line-height:1;}
  .theme-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface2);}

  /* ── 탭 ── */
  .tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
  .tab{padding:6px 15px;border-radius:5px;border:1px solid var(--bd2);background:var(--surface);color:var(--txt2);cursor:pointer;font-size:0.8rem;font-weight:500;transition:all .2s;}
  .tab:hover{border-color:var(--accent);color:var(--accent);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

  /* ── 공개 테이블 ── */
  .table-wrap{max-width:960px;margin:0 auto;border-radius:8px;overflow:hidden;overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--sh);border:1px solid var(--bd);}
  table{width:100%;border-collapse:collapse;background:var(--surface);}
  thead tr{background:var(--thead-bg);border-bottom:2px solid var(--accent);}
  th{padding:13px 14px;font-size:0.78rem;font-weight:700;text-align:center;white-space:nowrap;color:#fff;letter-spacing:0.4px;}
  td{padding:12px 14px;text-align:center;font-size:0.86rem;border-bottom:1px solid var(--border-row);white-space:nowrap;color:var(--txt);transition:background .15s;}
  tbody tr:hover td{background:var(--surface2);}
  tr:last-child td{border-bottom:none;}
  tr.done td{color:var(--row-done-txt);background:var(--row-done);}
  tr.done:hover td{background:var(--row-done);}
  tr.next{background:var(--row-next);}
  tr.next .cd{color:var(--accent);font-weight:700;}
  .cd{font-variant-numeric:tabular-nums;letter-spacing:.4px;}
  .badge{display:inline-block;background:var(--accent);color:#fff;font-size:0.58rem;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle;}
  .empty{text-align:center;padding:48px;color:var(--txt3);font-size:0.86rem;}

  /* 세션 구분행 */
  .session-row td{background:var(--sess-hd)!important;font-size:0.76rem;font-weight:700;color:var(--txt2);letter-spacing:.4px;padding:7px 14px;border-bottom:1px solid var(--sess-bd);text-align:left;}
  .session-row:hover td{background:var(--sess-hd)!important;}
  .stag{display:inline-block;background:var(--accent);color:#fff;font-size:0.62rem;font-weight:800;padding:2px 7px;border-radius:4px;margin-right:7px;vertical-align:middle;}

  .link-btn{display:inline-block;padding:4px 10px;border-radius:4px;background:var(--surface3);color:var(--txt2);font-size:0.76rem;text-decoration:none;font-weight:600;border:1px solid var(--bd2);transition:all .2s;}
  .link-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  tr.done .link-btn{opacity:.65;}

  /* ── 로그인 ── */
  #loginScreen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;}
  .login-box{background:var(--surface);border-radius:8px;padding:36px 40px;display:flex;flex-direction:column;gap:14px;align-items:center;border:1px solid var(--bd);min-width:320px;box-shadow:var(--sh);}
  .login-box h2{color:var(--txt);font-size:1.35rem;font-weight:700;}
  .login-box input{width:100%;padding:11px 14px;border-radius:5px;border:1px solid var(--input-bd);background:var(--input-bg);color:var(--txt);font-size:0.92rem;text-align:center;}
  .login-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(185,28,28,.14);}
  .login-box button{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:5px;font-size:0.92rem;cursor:pointer;font-weight:600;}
  .login-box button:hover{background:var(--accent2);}
  .login-error{color:#ef4444;font-size:0.8rem;min-height:18px;}
  .back-btn{color:var(--txt3);font-size:0.78rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .back-btn:hover{color:var(--txt2);}

  /* ── 관리자 공통 ── */
  #adminScreen{display:none;}
  .admin-header{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto 20px;flex-wrap:wrap;gap:10px;}
  .admin-header h1{margin:0;font-size:1.45rem;text-align:left;}
  .logout-btn{padding:6px 14px;border-radius:5px;border:1px solid var(--bd2);background:var(--surface);color:var(--txt2);cursor:pointer;font-size:0.78rem;font-weight:500;transition:all .2s;}
  .logout-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ── 폼 박스 (크기 통일) ── */
  .form-box{max-width:960px;margin:0 auto 16px;background:var(--surface);border-radius:8px;padding:20px 22px;border:1px solid var(--bd);box-shadow:var(--sh-sm);}
  .form-box h3{color:var(--accent);font-size:0.9rem;margin-bottom:14px;font-weight:700;}
  /* 모든 그리드 열 너비 통일: 4열 */
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
  .form-grid.col2{grid-template-columns:repeat(2,1fr);}
  .form-grid.col3{grid-template-columns:repeat(3,1fr);}
  .form-group label{font-size:0.72rem;color:var(--txt2);display:block;margin-bottom:5px;font-weight:600;}
  .form-group input,.form-group select{width:100%;padding:9px 11px;background:var(--input-bg);border:1px solid var(--input-bd);border-radius:5px;color:var(--txt);font-size:0.84rem;}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);}
  .btn-row{display:flex;gap:8px;justify-content:flex-end;}
  .btn{padding:9px 20px;border:none;border-radius:5px;cursor:pointer;font-size:0.85rem;font-weight:600;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent2);}
  .btn-secondary{background:var(--surface3);color:var(--txt2);}
  .btn-secondary:hover{background:var(--bd2);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-green:hover{background:var(--green2);}

  /* ── 세션 카드 ── */
  .sessions-wrap{max-width:960px;margin:0 auto 36px;display:flex;flex-direction:column;gap:14px;}
  .session-card{background:var(--surface);border:1px solid var(--bd);border-radius:8px;overflow:hidden;box-shadow:var(--sh-sm);}
  .session-card-header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:var(--sess-hd);border-bottom:1px solid var(--sess-bd);gap:10px;flex-wrap:wrap;}
  .sch-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;}
  .sch-left strong{font-size:0.9rem;font-weight:700;color:var(--txt);}
  .sch-meta{font-size:0.76rem;color:var(--txt2);}
  .sch-link{font-size:0.72rem;color:var(--accent);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;}
  .sch-link:hover{text-decoration:underline;}
  .sch-actions{display:flex;gap:6px;flex-shrink:0;}

  .round-table{width:100%;border-collapse:collapse;}
  .round-table th{padding:8px 13px;font-size:0.73rem;font-weight:700;text-align:center;color:var(--txt3);border-bottom:1px solid var(--border-row);white-space:nowrap;}
  .round-table td{padding:10px 13px;text-align:center;font-size:0.83rem;border-bottom:1px solid var(--border-row);color:var(--txt);white-space:nowrap;}
  .round-table tr:last-child td{border-bottom:none;}
  .round-table tbody tr:hover td{background:var(--surface2);}

  /* 라운드 추가 행 - 높이 통일 */
  .round-add-row{padding:12px 18px;border-top:1px solid var(--border-row);background:var(--surface2);display:grid;grid-template-columns:140px 1fr 1fr auto;gap:10px;align-items:end;}
  .round-add-row .form-group{margin:0;}
  .round-add-row .form-group label{font-size:0.68rem;margin-bottom:4px;}
  .round-add-row .form-group input,
  .round-add-row .form-group select{padding:7px 10px;font-size:0.8rem;}

  .btn-sm{padding:5px 11px;border:none;border-radius:4px;cursor:pointer;font-size:0.73rem;font-weight:600;}
  .btn-edit{background:var(--blue);color:#fff;margin-right:3px;}
  .btn-edit:hover{background:var(--blue2);}
  .btn-del{background:#dc2626;color:#fff;}
  .btn-del:hover{background:#b91c1c;}
  .round-empty{text-align:center;padding:18px;color:var(--txt3);font-size:0.8rem;}

  /* ── 모달 ── */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:8px;padding:26px;width:90%;max-width:460px;border:1px solid var(--bd);box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .modal h3{font-size:0.95rem;font-weight:700;color:var(--accent);margin-bottom:16px;}
  .modal .form-grid{grid-template-columns:1fr;gap:12px;}
  .modal .btn-row{margin-top:6px;}

  /* ── 계정 관리 ── */
  #superAdminSection{display:none;}
  .section-title{font-size:1rem;font-weight:700;color:var(--txt);margin:30px auto 12px;max-width:960px;}
  .account-list{max-width:960px;margin:0 auto 24px;background:var(--surface);border:1px solid var(--bd);border-radius:8px;overflow:hidden;box-shadow:var(--sh-sm);}
  .account-item{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border-row);}
  .account-item:last-child{border-bottom:none;}
  .account-item:hover{background:var(--surface2);}
  .account-info{display:flex;align-items:center;gap:11px;}
  .account-avatar{width:34px;height:34px;border-radius:50%;background:var(--surface3);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:0.85rem;color:var(--txt);font-weight:700;}
  .account-id{font-size:0.88rem;font-weight:600;color:var(--txt);}
  .account-role{font-size:0.62rem;font-weight:700;letter-spacing:.4px;color:var(--accent);background:rgba(185,28,28,.1);border:1px solid rgba(185,28,28,.2);border-radius:4px;padding:3px 8px;}
  .account-empty{text-align:center;padding:36px;color:var(--txt3);font-size:0.85rem;}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:11px 26px;border-radius:5px;font-size:0.85rem;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.12);}
  .toast.show{opacity:1;}

  /* ── 반응형 ── */
  @media(max-width:768px){
    body{padding:14px 10px;}
    h1{font-size:1.5rem;}
    .form-grid{grid-template-columns:1fr 1fr!important;}
    .form-grid.col2{grid-template-columns:1fr!important;}
    .round-add-row{grid-template-columns:1fr 1fr;gap:8px;}
    .round-add-row .btn-green{grid-column:1/-1;}
    .admin-header{flex-direction:column;align-items:flex-start;}
    .session-card-header{flex-direction:column;align-items:flex-start;}
    .table-wrap{border-radius:6px;}
    table{display:block;overflow-x:auto;}
  }
  @media(max-width:480px){
    .form-grid{grid-template-columns:1fr!important;}
    .login-box{min-width:unset;width:100%;padding:24px 16px;}
  }
</style>
</head>
<body>

<!-- 공개 화면 -->
<div id="publicScreen">
  <div class="top-nav">
    <button class="theme-btn" onclick="toggleTheme()">
      <span id="ico-dark">🌙</span><span id="ico-light" style="display:none">☀️</span>
    </button>
    <button class="nav-btn" onclick="goAdmin()">🔐 관리자</button>
  </div>
  <p class="page-brand">PUBG MOBILE ESPORTS</p>
  <h1>⚡ <span>ESPORTS CENTRAL</span></h1>
  <p class="subtitle">실시간 대회 일정 & 카운트다운</p>
  <p class="now-time" id="nowTime">-</p>
  <div class="tabs" id="tabs"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>날짜</th><th>시간 (KST)</th><th>카운트다운</th>
          <th>대회명</th><th>라운드</th><th>MAP</th><th>팀</th><th>중계</th>
        </tr>
      </thead>
      <tbody id="publicBody">
        <tr><td colspan="8" class="empty">⏳ 로딩 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 로그인 -->
<div id="loginScreen">
  <div class="login-box">
    <h2>🔐 관리자 로그인</h2>
    <input type="text" id="idInput" placeholder="아이디" autocomplete="username"/>
    <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="current-password"/>
    <p class="login-error" id="loginError"></p>
    <button onclick="doLogin()">로그인</button>
    <span class="back-btn" onclick="goPublic()">← 돌아가기</span>
  </div>
</div>

<!-- 관리자 -->
<div id="adminScreen">
  <div class="admin-header">
    <div>
      <h1>⚙️ 관리자 <span id="adminRoleBadge" style="font-size:.72rem;vertical-align:middle;margin-left:6px;"></span></h1>
      <p class="subtitle" style="text-align:left;margin:0">ESPORTS CENTRAL 일정 관리</p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="logout-btn" onclick="goPublic()">← 공개 페이지</button>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <!-- 세션 추가 폼 -->
  <div class="form-box">
    <h3>➕ 새 세션 생성 <span style="font-size:.72rem;font-weight:400;color:var(--txt3)">— 대회명 + 날짜 단위로 묶음 생성, 링크는 라운드 전체에 공유됩니다</span></h3>
    <div class="form-grid">
      <div class="form-group">
        <label>날짜 *</label>
        <input type="date" id="sDate">
      </div>
      <div class="form-group">
        <label>대회명 *</label>
        <select id="sTitle" onchange="toggleSCustom()">
          <option value="">-- 선택 --</option>
          <option value="PMMI 2026">PMMI 2026</option>
          <option value="PMPS S2 2026">PMPS S2 2026</option>
          <option value="PMWC 2026">PMWC 2026</option>
          <option value="custom">직접 입력</option>
        </select>
        <input type="text" id="sTitleCustom" placeholder="대회명 입력" style="display:none;margin-top:7px;">
      </div>
      <div class="form-group">
        <label>팀 / 스테이지</label>
        <select id="sTeam" onchange="toggleSCustom()">
          <option value="">-- 선택 --</option>
          <option value="Group Stage Day 1">Group Stage Day 1</option>
          <option value="Group Stage Day 2">Group Stage Day 2</option>
          <option value="Group Stage Day 3">Group Stage Day 3</option>
          <option value="Grand Finals">Grand Finals</option>
          <option value="Red Group & Green Group">Red & Green Group</option>
          <option value="Red Group & Yellow Group">Red & Yellow Group</option>
          <option value="Yellow Group & Green Group">Yellow & Green Group</option>
          <option value="전체">전체</option>
          <option value="custom">직접 입력</option>
        </select>
        <input type="text" id="sTeamCustom" placeholder="팀/스테이지 입력" style="display:none;margin-top:7px;">
      </div>
      <div class="form-group">
        <label>중계 링크 (세션 공통)</label>
        <input type="url" id="sLink" placeholder="https://youtube.com/...">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="addSession()">세션 생성</button>
    </div>
  </div>

  <!-- 세션 카드 목록 -->
  <div class="sessions-wrap" id="sessionsWrap">
    <div style="text-align:center;padding:40px;color:var(--txt3);font-size:.86rem">⏳ 로딩 중...</div>
  </div>

  <!-- 슈퍼 어드민 -->
  <div id="superAdminSection">
    <h2 class="section-title">👤 최고 관리자 전용 — 계정 제어</h2>
    <div class="form-box">
      <h3>➕ 관리자 계정 추가</h3>
      <div class="form-grid col2">
        <div class="form-group">
          <label>아이디 *</label>
          <input type="text" id="aId" placeholder="영문/숫자" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label>비밀번호 * (4자 이상)</label>
          <input type="password" id="aPw" placeholder="비밀번호" autocomplete="new-password"/>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="addAccount()">계정 추가</button>
      </div>
    </div>
    <div class="account-list" id="accountList">
      <div class="account-empty">로딩 중...</div>
    </div>
  </div>
</div>

<!-- 세션 수정 모달 -->
<div class="modal-overlay" id="sessionModal">
  <div class="modal">
    <h3>✏️ 세션 수정</h3>
    <div class="form-grid" style="gap:12px;margin-bottom:14px">
      <div class="form-group"><label>날짜 *</label><input type="date" id="mDate"></div>
      <div class="form-group">
        <label>대회명 *</label>
        <select id="mTitle" onchange="toggleMCustom()">
          <option value="PMMI 2026">PMMI 2026</option>
          <option value="PMPS S2 2026">PMPS S2 2026</option>
          <option value="PMWC 2026">PMWC 2026</option>
          <option value="custom">직접 입력</option>
        </select>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, get }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyClByQBVoznJznLBTLcQ-6fszkOxGck99Y",
  authDomain: "countdown-pubg.firebaseapp.com",
  databaseURL: "https://countdown-pubg-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "countdown-pubg",
  storageBucket: "countdown-pubg.firebasestorage.app",
  messagingSenderId: "474098863700",
  appId: "1:474098863700:web:523b316e14b710970527c1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const pad = n => String(n).padStart(2,'0');
const $ = id => document.getElementById(id);
const STD_ROUNDS = ['Round 1','Round 2','Round 3','Round 4','Round 5','Round 6'];
const STD_TITLES = ['PMMI 2026','PMPS S2 2026','PMWC 2026'];
const STD_TEAMS  = ['Group Stage Day 1','Group Stage Day 2','Group Stage Day 3','Grand Finals',
                    'Red Group & Green Group','Red Group & Yellow Group','Yellow Group & Green Group','전체'];

let allSessions = [];
let loggedIn = false, currentUser = null, selectedDay = null, ticker = null;
let editSessId = null, editRoundSessId = null, editRoundId = null;

// ── 유틸 ──
function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()}(${'일월화수목금토'[d.getDay()]})`; }
function fmtTime(ts){ const d=new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtCd(ms){
  if(ms<=0)return null;
  const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), sc=s%60;
  return d>0?`${d}일 ${pad(h)}:${pad(m)}:${pad(sc)}`:`${pad(h)}:${pad(m)}:${pad(sc)}`;
}
function dateToTs(date,time){ return new Date(`${date}T${time||'00:00'}:00`).getTime(); }
function pickCustom(selectEl, customEl, stdList){
  const v = selectEl.value;
  customEl.style.display = v==='custom'?'block':'none';
  return v==='custom' ? customEl.value.trim() : v;
}

// ── 화면 전환 ──
function showScreen(name){
  ['publicScreen','loginScreen','adminScreen'].forEach(id=>$(id).style.display='none');
  if(name==='public'){ $('publicScreen').style.display='block'; location.hash=''; }
  else if(name==='login'){ $('loginScreen').style.display='flex'; location.hash='admin'; setTimeout(()=>$('idInput').focus(),100); }
  else if(name==='admin'){
    $('adminScreen').style.display='block'; location.hash='admin';
    const isSuper = currentUser&&currentUser.toLowerCase()==='admin1';
    $('superAdminSection').style.display = isSuper?'block':'none';
    const badge = $('adminRoleBadge');
    badge.className='account-role';
    if(!isSuper){ badge.style.cssText='background:rgba(71,85,105,.1);color:var(--txt2);border-color:rgba(71,85,105,.2);'; }
    else { badge.style.cssText=''; }
    badge.textContent = isSuper?'SUPER ADMIN':'STAFF';
    if(isSuper) renderAccounts();
    renderAdmin();
  }
}
window.goAdmin  = ()=>loggedIn?showScreen('admin'):showScreen('login');
window.goPublic = ()=>showScreen('public');
window.doLogout = ()=>{ loggedIn=false; currentUser=null; showScreen('public'); };

window.doLogin = async function(){
  const id=$('idInput').value.trim(), pw=$('pwInput').value;
  if(!id||!pw){ $('loginError').textContent='⚠️ 아이디와 비밀번호를 입력하세요.'; return; }
  try{
    const snap=await get(ref(db,`admins/${id}`));
    if(snap.exists()&&snap.val().pw===pw){
      loggedIn=true; currentUser=id;
      $('idInput').value=''; $('pwInput').value=''; $('loginError').textContent='';
      showScreen('admin');
    } else { $('loginError').textContent='❌ 아이디 또는 비밀번호가 틀렸습니다.'; $('pwInput').value=''; $('pwInput').focus(); }
  } catch(e){ $('loginError').textContent='❌ 접근 거부 또는 오류.'; }
};
['idInput','pwInput'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter')window.doLogin(); }));

function handleHash(){ location.hash==='#admin' ? (loggedIn?showScreen('admin'):showScreen('login')) : showScreen('public'); }
window.addEventListener('hashchange',handleHash); handleHash();

// ── Firebase 구독 ──
onValue(ref(db,'sessions'),snapshot=>{
  const data=snapshot.val();
  allSessions = data
    ? Object.entries(data).map(([id,v])=>({
        id, date:v.date||'', title:v.title||'', team:v.team||'', link:v.link||'',
        rounds: v.rounds ? Object.entries(v.rounds).map(([rid,rv])=>({id:rid,...rv})) : []
      }))
    : [];
  allSessions.sort((a,b)=>a.date.localeCompare(b.date));
  renderPublic();
  if(loggedIn) renderAdmin();
});

// ── 공개 화면 ──
function renderPublic(){
  const now=Date.now(), nd=new Date(now);
  $('nowTime').textContent=`현재 시각: ${nd.getFullYear()}/${pad(nd.getMonth()+1)}/${pad(nd.getDate())} ${pad(nd.getHours())}:${pad(nd.getMinutes())}:${pad(nd.getSeconds())}`;

  let allRounds=[];
  allSessions.forEach(sess=>sess.rounds.forEach(r=>{ allRounds.push({...r,sess,ts:dateToTs(sess.date,r.time)}); }));

  const daySet=new Set(allSessions.map(s=>s.date));
  const days=[...daySet].sort();
  $('tabs').innerHTML=[
    `<button class="tab ${!selectedDay?'active':''}" onclick="window._day(null)">전체</button>`,
    ...days.map(d=>`<button class="tab ${selectedDay===d?'active':''}" onclick="window._day('${d}')">${fmtDate(dateToTs(d,'12:00'))}</button>`)
  ].join('');

  allRounds.sort((a,b)=>{ const ad=a.ts<=now,bd=b.ts<=now; return ad!==bd?(ad?1:-1):a.ts-b.ts; });
  const nextRound=allRounds.find(r=>r.ts>now);
  const filtered=selectedDay?allRounds.filter(r=>r.sess.date===selectedDay):allRounds;

  if(!filtered.length){ $('publicBody').innerHTML='<tr><td colspan="8" class="empty">일정 없음</td></tr>'; return; }

  let html='', prevSessId=null;
  filtered.forEach(r=>{
    const ms=r.ts-now, done=ms<=0, isNext=nextRound&&r.id===nextRound.id&&r.sess.id===nextRound.sess.id;
    const cd=fmtCd(ms);
    const cdCell=cd?`<span class="cd">${cd}</span>${isNext?'<span class="badge">NEXT</span>':''}`:`<span style="color:var(--txt3)">✅ 종료</span>`;

    if(r.sess.id!==prevSessId){
      const lk=r.sess.link?`&nbsp;·&nbsp;<a href="${r.sess.link}" target="_blank" class="link-btn" style="font-size:.68rem;padding:2px 8px">📺 중계</a>`:'';
      html+=`<tr class="session-row"><td colspan="8"><span class="stag">${r.sess.title||'대회'}</span>${fmtDate(dateToTs(r.sess.date,'12:00'))}&nbsp;·&nbsp;${r.sess.team||'팀 미정'}${lk}</td></tr>`;
      prevSessId=r.sess.id;
    }
    html+=`
      <tr class="${done?'done':''} ${isNext?'next':''}">
        <td>${fmtDate(r.ts)}</td><td>${fmtTime(r.ts)}</td><td>${cdCell}</td>
        <td style="font-weight:700;color:var(--accent)">${r.sess.title||'-'}</td>
        <td>${r.label||'-'}</td><td>${r.map||'-'}</td><td>${r.sess.team||'-'}</td>
        <td>${r.sess.link?`<a href="${r.sess.link}" target="_blank" class="link-btn">📺 바로가기</a>`:'<span style="color:var(--txt3)">-</span>'}</td>
      </tr>`;
  });
  $('publicBody').innerHTML=html;
}
window._day=d=>{ selectedDay=d; renderPublic(); };
if(ticker)clearInterval(ticker);
ticker=setInterval(renderPublic,1000);

// ── 관리자 화면 ──
function renderAdmin(){
  if(!allSessions.length){
    $('sessionsWrap').innerHTML='<div style="text-align:center;padding:40px;color:var(--txt3);font-size:.84rem">등록된 세션이 없습니다. 위에서 새 세션을 생성하세요.</div>';
    return;
  }
  $('sessionsWrap').innerHTML=allSessions.map(renderSessionCard).join('');
}

function renderSessionCard(sess){
  const rows=sess.rounds.length
    ? [...sess.rounds].sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(r=>`
        <tr>
          <td>${r.time||'-'}</td><td>${r.label||'-'}</td><td>${r.map||'-'}</td>
          <td>
            <button class="btn-sm btn-edit" onclick="openRoundEdit('${sess.id}','${r.id}')">수정</button>
            <button class="btn-sm btn-del"  onclick="delRound('${sess.id}','${r.id}')">삭제</button>
          </td>
        </tr>`).join('')
    : `<tr><td colspan="4" class="round-empty">라운드가 없습니다. 아래에서 추가하세요.</td></tr>`;

  const linkDisplay=sess.link
    ? `<a href="${sess.link}" target="_blank" class="sch-link" title="${sess.link}">🔗 ${sess.link}</a>`
    : `<span style="color:var(--txt3);font-size:.72rem">링크 없음</span>`;

  return `
    <div class="session-card">
      <div class="session-card-header">
        <div class="sch-left">
          <span class="stag">${sess.title||'대회'}</span>
          <strong>${sess.date}</strong>
          <span class="sch-meta">${sess.team||'팀 미정'}</span>
          <span style="color:var(--txt3);font-size:.76rem">·</span>
          ${linkDisplay}
        </div>
        <div class="sch-actions">
          <button class="btn-sm btn-edit" onclick="openSessionEdit('${sess.id}')">세션 수정</button>
          <button class="btn-sm btn-del"  onclick="delSession('${sess.id}')">세션 삭제</button>
        </div>
      </div>
      <table class="round-table">
        <thead><tr><th>시간 (KST)</th><th>라운드</th><th>MAP</th><th>관리</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="round-add-row">
        <div class="form-group"><label>시간 *</label><input type="time" id="rt_${sess.id}"></div>
        <div class="form-group">
          <label>라운드 *</label>
          <select id="rl_${sess.id}" onchange="toggleRoundAddCustom('${sess.id}')">
            <option value="">-- 선택 --</option>
            <option>Round 1</option><option>Round 2</option><option>Round 3</option>
            <option>Round 4</option><option>Round 5</option><option>Round 6</option>
            <option value="custom">직접 입력</option>
          </select>
          <input type="text" id="rlc_${sess.id}" placeholder="라운드명" style="display:none;margin-top:6px;">
        </div>
        <div class="form-group">
          <label>MAP</label>
          <select id="rm_${sess.id}">
            <option value="">-- 선택 --</option>
            <option>Rondo</option><option>Erangel</option><option>Miramar</option><option>Sanhok</option>
          </select>
        </div>
        <button class="btn btn-green" style="white-space:nowrap;align-self:end" onclick="addRound('${sess.id}')">+ 라운드 추가</button>
      </div>
    </div>`;
}

// ── 세션 CRUD ──
window.toggleSCustom = function(){
  const t=$('sTitle'),tc=$('sTitleCustom');
  tc.style.display=t.value==='custom'?'block':'none';
  const tm=$('sTeam'),tmc=$('sTeamCustom');
  tmc.style.display=tm.value==='custom'?'block':'none';
};
window.toggleMCustom = function(){
  $('mTitleCustom').style.display=$('mTitle').value==='custom'?'block':'none';
  $('mTeamCustom').style.display=$('mTeam').value==='custom'?'block':'none';
};

window.addSession = async function(){
  const date=$('sDate').value;
  let title=$('sTitle').value; if(title==='custom') title=$('sTitleCustom').value.trim();
  let team=$('sTeam').value;   if(team==='custom')  team=$('sTeamCustom').value.trim();
  const link=$('sLink').value.trim();
  if(!date||!title){ showToast('날짜와 대회명은 필수입니다!','#ef4444'); return; }
  await push(ref(db,'sessions'),{date,title,team,link});
  $('sDate').value=''; $('sTitle').value=''; $('sTitleCustom').value=''; $('sTitleCustom').style.display='none';
  $('sTeam').value=''; $('sTeamCustom').value=''; $('sTeamCustom').style.display='none'; $('sLink').value='';
  showToast('✅ 세션 생성 완료!');
};

window.openSessionEdit = function(sessId){
  const s=allSessions.find(x=>x.id===sessId); if(!s)return;
  editSessId=sessId;
  $('mDate').value=s.date;
  if(STD_TITLES.includes(s.title)){ $('mTitle').value=s.title; $('mTitleCustom').style.display='none'; }
  else { $('mTitle').value='custom'; $('mTitleCustom').style.display='block'; $('mTitleCustom').value=s.title; }
  if(!s.team||STD_TEAMS.includes(s.team)){ $('mTeam').value=s.team||''; $('mTeamCustom').style.display='none'; }
  else { $('mTeam').value='custom'; $('mTeamCustom').style.display='block'; $('mTeamCustom').value=s.team; }
  $('mLink').value=s.link||'';
  $('sessionModal').classList.add('open');
};

window.saveSession = async function(){
  if(!editSessId)return;
  const date=$('mDate').value;
  let title=$('mTitle').value; if(title==='custom') title=$('mTitleCustom').value.trim();
  let team=$('mTeam').value;   if(team==='custom')  team=$('mTeamCustom').value.trim();
  const link=$('mLink').value.trim();
  if(!date||!title){ showToast('날짜와 대회명은 필수입니다!','#ef4444'); return; }
  const s=allSessions.find(x=>x.id===editSessId);
  const roundsData={};
  if(s) s.rounds.forEach(r=>{ roundsData[r.id]={time:r.time,label:r.label,map:r.map}; });
  await set(ref(db,`sessions/${editSessId}`),{date,title,team,link,rounds:roundsData});
  closeModal('sessionModal'); showToast('✅ 세션 수정 완료!');
};

window.delSession = async function(sessId){
  if(!confirm('세션 전체(라운드 포함)를 삭제할까요?'))return;
  await remove(ref(db,`sessions/${sessId}`)); showToast('🗑 세션 삭제 완료!','#ef4444');
};

// ── 라운드 CRUD ──
window.toggleRoundAddCustom = function(sessId){
  const s=$(`rl_${sessId}`), c=$(`rlc_${sessId}`);
  if(s&&c) c.style.display=s.value==='custom'?'block':'none';
};
window.toggleRCustom = function(){
  $('rLabelCustom').style.display=$('rLabel').value==='custom'?'block':'none';
};

window.addRound = async function(sessId){
  const time=$(`rt_${sessId}`).value;
  const sel=$(`rl_${sessId}`);
  let label=sel.value; if(label==='custom') label=$(`rlc_${sessId}`).value.trim();
  const map=$(`rm_${sessId}`).value;
  if(!time||!label){ showToast('시간과 라운드는 필수입니다!','#ef4444'); return; }
  await push(ref(db,`sessions/${sessId}/rounds`),{time,label,map});
  $(`rt_${sessId}`).value=''; sel.value='';
  $(`rlc_${sessId}`).value=''; $(`rlc_${sessId}`).style.display='none'; $(`rm_${sessId}`).value='';
  showToast('✅ 라운드 추가 완료!');
};

window.openRoundEdit = function(sessId,roundId){
  const s=allSessions.find(x=>x.id===sessId); if(!s)return;
  const r=s.rounds.find(x=>x.id===roundId); if(!r)return;
  editRoundSessId=sessId; editRoundId=roundId;
  $('rTime').value=r.time||'';
  if(STD_ROUNDS.includes(r.label)){ $('rLabel').value=r.label||''; $('rLabelCustom').style.display='none'; }
  else { $('rLabel').value='custom'; $('rLabelCustom').style.display='block'; $('rLabelCustom').value=r.label||''; }
  $('rMap').value=r.map||'';
  $('roundModal').classList.add('open');
};

window.saveRound = async function(){
  if(!editRoundSessId||!editRoundId)return;
  const time=$('rTime').value;
  let label=$('rLabel').value; if(label==='custom') label=$('rLabelCustom').value.trim();
  const map=$('rMap').value;
  if(!time||!label){ showToast('시간과 라운드는 필수입니다!','#ef4444'); return; }
  await set(ref(db,`sessions/${editRoundSessId}/rounds/${editRoundId}`),{time,label,map});
  closeModal('roundModal'); showToast('✅ 라운드 수정 완료!');
};

window.delRound = async function(sessId,roundId){
  if(!confirm('라운드를 삭제할까요?'))return;
  await remove(ref(db,`sessions/${sessId}/rounds/${roundId}`)); showToast('🗑 라운드 삭제 완료!','#ef4444');
};

window.closeModal = function(id){
  $(id).classList.remove('open');
  if(id==='sessionModal') editSessId=null;
  else { editRoundSessId=null; editRoundId=null; }
};
['sessionModal','roundModal'].forEach(id=>{
  $(id).addEventListener('click',e=>{ if(e.target===$(id)) window.closeModal(id); });
});

// ── 계정 관리 ──
async function renderAccounts(){
  try{
    const snap=await get(ref(db,'admins'));
    if(!snap.exists()){ $('accountList').innerHTML='<div class="account-empty">등록된 계정이 없습니다.</div>'; return; }
    $('accountList').innerHTML=Object.keys(snap.val()).map(id=>{
      const isSuper=id.toLowerCase()==='admin1';
      return `<div class="account-item">
        <div class="account-info">
          <div class="account-avatar" style="${isSuper?'background:var(--accent);color:#fff;border-color:var(--accent);':''}">${id.charAt(0).toUpperCase()}</div>
          <div class="account-id">${id}</div>
        </div>
        <span class="account-role" style="${!isSuper?'background:rgba(71,85,105,.1);color:var(--txt2);border-color:rgba(71,85,105,.2);':''}">${isSuper?'SUPER ADMIN':'STAFF'}</span>
      </div>`;
    }).join('');
  } catch(e){ $('accountList').innerHTML='<div class="account-empty">❌ 목록 로드 실패</div>'; }
}

window.addAccount = async function(){
  if(!currentUser||currentUser.toLowerCase()!=='admin1'){ showToast('❌ 권한 없음','#ef4444'); return; }
  const id=$('aId').value.trim(), pw=$('aPw').value;
  if(!id||!pw){ showToast('아이디와 비밀번호를 입력하세요.','#ef4444'); return; }
  if(pw.length<4){ showToast('비밀번호는 4자 이상이어야 합니다.','#ef4444'); return; }
  try{
    const snap=await get(ref(db,`admins/${id}`));
    if(snap.exists()){ showToast('이미 존재하는 아이디입니다.','#ef4444'); return; }
    await set(ref(db,`admins/${id}`),{pw});
    $('aId').value=''; $('aPw').value='';
    showToast(`✅ 계정 "${id}" 추가 완료!`); renderAccounts();
  } catch(e){ showToast('계정 추가 실패','#ef4444'); }
};

// ── 테마 ──
let dark=false;
window.toggleTheme=function(){
  dark=!dark;
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  $('ico-dark').style.display=dark?'none':''; $('ico-light').style.display=dark?'':'none';
};

// ── 토스트 ──
function showToast(msg,bg='#10b981'){
  const t=$('toast'); t.textContent=msg; t.style.background=bg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
