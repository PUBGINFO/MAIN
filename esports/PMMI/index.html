<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG MOBILE ESPORTS - PMMI 2026</title>
<style>
  [data-theme="light"] {
    --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9; --surface3: #e2e8f0;
    --bd: #e2e8f0; --bd2: #cbd5e1; --txt: #0f172a; --txt2: #475569; --txt3: #94a3b8;
    --sh: 0 4px 20px rgba(15,23,42,0.05); --sh-sm: 0 2px 8px rgba(15,23,42,0.04);
    --accent: #b91c1c; --accent2: #991b1b;
    --thead-bg: #1e293b; --row-done: #f8fafc; --row-done-txt: #94a3b8;
    --row-next: rgba(185,28,28,0.04); --border-row: #f1f5f9;
    --input-bg: #ffffff; --input-bd: #cbd5e1;
    --btn-sec-bg: #e2e8f0; --btn-sec-txt: #475569; --btn-sec-hov: #cbd5e1;
    --session-hd: #1e293b; --session-border: #e2e8f0;
  }
  [data-theme="dark"] {
    --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --surface3: #475569;
    --bd: #334155; --bd2: #475569; --txt: #f8fafc; --txt2: #94a3b8; --txt3: #64748b;
    --sh: 0 4px 25px rgba(0,0,0,0.3); --sh-sm: 0 2px 8px rgba(0,0,0,0.2);
    --accent: #ef4444; --accent2: #dc2626;
    --thead-bg: #0f172a; --row-done: #151d2a; --row-done-txt: #475569;
    --row-next: rgba(239,68,68,0.06); --border-row: #334155;
    --input-bg: #0f172a; --input-bd: #475569;
    --btn-sec-bg: #334155; --btn-sec-txt: #94a3b8; --btn-sec-hov: #475569;
    --session-hd: #0f172a; --session-border: #334155;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--txt); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 30px 16px; transition: background .3s, color .3s; }

  h1 { text-align: center; font-size: 1.9rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .subtitle { text-align: center; color: var(--txt2); font-size: 0.88rem; margin-bottom: 6px; font-weight: 500; }
  .now-time { text-align: center; color: var(--txt3); font-size: 0.78rem; margin-bottom: 28px; font-variant-numeric: tabular-nums; }
  .page-brand { text-align: center; color: var(--txt3); font-size: 0.72rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }

  .tabs { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
  .tab { padding: 6px 16px; border-radius: 6px; border: 1px solid var(--bd2); background: var(--surface); color: var(--txt2); cursor: pointer; font-size: 0.82rem; font-weight: 500; transition: all 0.2s; }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .table-wrap { max-width: 960px; margin: 0 auto; border-radius: 6px; overflow: hidden; overflow-x: auto; -webkit-overflow-scrolling: touch; box-shadow: var(--sh); border: 1px solid var(--bd); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); table-layout: fixed; }
  
  col.col-date { width: 11%; }
  col.col-time { width: 11%; }
  col.col-cd   { width: 22%; }
  col.col-name { width: 11%; }
  col.col-rnd  { width: 11%; }
  col.col-map  { width: 11%; }
  col.col-team { width: 22%; }

  thead tr { background: var(--thead-bg); border-bottom: 2px solid var(--accent); }
  th { padding: 14px 10px; font-size: 0.8rem; font-weight: 700; text-align: center; white-space: nowrap; color: #fff; letter-spacing: 0.5px; }
  td { padding: 12px 10px; text-align: center; font-size: 0.88rem; border-bottom: 1px solid var(--border-row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--txt); transition: background 0.15s; }
  tbody tr:hover td { background: var(--surface2); }
  tr:last-child td { border-bottom: none; }
  
  tr.done td { color: var(--row-done-txt); background: var(--row-done); }
  tr.done:hover td { background: var(--row-done); }
  tr.next { background: var(--row-next); }
  tr.next .cd { color: var(--accent); font-weight: 700; }
  .cd { font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
  .badge { display: inline-block; background: var(--accent); color: #fff; font-size: 0.6rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }

  .session-row td { background: #334155 !important; padding: 12px 16px !important; border-bottom: none !important; }
  .session-container { display: flex; align-items: center; justify-content: space-between; width: 100%; width: -webkit-fill-available; }
  .session-info { display: flex; align-items: center; gap: 8px; color: #ffffff !important; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.5px; text-align: left; }
  [data-theme="dark"] .session-row td { background: #1e293b !important; }
  .session-row:hover td { background: #334155 !important; }
  [data-theme="dark"] .session-row:hover td { background: #1e293b !important; }
  .session-tag { display: inline-block; background: var(--accent); color: #fff; font-size: 0.65rem; font-weight: 800; padding: 2px 7px; border-radius: 4px; vertical-align: middle; }

  /* 종료된 세션 디자인 제어 (반투명 및 하단 이동용 마킹) */
  .session-row.session-ended td { background: #475569 !important; opacity: 0.6; }
  [data-theme="dark"] .session-row.session-ended td { background: #151d2a !important; opacity: 0.5; }
  .session-row.session-ended .session-tag { background: #64748b; }

  tr.live-on-row td { background: rgba(185,28,28,0.06); color: var(--accent); font-weight: 700; }
  tr.live-on-row .cd { color: var(--accent); font-weight: 800; animation: blink 1.5s infinite; }
  @keyframes blink { 50% { opacity: 0.5; } }

  tr.next-match-row td { background: rgba(235,91,91,0.06); color: #eb5b5b; font-weight: 700; }
  tr.next-match-row .cd { color: #eb5b5b; font-weight: 800; }
  [data-theme="dark"] tr.next-match-row td { color: #f08080; }
  [data-theme="dark"] tr.next-match-row .cd { color: #f08080; }
  .badge-match { display: inline-block; background: #eb5b5b; color: #fff; font-size: 0.6rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }

  .link-btn { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 4px; background: #b91c1c; color: #fff !important; font-size: 0.78rem; text-decoration: none; font-weight: 700; border: 1px solid rgba(0,0,0,0.1); transition: all 0.2s; cursor: pointer; height: 26px; line-height: 1; }
  .link-btn:hover { background: #991b1b; }
  tr.done .link-btn { opacity: 0.5; }

  .top-nav { display: flex; justify-content: flex-end; align-items: center; max-width: 960px; margin: 0 auto 20px; gap: 8px; }
  .nav-btn { padding: 6px 14px; border-radius: 4px; border: 1px solid var(--bd2); background: var(--surface); color: var(--txt2); cursor: pointer; font-size: 0.78rem; font-weight: 500; transition: all .2s; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface2); }
  .theme-btn { padding: 5px 10px; border-radius: 4px; border: 1px solid var(--bd2); background: var(--surface); color: var(--txt2); cursor: pointer; font-size: 0.95rem; transition: all .2s; line-height: 1; }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface2); }

  /* 관리자단 스타일 */
  #loginScreen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; }
  .login-box { background: var(--surface); border-radius: 6px; padding: 36px 40px; display: flex; flex-direction: column; gap: 14px; align-items: center; border: 1px solid var(--bd); min-width: 320px; box-shadow: var(--sh); }
  .login-box h2 { color: var(--txt); font-size: 1.4rem; font-weight: 700; }
  .login-box input { width: 100%; padding: 11px 14px; border-radius: 4px; border: 1px solid var(--input-bd); background: var(--input-bg); color: var(--txt); font-size: 0.95rem; text-align: center; }
  .login-box button { width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
  .form-box { max-width: 960px; margin: 0 auto 20px; background: var(--surface); border-radius: 6px; padding: 22px 24px; border: 1px solid var(--bd); box-shadow: var(--sh-sm); }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .form-group label { font-size: 0.75rem; color: var(--txt2); display: block; margin-bottom: 6px; font-weight: 600; }
  .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: var(--input-bg); border: 1px solid var(--input-bd); border-radius: 4px; color: var(--txt); font-size: 0.88rem; }
  .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { padding: 9px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.88rem; font-weight: 600; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--btn-sec-bg); color: var(--btn-sec-txt); }

  .sessions-wrap { max-width: 960px; margin: 0 auto 40px; display: flex; flex-direction: column; gap: 16px; }
  .session-card { background: var(--surface); border: 1px solid var(--bd); border-radius: 8px; overflow: hidden; box-shadow: var(--sh-sm); }
  .session-card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--surface2); border-bottom: 1px solid var(--bd); flex-wrap: wrap; gap: 8px; }
  .session-card-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .round-table { width: 100%; border-collapse: collapse; }
  .round-table th { padding: 9px 14px; font-size: 0.75rem; font-weight: 700; color: var(--txt3); border-bottom: 1px solid var(--border-row); text-align: center; }
  .round-table td { padding: 10px 14px; text-align: center; font-size: 0.85rem; border-bottom: 1px solid var(--border-row); color: var(--txt); }
  .round-add-row { padding: 12px 20px; border-top: 1px solid var(--border-row); display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; background: var(--surface2); }
  .round-add-row .form-group { margin: 0; flex: 1 1 140px; min-width: 140px; }
  
  .btn-sm { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
  .btn-edit { background: #2563eb; color: #fff; margin-right: 4px; }
  .btn-copy { background: #059669; color: #fff; margin-right: 4px; }
  .btn-del { background: #dc2626; color: #fff; }
  .btn-green { background: #059669; color: #fff; }

  .empty { text-align: center; padding: 40px; color: var(--txt3); font-size: 0.88rem; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 8px; padding: 28px; width: 90%; max-width: 480px; border: 1px solid var(--bd); }

  #superAdminSection { display: none; }
  .section-title { font-size: 1.05rem; font-weight: 700; color: var(--txt); margin: 32px auto 14px; max-width: 960px; }
  .account-list { max-width: 960px; margin: 0 auto 24px; background: var(--surface); border: 1px solid var(--bd); border-radius: 6px; overflow: hidden; }
  .account-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border-row); }
  .account-role { font-size: 0.65rem; font-weight: 700; color: var(--accent); background: rgba(185,28,28,0.1); border: 1px solid rgba(185,28,28,0.2); border-radius: 4px; padding: 3px 8px; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #10b981; color: #fff; padding: 12px 28px; border-radius: 4px; font-size: 0.88rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999; }
  .toast.show { opacity: 1; }

  /* 모바일 UI 미디어 쿼리 */
  @media (max-width: 768px) {
    body { padding: 16px 10px; }
    h1 { font-size: 1.5rem; }
    .tabs { gap: 4px; margin-bottom: 16px; }
    .tab { padding: 6px 12px; font-size: 0.8rem; }

    .table-wrap { border: none; box-shadow: none; overflow-x: visible !important; }
    table, tbody, tr { display: block !important; width: 100% !important; }
    table { table-layout: auto; }
    thead { display: none !important; }

    .session-row { 
      display: block !important;
      margin: 20px 0 8px 0 !important; 
      padding: 0 !important;
      border-radius: 8px !important;
      overflow: hidden;
    }
    .session-row td { 
      display: block !important; 
      width: 100% !important;
      padding: 12px 14px !important;
    }
    .session-container { display: flex !important; justify-content: space-between !important; align-items: center !important; }
    .session-info { font-size: 0.85rem !important; flex-wrap: wrap; gap: 6px !important; }

    tbody tr:not(.session-row) {
      background: var(--surface) !important;
      border: 1px solid var(--bd) !important;
      border-radius: 8px !important;
      margin-bottom: 8px !important;
      padding: 14px 14px !important;
      box-shadow: var(--sh-sm) !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 8px !important;
    }
    tbody tr:hover td { background: transparent !important; }
    tr.done { opacity: 0.55; background: var(--row-done) !important; }

    tbody tr:not(.session-row) td { 
      display: none !important; 
      padding: 0 !important; 
      border-bottom: none !important; 
      text-align: left !important;
      white-space: normal !important;
      font-size: 0.88rem !important;
      color: var(--txt) !important;
    }

    tbody tr:not(.session-row) td.m-top-flex {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      width: 100% !important;
      border-bottom: 1px dashed var(--bd) !important;
      padding-bottom: 6px !important;
    }
    
    tbody tr:not(.session-row) td.m-bottom-flex {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      width: 100% !important;
      padding-top: 2px !important;
    }
  }
</style>
</head>
<body>

<div id="publicScreen">
  <div class="top-nav">
    <button class="theme-btn" onclick="toggleTheme()">
      <span id="ico-dark">🌙</span><span id="ico-light" style="display:none">☀️</span>
    </button>
    <button class="nav-btn" onclick="goAdmin()">🔐 관리자</button>
  </div>
  <p class="page-brand">PUBG MOBILE ESPORTS</p>
  <h1>⚡ <span>PMMI 2026</span></h1>
  <p class="subtitle">실시간 일정 & 카운트다운</p>
  <p class="now-time" id="nowTime">-</p>
  <div class="tabs" id="tabs"></div>
  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="col-date">
        <col class="col-time">
        <col class="col-cd">
        <col class="col-name">
        <col class="col-rnd">
        <col class="col-map">
        <col class="col-team">
      </colgroup>
      <thead>
        <tr>
          <th>날짜</th><th>시간 (KST)</th><th>카운트다운</th>
          <th>대회명</th><th>라운드</th><th>MAP</th><th>팀</th>
        </tr>
      </thead>
      <tbody id="publicBody">
        <tr><td colspan="7" class="empty">⏳ 로딩 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="loginScreen">
  <div class="login-box">
    <h2>🔐 관리자 로그인</h2>
    <input type="text" id="idInput" placeholder="아이디" autocomplete="username" />
    <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="current-password" />
    <p class="login-error" id="loginError" style="color:red;font-size:0.8rem;"></p>
    <button onclick="doLogin()">로그인</button>
    <span class="back-btn" onclick="goPublic()" style="cursor:pointer;font-size:0.8rem;color:var(--txt3);margin-top:8px">← 돌아가기</span>
  </div>
</div>

<div id="adminScreen" style="display:none; padding:16px; max-width:960px; margin:0 auto;">
  <div class="admin-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <div>
      <h1>⚙️ 관리자 <span id="adminRoleBadge" style="font-size:0.75rem;vertical-align:middle;margin-left:6px;"></span></h1>
      <p class="subtitle" style="text-align:left;margin:0">PMMI 2026 일정 관리</p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="nav-btn" onclick="goPublic()">← 공개 페이지</button>
      <button class="nav-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="form-box">
    <h3>➕ 새 세션 추가 <small style="font-size:0.75rem;font-weight:400;color:var(--txt3)">(날짜 + 대회명 단위)</small></h3>
    <div class="form-grid">
      <div class="form-group">
        <label>날짜 *</label>
        <input type="date" id="sDate">
      </div>
      <div class="form-group">
        <label>대회명 *</label>
        <select id="sTitle">
          <option value="">-- 선택 --</option>
          <option value="PMMI">PMMI</option>
          <option value="PMCS">PMCS</option>
          <option value="PMPL">PMPL</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="form-group">
        <label>팀 구성</label>
        <select id="sTeam">
          <option value="">-- 선택 --</option>
          <option value="Red Group & Green Group">Red Group & Green Group</option>
          <option value="Red Group & Yellow Group">Red Group & Yellow Group</option>
          <option value="Yellow Group & Green Group">Yellow Group & Green Group</option>
          <option value="전체">전체</option>
        </select>
      </div>
      <div class="form-group">
        <label>중계 링크 (세션 공통)</label>
        <input type="url" id="sLink" placeholder="https://youtube.com/...">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="addSession()">세션 생성</button>
    </div>
  </div>

  <div class="sessions-wrap" id="sessionsWrap">
    <div style="text-align:center;padding:40px;color:var(--txt3)">⏳ 로딩 중...</div>
  </div>

  <div id="superAdminSection">
    <h2 class="section-title">👤 최고 관리자 전용 (계정 제어)</h2>
    <div class="form-box">
      <h3>➕ 일반 관리자 계정 추가</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>아이디 *</label>
          <input type="text" id="aId" placeholder="영문/숫자" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>비밀번호 *</label>
          <input type="password" id="aPw" placeholder="4자 이상" autocomplete="new-password" />
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="addAccount()">계정 추가</button>
      </div>
    </div>
    <div class="account-list" id="accountList">
      <div class="account-empty">로딩 중...</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="sessionModal">
  <div class="modal">
    <h3>✏️ 세션 수정</h3>
    <div class="form-grid" style="gap:14px;margin-bottom:16px">
      <div class="form-group">
        <label>날짜 *</label>
        <input type="date" id="mDate">
      </div>
      <div class="form-group">
        <label>대회명 *</label>
        <select id="mTitle">
          <option value="PMMI">PMMI</option>
          <option value="PMCS">PMCS</option>
          <option value="PMPL">PMPL</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="form-group">
        <label>팀 구성</label>
        <select id="mTeam">
          <option value="">-- 선택 --</option>
          <option value="Red Group & Green Group">Red Group & Green Group</option>
          <option value="Red Group & Yellow Group">Red Group & Yellow Group</option>
          <option value="Yellow Group & Green Group">Yellow Group & Green Group</option>
          <option value="전체">전체</option>
        </select>
      </div>
      <div class="form-group">
        <label>중계 링크</label>
        <input type="url" id="mLink" placeholder="https://...">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveSession()">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="roundModal">
  <div class="modal">
    <h3>✏️ 라운드 수정</h3>
    <div class="form-grid" style="gap:14px;margin-bottom:16px">
      <div class="form-group">
        <label>시간 (KST) *</label>
        <input type="time" id="rTime">
      </div>
      <div class="form-group">
        <label>라운드 *</label>
        <select id="rLabel" onchange="toggleRoundCustom()">

          <option value="Live on">Live on</option>
          <option value="Round 1">Round 1</option>
          <option value="Round 2">Round 2</option>
          <option value="Round 3">Round 3</option>
          <option value="Round 4">Round 4</option>
          <option value="Round 5">Round 5</option>
          <option value="Round 6">Round 6</option>
          <option value="custom">직접 입력</option>
        </select>
        <input type="text" id="rLabelCustom" placeholder="라운드명 직접 입력" style="display:none;margin-top:8px;">
      </div>
      <div class="form-group">
        <label>MAP</label>
        <select id="rMap">
          <option value="">-- 선택 --</option>
          <option value="Rondo">Rondo</option>
          <option value="Erangel">Erangel</option>
          <option value="Miramar">Miramar</option>

      <button class="btn btn-primary" onclick="saveRound()">저장</button>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, get }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyClByQBVoznJznLBTLcQ-6fszkOxGck99Y",
  authDomain: "countdown-pubg.firebaseapp.com",
  databaseURL: "https://countdown-pubg-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "countdown-pubg",
  storageBucket: "countdown-pubg.firebasestorage.app",
  messagingSenderId: "474098863700",
  appId: "1:474098863700:web:523b316e14b710970527c1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const pad = n => String(n).padStart(2,'0');
const $ = id => document.getElementById(id);

let allSessions = []; 
let loggedIn = false;
let currentUser = null;
let selectedDay = null;
let ticker = null;

let editingSessionId = null;
let editingRoundSessionId = null;
let editingRoundId = null;

function fmtDate(ts) {
  const d = new Date(ts);
  const day = ['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${day})`;
}
function fmtTime(ts) {
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtCd(ms) {
  if (ms <= 0) return null;
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return d > 0 ? `${d}일 ${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(h)}:${pad(m)}:${pad(sec)}`;
}
function dateToTs(dateStr, timeStr) {
  return new Date(`${dateStr}T${timeStr}:00`).getTime();
}

function showScreen(name) {
  $('publicScreen').style.display = 'none';
  $('loginScreen').style.display  = 'none';
  $('adminScreen').style.display  = 'none';
  if (name === 'public') {
    $('publicScreen').style.display = 'block';
    window.location.hash = '';
  } else if (name === 'login') {
    $('loginScreen').style.display = 'flex';
    window.location.hash = 'admin';
    setTimeout(() => $('idInput').focus(), 100);
  } else if (name === 'admin') {
    $('adminScreen').style.display = 'block';
    window.location.hash = 'admin';
    if (currentUser && currentUser.toLowerCase() === 'admin1') {
      $('superAdminSection').style.display = 'block';
      $('adminRoleBadge').className = 'account-role';
      $('adminRoleBadge').textContent = 'SUPER ADMIN';
      renderAccounts();
    } else {
      $('superAdminSection').style.display = 'none';
      $('adminRoleBadge').className = 'account-role';
      $('adminRoleBadge').style.cssText = 'background:rgba(71,85,105,0.1);color:var(--txt2);border-color:rgba(71,85,105,0.2);';
      $('adminRoleBadge').textContent = 'STAFF';
    }
    renderAdmin();
  }
}

window.goAdmin  = () => loggedIn ? showScreen('admin') : showScreen('login');
window.goPublic = () => showScreen('public');
window.doLogout = () => { loggedIn = false; currentUser = null; showScreen('public'); };

window.doLogin = async function() {
  const id = $('idInput').value.trim();
  const pw = $('pwInput').value;
  if (!id || !pw) { $('loginError').textContent = '⚠️ 아이디와 비밀번호를 입력하세요.'; return; }
  try {
    const snap = await get(ref(db, `admins/${id}`));
    if (snap.exists() && snap.val().pw === pw) {
      loggedIn = true; currentUser = id;
      $('idInput').value = ''; $('pwInput').value = ''; $('loginError').textContent = '';
      showScreen('admin');
    } else {
      $('loginError').textContent = '❌ 아이디 또는 비밀번호가 틀렸습니다.';
      $('pwInput').value = ''; $('pwInput').focus();
    }
  } catch(e) { $('loginError').textContent = '❌ 접근 거부 또는 오류.'; }
};
['idInput','pwInput'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') window.doLogin(); }));

function handleHash() {
  if (window.location.hash === '#admin') { loggedIn ? showScreen('admin') : showScreen('login'); }
  else { showScreen('public'); }
}
window.addEventListener('hashchange', handleHash);
handleHash();

onValue(ref(db, 'sessions'), snapshot => {
  const data = snapshot.val();
  allSessions = data
    ? Object.entries(data).map(([id, v]) => ({
        id,
        date: v.date || '',
        title: v.title || '',
        team: v.team || '',
        link: v.link || '',
        rounds: v.rounds
          ? Object.entries(v.rounds).map(([rid, rv]) => ({ id: rid, ...rv }))
          : []
      }))
    : [];

  allSessions.sort((a,b) => a.date.localeCompare(b.date));

  renderPublic();
  if (loggedIn) renderAdmin();
});

function renderPublic() {
  const now = Date.now();
  const nd = new Date(now);
  $('nowTime').textContent =
    `현재 시각: ${nd.getFullYear()}/${pad(nd.getMonth()+1)}/${pad(nd.getDate())} ` +
    `${pad(nd.getHours())}:${pad(nd.getMinutes())}:${pad(nd.getSeconds())}`;

  if (!allSessions.length) {
    $('publicBody').innerHTML = '<tr><td colspan="7" class="empty">등록된 일정이 없습니다</td></tr>';
    $('tabs').innerHTML = '';
    return;
  }

  const daySet = new Set(allSessions.map(s => s.date));
  const days = [...daySet].sort();
  $('tabs').innerHTML = [
    `<button class="tab ${!selectedDay?'active':''}" onclick="window._day(null)">전체</button>`,
    ...days.map(d => {
      const ts = dateToTs(d, '00:00');
      return `<button class="tab ${selectedDay===d?'active':''}" onclick="window._day('${d}')">${fmtDate(ts)}</button>`;
    })
  ].join('');

  // 💡 [정렬 로직 핵심 커스텀 변형] 
  // 세션 내부의 모든 라운드가 현재 시각(now)보다 과거인지 검사하여 '완전 종료 세션' 판정 필드를 부여합니다.
  let dynamicSessions = allSessions.map(sess => {
    const isSessionEnded = sess.rounds.length > 0 && sess.rounds.every(r => {
      const rTs = dateToTs(sess.date, r.time || '00:00');
      // Live on 타이틀을 가진 경기는 정해진 시작 시각 기준 1시간 동안 종료되지 않은 상태로 간주
      if (r.label === 'Live on') {
        return now >= rTs + 3600000;
      }
      return now >= rTs;
    });
    return { ...sess, isSessionEnded };
  });

  // 💡 [요청 사안 완벽 반영] 
  // 1단계 기본 조건: 완전히 종료된 세션(`isSessionEnded === true`)을 배열의 맨 뒤(아래)로 밀어냅니다.
  // 2단계 보조 조건: 동일 그룹 내에서는 날짜 선행 오름차순 정렬을 유지합니다.
  dynamicSessions.sort((a, b) => {
    if (a.isSessionEnded !== b.isSessionEnded) {
      return a.isSessionEnded ? 1 : -1;
    }
    return a.date.localeCompare(b.date);
  });

  // 순위 결정용 flatRounds 데이터 풀 재생성
  let flatRounds = [];
  dynamicSessions.forEach(sess => {
    if (selectedDay && sess.date !== selectedDay) return;
    
    // 내부 라운드 시간 정렬
    const sortedRounds = sess.rounds.slice().sort((a,b) => (a.time || '').localeCompare(b.time || ''));
    sortedRounds.forEach(r => {
      flatRounds.push({
        ...r,
        parentSession: sess,
        ts: dateToTs(sess.date, r.time || '00:00')
      });
    });
  });

  // 전역 NEXT MATCH / NEXT LIVE 배지 타겟팅 선정
  let absoluteNextMatch = flatRounds.find(r => r.label === 'Live on' && (now >= r.ts && now - r.ts < 3600000));
  if (!absoluteNextMatch) {
    absoluteNextMatch = flatRounds.find(r => r.ts > now);
  }

  let html = '';
  let lastSessionId = null;

  if (flatRounds.length === 0) {
    $('publicBody').innerHTML = '<tr><td colspan="7" class="empty">선택한 날짜에 표시할 라운드가 없습니다.</td></tr>';
    return;
  }

  flatRounds.forEach(r => {
    const sess = r.parentSession;
    
    // 💡 정렬 기준이 바뀌었으므로 세션 경계면 분기 처리
    if (lastSessionId !== sess.id) {
      lastSessionId = sess.id;
      const sessionDateTs = dateToTs(sess.date, '00:00');
      const headerLinkHtml = sess.link
        ? `<a href="${sess.link}" target="_blank" class="link-btn">📺 중계</a>`
        : '';

      html += `
        <tr class="session-row ${sess.isSessionEnded ? 'session-ended' : ''}">
          <td colspan="7">
            <div class="session-container">
              <div class="session-info">
                <span class="session-tag">${sess.title || '대회'}</span>
                <span>${fmtDate(sessionDateTs)}</span>
                <span>•</span>
                <span>${sess.team || '팀 정보 미정'}</span>
                ${sess.isSessionEnded ? '<span style="color:#cbd5e1;font-size:0.75rem;">(종료됨)</span>' : ''}
              </div>
              ${headerLinkHtml}
            </div>
          </td>
        </tr>`;
    }

    const ms = r.ts - now;
    const isLiveOn = r.label === 'Live on';
    
    let done = ms <= 0;
    if (isLiveOn && now >= r.ts && now - r.ts < 3600000) {
      done = false;
    }

    const cd = fmtCd(ms);
    const isAbsoluteNext = absoluteNextMatch && r.id === absoluteNextMatch.id && sess.id === absoluteNextMatch.parentSession.id;
    const isNextLive = isAbsoluteNext && isLiveOn;
    const isNextMatch = isAbsoluteNext && !isLiveOn;

    let badgeHtml = '';
    if (isNextLive) badgeHtml = '<span class="badge" style="background:#10b981; margin-left:6px;">NEXT LIVE</span>';
    else if (isNextMatch) badgeHtml = '<span class="badge-match">NEXT MATCH</span>';

    let cdCell = '';
    if (isLiveOn && now >= r.ts && now - r.ts < 3600000) {
      cdCell = `<span class="cd" style="color:#10b981; font-weight:800;">● LIVE BROADCAST</span>${badgeHtml}`;
    } else if (cd) {
      cdCell = `<span class="cd">${cd}</span>${badgeHtml}`;
    } else {
      cdCell = `<span style="color:var(--txt3); font-weight:600;">✅ 종료</span>`;
    }

    html += `
      <tr class="${done ? 'done' : ''} ${isNextLive ? 'live-on-row' : ''} ${isNextMatch ? 'next-match-row' : ''}">
        <td>${fmtDate(r.ts)}</td>
        <td>${fmtTime(r.ts)}</td>
        <td>${cdCell}</td>
        <td>${sess.title || '-'}</td>
        <td>${r.label || '-'}</td>
        <td>${r.map ? r.map : '-'}</td>
        <td>${sess.team || '-'}</td>

        <td class="m-top-flex">
          <span style="font-size: 1.25rem !important; font-weight: 800 !important;">${fmtTime(r.ts)}</span>
          <span style="font-size: 1.05rem !important; font-weight: 700 !important;">${r.label || '-'}</span>
        </td>
        <td class="m-bottom-flex">
          <div style="text-align: left;">${cdCell}</div>
          <span style="font-size: 0.85rem !important; font-weight: 600; color: var(--txt2);">${r.map ? r.map : '-'}</span>
        </td>
      </tr>`;
  });

  $('publicBody').innerHTML = html;
}

window._day = function(d) { selectedDay = d; renderPublic(); };
if (ticker) clearInterval(ticker);
ticker = setInterval(renderPublic, 1000);

function renderAdmin() {
  if (!allSessions.length) {
    $('sessionsWrap').innerHTML = '<div style="text-align:center;padding:40px;color:var(--txt3)">등록된 세션이 없습니다. 새 세션을 추가하세요.</div>';
    return;
  }
  $('sessionsWrap').innerHTML = allSessions.map(sess => renderSessionCard(sess)).join('');
}

function renderSessionCard(sess) {
  const roundRows = sess.rounds.length
    ? sess.rounds
        .slice().sort((a,b) => (a.time||'').localeCompare(b.time||''))
        .map(r => `
          <tr>
            <td>${r.time || '-'}</td>
            <td>${r.label || '-'}</td>
            <td>${r.map || '-'}</td>
            <td>
              <button class="btn-sm btn-edit" onclick="openRoundEdit('${sess.id}','${r.id}')">수정</button>
              <button class="btn-sm btn-del"  onclick="delRound('${sess.id}','${r.id}')">삭제</button>
            </td>
          </tr>`).join('')
    : `<tr><td colspan="4" class="round-empty">라운드가 없습니다. 아래에서 추가하세요.</td></tr>`;

  const linkDisplay = sess.link
    ? `<a href="${sess.link}" target="_blank" style="color:var(--accent);font-size:0.75rem;word-break:break-all;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;">${sess.link}</a>`
    : `<span style="color:var(--txt3);font-size:0.75rem">링크 없음</span>`;

  return `
    <div class="session-card">
      <div class="session-card-header">
        <div class="session-card-title">
          <span class="session-tag">${sess.title || '대회'}</span>
          <strong>${sess.date}</strong>
          <span class="session-card-meta">${sess.team || '팀 미정'}</span>
          <span>·</span>
          ${linkDisplay}
        </div>
        <div class="session-card-actions">
          <button class="btn-sm btn-edit" onclick="openSessionEdit('${sess.id}')">세션 수정</button>
          <button class="btn-sm btn-copy" onclick="copySession('${sess.id}')">세션 복사</button>
          <button class="btn-sm btn-del"  onclick="delSession('${sess.id}')">세션 삭제</button>
        </div>
      </div>
      <table class="round-table">
        <thead>
          <tr><th>시간 (KST)</th><th>라운드</th><th>MAP</th><th>관리</th></tr>
        </thead>
        <tbody>${roundRows}</tbody>
      </table>
      <div class="round-add-row">
        <div class="form-group">
          <label>시간 *</label>
          <input type="time" id="rt_${sess.id}">
        </div>
        <div class="form-group">
          <label>라운드 *</label>
          <select id="rl_${sess.id}" onchange="toggleRoundAddCustom('${sess.id}')">
            <option value="">-- 선택 --</option>
            <option value="Live on">Live on</option>
            <option value="Round 1">Round 1</option>
            <option value="Round 2">Round 2</option>
            <option value="Round 3">Round 3</option>
            <option value="Round 4">Round 4</option>
            <option value="Round 5">Round 5</option>
            <option value="Round 6">Round 6</option>
            <option value="custom">직접 입력</option>
          </select>
          <input type="text" id="rlc_${sess.id}" placeholder="라운드명" style="display:none;margin-top:6px;">
        </div>
        <div class="form-group">
          <label>MAP</label>
          <select id="rm_${sess.id}">
            <option value="">-- 선택 --</option>
            <option value="Rondo">Rondo</option>
            <option value="Erangel">Erangel</option>
            <option value="Miramar">Miramar</option>
          </select>
        </div>
        <button class="btn btn-green" style="padding:7px 16px;font-size:0.82rem;white-space:nowrap" onclick="addRound('${sess.id}')">+ 라운드 추가</button>
      </div>
    </div>`;
}

window.addSession = async function() {
  const date  = $('sDate').value;
  const title = $('sTitle').value;
  const team  = $('sTeam').value;
  const link  = $('sLink').value.trim();
  if (!date || !title) { showToast('날짜와 대회명은 필수입니다!', '#ef4444'); return; }
  await push(ref(db, 'sessions'), { date, title, team, link });
  $('sDate').value = ''; $('sTitle').value = ''; $('sTeam').value = ''; $('sLink').value = '';
  showToast('✅ 세션 생성 완료!');
};

window.copySession = async function(sessId) {
  const original = allSessions.find(s => s.id === sessId);
  if (!original) return;
  if (!confirm(`[${original.date} - ${original.title}] 세션을 복사하시겠습니까?`)) return;

  try {
    const newSessionRef = push(ref(db, 'sessions'));
    const sessionData = {
      date: original.date,
      title: original.title,
      team: original.team,
      link: original.link
    };

    if (original.rounds && original.rounds.length > 0) {
      const roundsObj = {};
      original.rounds.forEach(r => {
        const newRoundKey = push(ref(db, `dummy`)).key;
        roundsObj[newRoundKey] = { time: r.time || '', label: r.label || '', map: r.map || '' };
      });
      sessionData.rounds = roundsObj;
    }

    await set(newSessionRef, sessionData);
    showToast('✅ 세션 전체 복사 성공!');
  } catch(e) { showToast('❌ 세션 복사 오류 발생.', '#ef4444'); }
};

window.openSessionEdit = function(sessId) {
  const sess = allSessions.find(s => s.id === sessId);
  if (!sess) return;
  editingSessionId = sessId;
  $('mDate').value  = sess.date;
  $('mTitle').value = sess.title;
  $('mTeam').value  = sess.team;
  $('mLink').value  = sess.link;
  $('sessionModal').classList.add('open');
};

window.closeModal = function() {
  $('sessionModal').classList.remove('open');
  editingSessionId = null;
};

window.saveSession = async function() {
  if (!editingSessionId) return;
  const date  = $('mDate').value;
  const title = $('mTitle').value;
  const team  = $('mTeam').value;
  const link  = $('mLink').value.trim();
  if (!date || !title) { showToast('날짜와 대회명은 필수입니다!', '#ef4444'); return; }
  const sess = allSessions.find(s => s.id === editingSessionId);
  const roundsData = {};
  if (sess && sess.rounds.length) {
    sess.rounds.forEach(r => { roundsData[r.id] = { time: r.time, label: r.label, map: r.map }; });
  }
  await set(ref(db, `sessions/${editingSessionId}`), { date, title, team, link, rounds: roundsData });
  closeModal();
  showToast('✅ 세션 수정 완료!');
};

window.delSession = async function(sessId) {
  if (!confirm('세션 전체를 삭제할까요?')) return;
  await remove(ref(db, `sessions/${sessId}`));
  showToast('🗑 세션 삭제 완료!', '#ef4444');
};

window.toggleRoundAddCustom = function(sessId) {
  const sel = $(`rl_${sessId}`);
  const inp = $(`rlc_${sessId}`);
  if (sel && inp) inp.style.display = sel.value === 'custom' ? 'block' : 'none';
};

window.addRound = async function(sessId) {
  const time  = $(`rt_${sessId}`).value;
  const selEl = $(`rl_${sessId}`);
  let label   = selEl.value;
  if (label === 'custom') label = $(`rlc_${sessId}`).value.trim();
  const map   = $(`rm_${sessId}`).value;

  if (!time || !label) { showToast('시간과 라운드는 필수입니다!', '#ef4444'); return; }
  await push(ref(db, `sessions/${sessId}/rounds`), { time, label, map });
  $(`rt_${sessId}`).value = ''; selEl.value = ''; $(`rlc_${sessId}`).value = '';
  $(`rlc_${sessId}`).style.display = 'none'; $(`rm_${sessId}`).value = '';
  showToast('✅ 라운드 추가 완료!');
};

window.openRoundEdit = function(sessId, roundId) {
  const sess = allSessions.find(s => s.id === sessId);
  if (!sess) return;
  const round = sess.rounds.find(r => r.id === roundId);
  if (!round) return;
  editingRoundSessionId = sessId; editingRoundId = roundId;
  $('rTime').value = round.time || '';
  const stdRounds = ['Live on','Round 1','Round 2','Round 3','Round 4','Round 5','Round 6'];
  if (round.label && !stdRounds.includes(round.label)) {
    $('rLabel').value = 'custom';
    $('rLabelCustom').style.display = 'block';
    $('rLabelCustom').value = round.label;
  } else {
    $('rLabel').value = round.label || '';
    $('rLabelCustom').style.display = 'none';
    $('rLabelCustom').value = '';
  }
  $('rMap').value = round.map || '';
  $('roundModal').classList.add('open');
};

window.toggleRoundCustom = function() {
  const sel = $('rLabel');
  const inp = $('rLabelCustom');
  if (inp) inp.style.display = sel.value === 'custom' ? 'block' : 'none';
};

window.closeRoundModal = function() {
  $('roundModal').classList.remove('open');
  editingRoundSessionId = null; editingRoundId = null;
};

window.saveRound = async function() {
  if (!editingRoundSessionId || !editingRoundId) return;
  const time = $('rTime').value;
  let label  = $('rLabel').value;
  if (label === 'custom') label = $('rLabelCustom').value.trim();
  const map  = $('rMap').value;
  if (!time || !label) { showToast('시간과 라운드는 필수입니다!', '#ef4444'); return; }
  await set(ref(db, `sessions/${editingRoundSessionId}/rounds/${editingRoundId}`), { time, label, map });
  closeRoundModal();
  showToast('✅ 라운드 수정 완료!');
};

window.delRound = async function(sessId, roundId) {
  if (!confirm('라운드를 삭제할까요?')) return;
  await remove(ref(db, `sessions/${sessId}/rounds/${roundId}`));
  showToast('🗑 라운드 삭제 완료!', '#ef4444');
};

async function renderAccounts() {
  if (!currentUser || currentUser.toLowerCase() !== 'admin1') return;
  try {
    const snap = await get(ref(db, 'admins'));
    if (!snap.exists()) { $('accountList').innerHTML = '<div class="account-empty">등록된 계정이 없습니다.</div>'; return; }
    let html = '';
    Object.keys(snap.val()).forEach(id => {
      const isSuper = id.toLowerCase() === 'admin1';
      html += `
        <div class="account-item">
          <div class="account-info" style="display:flex;align-items:center;gap:10px;">
            <div class="account-id" style="font-weight:600;">${id}</div>
          </div>
          <span class="account-role" style="${!isSuper?'background:rgba(71,85,105,0.1);color:var(--txt2);border-color:rgba(71,85,105,0.2);':''}">
            ${isSuper ? 'SUPER ADMIN' : 'STAFF'}
          </span>
        </div>`;
    });
    $('accountList').innerHTML = html;
  } catch(e) { $('accountList').innerHTML = '<div class="account-empty">❌ 목록 로드 실패</div>'; }
}

window.addAccount = async function() {
  if (!currentUser || currentUser.toLowerCase() !== 'admin1') { showToast('❌ 권한 없음', '#ef4444'); return; }
  const id = $('aId').value.trim(), pw = $('aPw').value;
  if (!id || !pw) { showToast('아이디와 비밀번호를 입력하세요.', '#ef4444'); return; }
  if (pw.length < 4) { showToast('비밀번호는 4자 이상이어야 합니다.', '#ef4444'); return; }
  try {
    const snap = await get(ref(db, `admins/${id}`));
    if (snap.exists()) { showToast('이미 존재하는 아이디입니다.', '#ef4444'); return; }
    await set(ref(db, `admins/${id}`), { pw });
    $('aId').value = ''; $('aPw').value = '';
    showToast(`✅ 계정 "${id}" 추가 완료!`);
    renderAccounts();
  } catch(e) { showToast('계정 추가 실패', '#ef4444'); }
};

let dark = false;
window.toggleTheme = function() {
  dark = !dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  $('ico-dark').style.display  = dark ? 'none' : '';
  $('ico-light').style.display = dark ? '' : 'none';
};

['sessionModal','roundModal'].forEach(id => {
  $(id).addEventListener('click', e => { if(e.target === $(id)) { id === 'sessionModal' ? closeModal() : closeRoundModal(); } });
});

function showToast(msg, bg = '#10b981') {
  const t = $('toast');
  t.textContent = msg; t.style.background = bg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
